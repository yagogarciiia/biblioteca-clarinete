olái Rimski-Kórsakov, decisiva para a súa comprensión da orquestración. A colaboración con Sergei Diaghilev e os Ballets Russes —O paxaro de lume, Petrushka e A consagración da primavera— situouno no centro da modernidade musical europea. A súa longa carreira atravesou etapas rusa, neoclásica e serial.","work_context":"Diaghilev encargou o ballet para a temporada parisiense dos Ballets Russes de 1910, con coreografía de Michel Fokine. O argumento combina materiais do folclore ruso: o príncipe Iván, o Paxaro de Lume e o reino encantado de Kashchei. A estrea tivo lugar en París o 25 de xuño de 1910. Stravinski preparou despois varias suites; a de 1919, cunha orquestra máis práctica que a do ballet orixinal, é unha das versións máis interpretadas e a que aparece con frecuencia nas audicións.","excerpts":[{"name":"Suite de 1919 · Variación do Paxaro de Lume","location":"Corte profesional moi habitual: desde [9] ata 5 compases despois de [18]. Outras listas simplemente piden a Variación completa.","context":"Despois da aparición e danza do Paxaro de Lume, a Variación concentra o carácter sobrenatural e imprevisible da criatura nunha escrita breve e vertixinosa.","role":"O clarinete participa como voz moi exposta dentro dunha textura cambiante de madeiras. Non é un “solo cantabile”, senón un retrato tímbrico e cinético: debe soar áxil, brillante, lixeiro e absolutamente controlado, sen que a dificultade técnica converta o fragmento en mecánico.","technique":"Coordinación lingua-dedos, cambios rápidos de rexistro, cromatismo, precisión de ataques e silencios, subdivisión interna, control da dinámica e capacidade de manter lixeireza a gran velocidade. Convén estudar primeiro o ritmo sen acelerar e despois reconstruír os xestos completos.","pages":"Non aparece no EP8661.","recording":"Chicago Symphony Orchestra · Carlo Maria Giulini (Warner/EMI, 1970)","recording_url":"https://classical.music.apple.com/us/album/1559307340","recording_locator":"Abrir a pista II, “Dance of the Firebird – The Firebird’s Variation” (1:40). O extracto de audición está dentro desta pista; seguir [9] → 5 compases despois de [18] na particella.","materials":[{"type":"pdf","label":"PDF · Variación do Paxaro de Lume","url":"https://clarinet.org/wp-content/uploads/2026/09/2027-ICA-ORCHESTRAL-AUDITION-COMPETITION.pdf#page=13","source":"International Clarinet Association · 2027","note":"O paquete oficial imprime a Variación de 1919 desde [9] ata [18].","coverage":"Extracto exacto"},{"type":"web","label":"Requisitos de audición · Variación completa","url":"https://clarinet.org/competitions/orchestral-audition-competition/","source":"International Clarinet Association","note":"Confirma a Variación como extracto de primeiro clarinete.","coverage":"Extracto en web"}]},{"name":"Suite de 1919 · Danza infernal de Kashchei (extracto adicional)","location":"Un corte profesional recente pide desde [9] ata 1 compás antes de [14] dentro da Danza infernal. É menos universal que a Variación, pero aparece con frecuencia suficiente como para traballalo.","context":"Kashchei e os seus súbditos son obrigados polo Paxaro de Lume a bailar freneticamente. A música é agresiva, sincopada e construída sobre unha enerxía rítmica case física.","role":"O clarinete deixa a lixeireza “aleteante” da Variación e entra nunha masa orquestral moito máis incisiva. O reto é conservar definición e carácter dentro do tutti, sen forzar a emisión nin atrasarse respecto do pulso.","technique":"Articulación moi precisa, síncopas e acentos, resistencia, rapidez de lectura, homoxeneidade entre rexistros e control do son forte. Practicar por células rítmicas e con metrónomo antes de engadir dinámica e carácter.","pages":"Non aparece no EP8661.","recording":"Chicago Symphony Orchestra · Carlo Maria Giulini (Warner/EMI, 1970)","recording_url":"https://classical.music.apple.com/us/album/1559307340","recording_locator":"Abrir a pista IV, “Infernal Dance of King Kashchei” (5:08). Localizar [9] → 1 compás antes de [14] na parte; a numeración pertence a este número da Suite.","materials":[{"type":"pdf","label":"PDF de audición · Danza infernal","url":"https://assets.muvac.com/vacancies/gyegpkqy/docs/756499/1768831575099-principal_clarinet_audition_excerpts_per_20_jan.pdf?download=","source":"Muvac · audición profesional","note":"PDF de extractos da audición profesional citada na ficha; localizar [9] → 1 antes de [14] dentro da Danza infernal.","coverage":"Extracto de audición"},{"type":"web","label":"Partitura/referencia da Suite de 1919","url":"https://imslp.org/wiki/The_Firebird_(suite),_K010_(Stravinsky,_Igor)","source":"IMSLP","note":"A dispoñibilidade da partitura depende da lexislación territorial; úsase como referencia bibliográfica.","coverage":"Partitura / referencia"}]}],"study":["Traballar primeiro a Variación, porque é o extracto de clarinete máis universal da Suite de 1919; engadir despois a Danza infernal como complemento técnico.","Escoitar a pista completa antes de illar o clarinete: o sentido do fragmento depende da reacción a outras madeiras e aos cambios súbitos de textura.","Comparar a cor da obra con Rimski-Kórsakov: hai unha continuidade clara de orquestración rusa, pero a organización rítmica de Stravinski é moito máis cortante e moderna.","Usar sempre a particella da mesma versión (1919) que a lista de audición: o ballet de 1910 e outras suites non teñen idéntica numeración."],"score_url":"https://imslp.org/wiki/The_Firebird_(suite),_K010_(Stravinsky,_Igor)","score_note":"IMSLP: ficha específica da Suite de 1919 con partitura e materiais cando a lexislación do territorio o permite. En España/UE a obra pode seguir sometida a restricións; usar a páxina tamén como referencia bibliográfica e comprobar a dispoñibilidade legal.","recording":"Carlo Maria Giulini · Chicago Symphony Orchestra (1970). Edición moi clara e dividida por números, útil para localizar rapidamente os dous extractos.","recording_url":"https://classical.music.apple.com/us/album/1559307340","recording_note":"A Variación está na pista II (1:40) e a Danza infernal na pista IV (5:08). O localizador fino faise por números de ensaio, non por un minuto universal.","sources":[["Barcelona Symphony Orchestra: Firebird Suite 1919, Variación [9] → 5 despois de [18]","https://assets.muvac.com/vacancies/j16vzjr1/docs/678734/1753785327183-principal_clarinet_audition_rules.pdf?download="],["International Clarinet Association: Firebird Suite (1919), Variation L’oiseau de Feu","https://clarinet.org/competitions/orchestral-audition-competition/"],["New York String Orchestra Seminar 2026: Variación completa","https://ww3.newschool.edu/new-york-string-orchestra-seminar/apply/"],["Audición profesional: Danza infernal [9] → 1 antes de [14]","https://assets.muvac.com/vacancies/gyegpkqy/docs/756499/1768831575099-principal_clarinet_audition_excerpts_per_20_jan.pdf?download="],["IMSLP: The Firebird Suite (1919)","https://imslp.org/wiki/The_Firebird_(suite),_K010_(Stravinsky,_Igor)"],["Apple Music Classical: Giulini / Chicago Symphony (1970)","https://classical.music.apple.com/us/album/1559307340"],["Wikimedia Commons: retrato de Igor Stravinski","https://commons.wikimedia.org/wiki/File:Igor_Stravinsky_LOC_32392u.jpg"]],"portrait_url":"https://commons.wikimedia.org/wiki/Special:Redirect/file/Igor_Stravinsky_LOC_32392u.jpg","period":"Século XX · modernismo ruso / primeira etapa de Stravinski","genre":"Ballet nun acto (1910) · suite orquestral de concerto (versión de 1919)","year":"1909–1910 · Suite de 1919","work_structure":"Na Suite de 1919: Introdución · Danza do Paxaro de Lume · Variación do Paxaro de Lume · Rolda das princesas · Danza infernal do rei Kashchei · Berceuse · Finale. A distribución en pistas cambia segundo a edición discográfica; algunhas unen Danza e Variación.","influences":"A obra conserva unha forte pegada da escola de Rimski-Kórsakov: brillo orquestral, asociación de cores instrumentais co fantástico e uso de linguaxe cromática/octatónica para o mundo máxico. Ao mesmo tempo xa aparecen trazos persoais de Stravinski: ostinati, acentos desprazados, precisión rítmica e bloques de cor moi contrastados. O material narrativo procede de contos e motivos do folclore ruso máis que dunha única fonte literaria.","portrait_credit":"Igor Stravinski, George Grantham Bain Collection, ca. 1920–1925 · Library of Congress / Wikimedia Commons","portrait_source":"https://commons.wikimedia.org/wiki/File:Igor_Stravinsky_LOC_32392u.jpg","reviewed":"2026-10-01"},{"id":"3-1-21","course":3,"quarter":1,"instrument":"Clarinete en Si♭ e La","composer":"Respighi","work":"Piñeiros de Roma","probespiel":"19","status":"Ficha revisada · lista","summary":"Poema sinfónico (1924), segundo panel da triloxía romana de Respighi. O grande extracto de clarinete está no III movemento, “I pini del Gianicolo”, un dos solos líricos máis característicos do repertorio de clarinete en La.","composer_bio":"Ottorino Respighi (1879–1936) foi compositor, violinista, violista e musicólogo italiano. Durante unha etapa profesional en San Petersburgo entrou en contacto coa escola de orquestración de Rimski-Kórsakov, influencia decisiva no seu uso posterior da cor orquestral. En 1913 instalouse en Roma como profesor da Accademia di Santa Cecilia. Xunto ao colorismo moderno, cultivou un profundo interese pola música italiana antiga, que tamén marcou boa parte da súa produción.","work_context":"Pini di Roma foi completada en 1924 e estreada no Teatro Augusteo de Roma o 14 de decembro dese ano, dirixida por Bernardino Molinari. É a segunda obra da chamada triloxía romana, entre Fontane di Roma e Feste romane. Cada movemento transforma un lugar de Roma nunha escena sonora. No III, o Janículo aparece baixo a luz da lúa: tras unha breve cadencia do piano, o clarinete introduce unha longa melodía contemplativa; ao final Respighi incorpora unha gravación real de ruiseñor, un recurso tecnolóxico moi singular para a época.","excerpts":[{"name":"III. I pini del Gianicolo · solo de clarinete","location":"III movemento, Lento. Corte de audición moi habitual: anacrusa de [13] ata [15]; outras listas amplíano ata despois de [17].","context":"O movemento abandona a actividade dos cadros anteriores e crea unha escena nocturna. O piano abre o espazo e o clarinete entra como primeira gran voz lírica do Janículo.","role":"Clarinete solista en La: liña longa, suspendida e cantabile. É o centro expresivo da primeira parte do movemento e debe integrarse nunha textura extremadamente transparente.","technique":"Legato entre rexistros, respiración planificada, afinación, control do pianissimo, homoxeneidade de timbre, dirección da frase e flexibilidade sen perder o pulso.","pages":"EP8661: p. 19","recording":"Chicago Symphony Orchestra · Fritz Reiner (RCA Living Stereo, 1959)","recording_url":"https://classical.music.apple.com/us/album/305779169","recording_locator":"Na edición de Apple Classical, abre a pista III “The Pines of the Janiculum” (6:28). O solo aparece ao comezo do movemento, inmediatamente despois da breve introdución/cadencia do piano. Referencia de partitura: anacrusa de [13]."}],"study":["Escoitar o III movemento completo antes de tocar: identificar piano, entrada do clarinete, evolución da textura e ruiseñor final.","Traballar a melodía por arcos de frase, non compás a compás; planificar respiracións que non destrúan a continuidade.","Comparar este uso do clarinete coa brillantez do Capricho español para percibir a pegada de Rimski-Kórsakov transformada por Respighi.","Practicar o inicio desde silencio absoluto: o control do ataque e do pianissimo é parte esencial do efecto."],"score_url":"https://imslp.org/wiki/Pines_of_Rome_(Respighi%2C_Ottorino)","score_note":"IMSLP: partitura e, segundo territorio/edición, materiais orquestrais. EP8661 inclúe Pini di Roma na p. 19.","recording":"Fritz Reiner · Chicago Symphony Orchestra, RCA Living Stereo (1959), gravación de referencia pola claridade e a cor orquestral.","recording_url":"https://classical.music.apple.com/us/album/305779169","recording_note":"A ficha usa a pista III como localizador principal. É máis útil que un minuto acumulado da obra completa porque as edicións dixitais separan os movementos.","sources":[["Banda Municipal de Barcelona 2026: Pinos de Roma, EP8661 p. 19","https://assets.muvac.com/vacancies/5ypn5p4y/docs/860151/1776676174337-bases-bolsa-de-trabajo-bmb_clarinete.pdf?download="],["TŌN/Bard: Pines III, un compás antes de [13] ata despois de [17]","https://ton.bard.edu/academics/audition-repertoire/"],["Denver Philharmonic: Respighi, Rimski e o solo lírico do Janículo","https://denverphilharmonic.org/pines-of-rome-at-home-program-notes/"],["Sofia Philharmonic: composición e estrea en Roma, 14/12/1924","https://sofiaphilharmonic.com/en/works/ottorino-respighi-the-pines-of-rome-tone-poem-for-orchestra"],["Apple Music Classical: Reiner / Chicago, pista III","https://classical.music.apple.com/us/album/305779169"],["IMSLP: Pines of Rome","https://imslp.org/wiki/Pines_of_Rome_(Respighi%2C_Ottorino)"]],"portrait_url":"https://commons.wikimedia.org/wiki/Special:Redirect/file/Ottorino%20Respighi%2C%201927.jpg","period":"Século XX · posromanticismo / colorismo orquestral","genre":"Poema sinfónico en catro cadros, P. 141","year":"1924","work_structure":"I I pini di Villa Borghese · II Pini presso una catacomba · III I pini del Gianicolo · IV I pini della Via Appia; os catro cadros interprétanse sen pausa.","influences":"A influencia de Rimski-Kórsakov é especialmente visible no tratamento da orquestra como paleta de cores. Respighi combina esa tradición rusa coa imaxinación paisaxística do poema sinfónico e coa súa fascinación pola cidade de Roma. O clarinete non “conta” unha acción: convértese nunha voz nocturna que define o espazo e a atmosfera.","portrait_credit":"Ottorino Respighi, fotografía de Becker & Maass (1927) · Wikimedia Commons","portrait_source":"https://commons.wikimedia.org/wiki/File:Ottorino_Respighi,_1927.jpg","reviewed":"2026-10-01"},{"id":"3-1-22","course":3,"quarter":1,"instrument":"Clarinete en Si♭ e La","composer":"Shostakóvich","work":"Sinfonía n.º 1","probespiel":"21","status":"Ficha revisada · lista","summary":"Primeira sinfonía de Shostakóvich, escrita como traballo de graduación e estreada cando o compositor tiña 19 anos. O EP8661 selecciona o II movemento; para unha biblioteca útil de audición engadimos tamén tres cortes de primeiro clarinete que aparecen en listas profesionais do I e IV movementos.","composer_bio":"Dmitri Shostakóvich (1906–1975) foi compositor e pianista soviético, autor de quince sinfonías, quince cuartetos de corda, concertos, óperas, música de cámara e cinema. A súa música combina formas clásicas con cromatismo, sátira, marchas, danzas grotescas, lirismo moi escuro e unha extraordinaria capacidade para transformar materiais simples. A súa carreira estivo condicionada pola política cultural soviética, con períodos de recoñecemento oficial e outros de forte censura.","work_context":"Shostakóvich compuxo a Sinfonía n.º 1 durante os seus estudos no Conservatorio de Petrogrado/Leningrado e presentouna como traballo de graduación. A estrea, o 12 de maio de 1926 coa Filharmónica de Leningrado dirixida por Nikolai Malko, foi un éxito e lanzou a súa carreira internacional. A obra sorprende pola seguridade orquestral dun compositor tan novo e pola convivencia de humor grotesco, lirismo, xestos de marcha, vals e cambios de carácter moi bruscos.","excerpts":[{"name":"II. Allegro · solo inicial de clarinete (extracto do Probespiel)","location":"II movemento. Tras un breve “falso inicio” nos graves, o clarinete introduce o material principal. Para o corte exacto desta biblioteca, seguir o fragmento impreso no EP8661, p. 21.","context":"O Scherzo irrompe de forma abrupta e burlona. O solo de clarinete establece inmediatamente o carácter nervioso e algo insolente do movemento antes da entrada do piano e dos rápidos cambios de textura.","role":"O clarinete funciona como detonante do movemento: voz solista brillante, moi rítmica e con humor ácido. Debe soar rápida e espontánea, pero nunca descontrolada.","technique":"Articulación curta pero non seca, igualdade entre notas longas e curtas segundo a escritura, precisión rítmica, control dos acentos, flexibilidade de aire a tempo alto e capacidade de manter o fraseo dentro do carácter sarcástico.","pages":"EP8661: p. 21 · II movemento.","recording":"Royal Liverpool Philharmonic Orchestra · Vasily Petrenko (Naxos)","recording_url":"https://classical.music.apple.com/us/album/1042151303","recording_locator":"Abrir a pista II “Allegro – Meno mosso” (5:35). O solo aparece practicamente ao comezo, inmediatamente despois do breve arranque grave; usar a p. 21 do EP8661 como delimitación exacta."},{"name":"I. Allegretto · 1 antes de [1] → 1 despois de [2]","location":"I movemento, primeiro clarinete. Corte dunha lista profesional de principal: 1 compás antes de [1] ata 1 compás despois de [2].","context":"Forma parte da presentación inicial do mundo cambiante da sinfonía, no que motivos breves, xestos de marcha e materiais máis líricos se alternan con enorme rapidez.","role":"O clarinete debe pasar de ser parte dunha textura de cámara a asumir protagonismo sen cambiar bruscamente de calidade de son. A claridade do xesto e a flexibilidade estilística son máis importantes que tocar “grande”.","technique":"Control do pulso, cambios rápidos de carácter, ataques limpos, fraseo en frases curtas e afinación dentro dunha textura transparente.","pages":"Complemento de audición; non é o corte principal identificado no EP8661.","recording":"Royal Liverpool Philharmonic Orchestra · Vasily Petrenko (Naxos)","recording_url":"https://classical.music.apple.com/us/album/1042151303","recording_locator":"Pista I “Allegretto – Allegro non troppo” (8:14). Localizar directamente coas marcas [1]–[2] da particella.","materials":[{"type":"pdf","label":"PDF · I movemento, 1 antes de [1]–[2]","url":"https://www.verbierfestival.com/app/uploads/2021/11/Clarinet-Excerpts-Verbier-Festival-Orchestra-2022-1.pdf#page=4","source":"Verbier Festival Orchestra","note":"O paquete imprime este corte de primeiro clarinete.","coverage":"Extracto exacto"},{"type":"book","label":"McGinnis · vol. I","url":"https://www.clarinetallmusic.com/products/clarinet-orchestral-excerpts-vol-1-imc-mcginnis","source":"International Music Company","note":"O volume I inclúe Shostakovich Symphony No. 1.","coverage":"Referencia impresa"},{"type":"book","label":"Hadcock · The Working Clarinetist","url":"https://www.clarinetallmusic.com/products/hadcock-the-working-clarinetist-orchestral-excerpts-roncorp-publications","source":"Roncorp Publications","note":"Inclúe Shostakovich Symphony No. 1.","coverage":"Referencia impresa"}]},{"name":"I. Allegretto · primeiros 9 compases de [14]","location":"I movemento, primeiros 9 compases de [14], outro corte de primeiro clarinete presente en listas profesionais.","context":"Unha nova mudanza de perspectiva dentro dun movemento deliberadamente fragmentario e teatral.","role":"O clarinete precisa conservar personalidade solista sen romper a continuidade da forma. O interese está no control do carácter, non só na corrección de notas.","technique":"Precisión de entradas, articulación, estabilidade de tempo e capacidade de modular rapidamente cor e dinámica.","pages":"Complemento de audición; non é o corte principal identificado no EP8661.","recording":"Royal Liverpool Philharmonic Orchestra · Vasily Petrenko (Naxos)","recording_url":"https://classical.music.apple.com/us/album/1042151303","recording_locator":"Pista I (8:14). Ir directamente á marca [14] na particella; non se fixa un minuto porque depende demasiado da versión.","materials":[{"type":"pdf","label":"PDF · lista profesional cos cortes I e IV","url":"https://www.hpo.org/wp-content/uploads/2023/06/HPO-Principal-Clarinet-_-Audition-Repertoire.pdf","source":"Hamilton Philharmonic Orchestra","note":"Confirma literalmente os primeiros 9 compases de [14]; o PDF é lista de repertorio, non unha reimpresión da parte.","coverage":"Referencia oficial"},{"type":"book","label":"McGinnis · vol. I","url":"https://www.clarinetallmusic.com/products/clarinet-orchestral-excerpts-vol-1-imc-mcginnis","source":"International Music Company","note":"O volume I inclúe Shostakovich Symphony No. 1.","coverage":"Referencia impresa"},{"type":"book","label":"Hadcock · The Working Clarinetist","url":"https://www.clarinetallmusic.com/products/hadcock-the-working-clarinetist-orchestral-excerpts-roncorp-publications","source":"Roncorp Publications","note":"Inclúe Shostakovich Symphony No. 1.","coverage":"Referencia impresa"}]},{"name":"IV. Allegro molto · [6] → 3.º compás de [8]","location":"IV movemento, primeiro clarinete: [6] ata o terceiro compás de [8], corte usado en audicións profesionais.","context":"O finale alterna episodios frenéticos e zonas de forte tensión expresiva. O clarinete participa no impulso nervioso que contrasta coa gravidade dos episodios lentos.","role":"Voz áxil dentro dunha maquinaria orquestral moi activa; cómpre proxectar con claridade sen endurecer o son.","technique":"Velocidade, lectura de cambios, coordinación cos demais instrumentos, control de articulación e capacidade de non correr nin quedar atrás.","pages":"Complemento de audición; non é o corte principal identificado no EP8661.","recording":"Royal Liverpool Philharmonic Orchestra · Vasily Petrenko (Naxos)","recording_url":"https://classical.music.apple.com/us/album/1042151303","recording_locator":"Pista IV “Allegro molto – Lento” (10:05). Localizar [6]–[8] na particella.","materials":[{"type":"pdf","label":"PDF · lista profesional cos cortes I e IV","url":"https://www.hpo.org/wp-content/uploads/2023/06/HPO-Principal-Clarinet-_-Audition-Repertoire.pdf","source":"Hamilton Philharmonic Orchestra","note":"Confirma [6] → 3.º compás de [8]; o PDF é lista de repertorio, non unha reimpresión da parte.","coverage":"Referencia oficial"},{"type":"book","label":"McGinnis · vol. I","url":"https://www.clarinetallmusic.com/products/clarinet-orchestral-excerpts-vol-1-imc-mcginnis","source":"International Music Company","note":"O volume I inclúe Shostakovich Symphony No. 1.","coverage":"Referencia impresa"},{"type":"book","label":"Hadcock · The Working Clarinetist","url":"https://www.clarinetallmusic.com/products/hadcock-the-working-clarinetist-orchestral-excerpts-roncorp-publications","source":"Roncorp Publications","note":"Inclúe Shostakovich Symphony No. 1.","coverage":"Referencia impresa"}]}],"study":["Comezar polo II movemento da p. 21 do Probespiel: é o fragmento que a propia colección identifica para esta sinfonía.","Non tocar o Scherzo simplemente “rápido”: practicar a relación entre notas longas e curtas e buscar unha articulación áxil con carácter irónico.","Traballar os cortes do I e IV movementos como exercicio de cambio de personaxe: Shostakóvich pasa constantemente de cámara, parodia e lirismo a tensión sinfónica.","Escoitar os catro movementos: III e IV van unidos, e entender o arco global evita converter cada fragmento nun estudo técnico illado."],"score_url":"https://imslp.org/wiki/Symphony_No.1%2C_Op.10_%28Shostakovich%2C_Dmitry%29","score_note":"IMSLP contén partitura e partes, pero a obra non é dominio público na UE/Life+70. En España, comprobar sempre a dispoñibilidade legal indicada pola propia páxina.","recording":"Vasily Petrenko · Royal Liverpool Philharmonic Orchestra (Naxos), ciclo integral de Shostakóvich.","recording_url":"https://classical.music.apple.com/us/album/1042151303","recording_note":"A edición separa os catro movementos (I 8:14; II 5:35; III 9:20; IV 10:05). Para os cortes sen minuto verificado, a referencia segura son os números de ensaio.","sources":[["IMSLP: Sinfonía n.º 1, op. 10 — datos, estrutura e materiais","https://imslp.org/wiki/Symphony_No.1%2C_Op.10_%28Shostakovich%2C_Dmitry%29"],["IMSLP Orchester-Probespiel: Shostakóvich 1 = II movemento","https://imslp.org/wiki/Orchester-Probespiel"],["Hamilton Philharmonic: cortes de primeiro clarinete I e IV","https://www.hpo.org/wp-content/uploads/2023/06/HPO-Principal-Clarinet-_-Audition-Repertoire.pdf"],["Osborn Music: comentario interpretativo do II movemento","https://www.osbornmusic.com/Shosty1.html"],["Apple Music Classical: contexto da Sinfonía n.º 1","https://classical.music.apple.com/gy/work/dmitry-shostakovich-1906-pp99"],["Apple Music Classical: Petrenko / Royal Liverpool Philharmonic","https://classical.music.apple.com/us/album/1042151303"]],"portrait_url":"https://commons.wikimedia.org/wiki/Special:Redirect/file/Dmitri-Shostakovich-1958.jpg","period":"Século XX · modernismo soviético temperán","genre":"Sinfonía en catro movementos, op. 10","year":"1923–1925 · estrea 1926","work_structure":"I. Allegretto – Allegro non troppo · II. Allegro – Meno mosso – Allegro – Meno mosso · III. Lento – Largo – Lento (attacca) · IV. Allegro molto – Lento – Allegro molto… Presto.","influences":"Na primeira etapa de Shostakóvich percíbense ecos de Stravinski —especialmente o mundo de Petrushka—, Prokófiev e da tradición sinfónica rusa, pero xa aparece unha voz moi persoal baseada na ironía, a fragmentación e o cambio súbito de perspectiva. O compositor traballara tamén como pianista de cine mudo para axudar á súa familia; ese contexto adoita relacionarse coa rapidez de cortes e contrastes da súa música temperá, aínda que non debe presentarse como unha “causa” única da sinfonía.","portrait_credit":"Dmitri Shostakóvich en Finlandia (1958), Holger Eklund · Wikimedia Commons (dominio público en Finlandia)","portrait_source":"https://commons.wikimedia.org/wiki/File:Dmitri-Shostakovich-1958.jpg","reviewed":"2026-10-01"},{"id":"3-1-23","course":3,"quarter":1,"instrument":"Clarinete en Si♭ e La","composer":"Shostakóvich","work":"Sinfonía n.º 9","probespiel":"22","status":"Ficha revisada · lista","summary":"Sinfonía breve e deliberadamente antiheroica escrita en 1945. Para clarinete hai dous extractos fundamentais e moi contrastantes: o longo solo do II. Moderato e o virtuosístico comezo do III. Presto. O EP8661 escolle o III movemento, p. 22.","composer_bio":"Dmitri Shostakóvich (1906–1975) foi compositor e pianista soviético, autor de quince sinfonías, quince cuartetos de corda, concertos, óperas, música de cámara e cinema. A súa música combina formas clásicas con cromatismo, sátira, marchas, danzas grotescas, lirismo moi escuro e unha extraordinaria capacidade para transformar materiais simples. A súa carreira estivo condicionada pola política cultural soviética, con períodos de recoñecemento oficial e outros de forte censura.","work_context":"A Novena foi composta ao final da Segunda Guerra Mundial, nun momento no que unha “Novena” de grandes proporcións podía asociarse a expectativas de celebración e monumentalidade. Shostakóvich entregou, en cambio, unha obra curta, clara e chea de ambigüidade: humor, circo, melancolía e tensión conviven nunha escala case clásica. Estreouse o 3 de novembro de 1945 coa Filharmónica de Leningrado dirixida por Yevgeny Mravinsky.","excerpts":[{"name":"II. Moderato · solo inicial","location":"II movemento, cc. 1–32, corte moi frecuente en audicións de primeiro clarinete.","context":"O movemento abre cunha melodía longa e solitaria do clarinete sobre unha textura moi escasa. Despois do humor do Allegro inicial, a atmosfera cambia radicalmente cara a unha danza lenta, pálida e inquietante.","role":"O clarinete é a voz principal absoluta: debe soster unha liña longa con aparente simplicidade, deixando espazo ao silencio e á fragilidade. É un exame de son, afinación, respiración e control da tensión.","technique":"Legato, pianissimo controlado, respiracións planificadas, afinación de intervalos, estabilidade do aire, dirección de frases moi longas e capacidade de manter o carácter sen sentimentalismo excesivo.","pages":"Extracto estándar adicional. O EP8661 de clarinete identifica para esta sinfonía o III movemento, non este.","recording":"Berliner Philharmoniker · Kirill Petrenko (2023)","recording_url":"https://classical.music.apple.com/us/album/1675548413","recording_locator":"Abrir a pista II “Moderato” (7:19). O extracto cc. 1–32 comeza en 0:00 da pista.","materials":[{"type":"pdf","label":"PDF · II Moderato cc. 1–32","url":"https://clarinet.org/wp-content/uploads/2026/09/2027-ICA-ORCHESTRAL-AUDITION-COMPETITION.pdf#page=12","source":"International Clarinet Association · 2027","note":"A páxina tamén inclúe o inicio do III movemento; o Moderato aparece completo arriba.","coverage":"Extracto exacto"},{"type":"pdf","label":"PDF alternativo · II e III movementos","url":"https://www.alluniversityorchestra.org/assets/audition_excerpts/excerpts-spring26/Clarinet%20S26_Audition.pdf#page=2","source":"Carnegie Mellon · All University Orchestra 2026","note":"Outro PDF institucional co II movemento completo e o III movemento.","coverage":"Extracto exacto"},{"type":"book","label":"McGinnis · vol. II","url":"https://www.clarinetallmusic.com/products/clarinet-orchestral-excerpts-vol-2-imc-mcginnis","source":"International Music Company","note":"O volume II inclúe Shostakovich Symphony No. 9.","coverage":"Referencia impresa"},{"type":"book","label":"Hadcock · The Working Clarinetist","url":"https://www.clarinetallmusic.com/products/hadcock-the-working-clarinetist-orchestral-excerpts-roncorp-publications","source":"Roncorp Publications","note":"Inclúe Shostakovich Symphony No. 9.","coverage":"Referencia impresa"}]},{"name":"III. Presto · solo técnico inicial","location":"III movemento, desde o comezo ata c. 17; outra formulación profesional: comezo ata o tempo forte de [C].","context":"O Presto corta a atmosfera do Moderato cunha descarga de enerxía. O clarinete abre o movemento cunha carreira case vertixinosa que inmediatamente define o carácter scherzando e grotesco.","role":"Primeiro clarinete completamente exposto. O solo debe soar áxil e incisivo, pero con fraseo e dirección; non é unha simple proba de velocidade.","technique":"Coordinación extrema de dedos e lingua, igualdade de semicorcheas, respiración eficiente, control do pulso, claridade nos cambios de rexistro e decisión sobre articulacións sen perder lixeireza.","pages":"EP8661: p. 22 · III movemento.","recording":"Berliner Philharmoniker · Kirill Petrenko (2023)","recording_url":"https://classical.music.apple.com/us/album/1675548413","recording_locator":"Abrir a pista III “Presto” (2:43). O extracto comeza exactamente en 0:00; seguir cc. 1–17 / ata o tempo forte de [C]."}],"study":["Estudar os dous solos consecutivamente: son unha excelente proba de dous extremos do instrumento —cantabile exposto e virtuosismo técnico— dentro da mesma sinfonía.","No II movemento, gravarse a dinámica baixa: a liña debe manter apoio e dirección mesmo cando parece estática.","No III, buscar primeiro limpeza a un tempo inferior e só despois acelerar; respirar nun punto que non rompa a dirección se aínda non é posible facelo dunha soa respiración.","Escoitar tamén IV e V: o Presto non é un número illado, senón que desemboca nunha zona sombría antes do finale."],"score_url":"https://imslp.org/wiki/Symphony_No.9%2C_Op.70_%28Shostakovich%2C_Dmitry%29","score_note":"IMSLP ofrece partitura e partes, pero a obra figura como non dominio público na UE. En España, respectar as advertencias territoriais da páxina.","recording":"Kirill Petrenko · Berliner Philharmoniker (Berliner Philharmoniker Recordings, 2023).","recording_url":"https://classical.music.apple.com/us/album/1675548413","recording_note":"Ideal para a biblioteca porque II e III son pistas separadas e os dous extractos comezan en 0:00 das súas respectivas pistas.","sources":[["Tianjin Juilliard: II cc. 1–32 e III cc. 1–17","https://www.tianjinjuilliard.edu.cn/admissions/graduate-studies/auditions/instrumental-and-orchestral-studies-audition-requirements"],["Barcelona Symphony: III comezo → tempo forte de C","https://assets.muvac.com/vacancies/j16vzjr1/docs/678734/1753785327183-principal_clarinet_audition_rules.pdf?download="],["IMSLP Orchester-Probespiel: Shostakóvich 9 = III movemento","https://imslp.org/wiki/Orchester-Probespiel"],["Boosey & Hawkes: estrea da Sinfonía n.º 9","https://www.boosey.com/cr/music/Dmitri-Shostakovich-Symphony-No-9-in-E-flat-major/3975"],["IMSLP: Sinfonía n.º 9, op. 70","https://imslp.org/wiki/Symphony_No.9%2C_Op.70_%28Shostakovich%2C_Dmitry%29"],["Apple Music Classical: Petrenko / Berliner Philharmoniker","https://classical.music.apple.com/us/album/1675548413"]],"portrait_url":"https://commons.wikimedia.org/wiki/Special:Redirect/file/Dmitri-Shostakovich-1958.jpg","period":"Século XX · modernismo soviético","genre":"Sinfonía en cinco movementos, op. 70","year":"1945","work_structure":"I. Allegro · II. Moderato · III. Presto · IV. Largo · V. Allegretto – Allegro. Os cinco movementos forman un deseño moi compacto e os tres últimos encadéanse con forte continuidade dramática.","influences":"A economía formal e a transparencia da orquestra lembran por momentos o clasicismo de Haydn, pero filtrado pola linguaxe irónica de Shostakóvich. A obra evita unha lectura simple de “celebración da vitoria”: a vivacidade exterior convive cun II movemento desolado e cun Largo sombrío. Para o clarinete isto tradúcese en dous extremos: fraseo solitario e exposto fronte a virtuosismo case acrobático.","portrait_credit":"Dmitri Shostakóvich en Finlandia (1958), Holger Eklund · Wikimedia Commons (dominio público en Finlandia)","portrait_source":"https://commons.wikimedia.org/wiki/File:Dmitri-Shostakovich-1958.jpg","reviewed":"2026-10-01"},{"id":"3-1-24","course":3,"quarter":1,"instrument":"Clarinete en Si♭ e La","composer":"Mahler","work":"Sinfonía n.º 7","probespiel":"10–11","status":"Ficha revisada · lista","summary":"Sinfonía de gran formato organizada arredor de dous movementos nocturnos. O extracto estándar de clarinete e o que identifica o EP8661 pertence ao II. Nachtmusik I; unha lista profesional actual concreta o corte desde a anacrusa de [69] ata [72].","composer_bio":"Gustav Mahler (1860–1911) foi compositor e director austro-bohemio, unha das figuras fundamentais da transición entre o Romanticismo tardío e a modernidade musical. Desenvolveu unha carreira extraordinaria como director de ópera e orquestra —entre outros postos, na Ópera da Corte de Viena— e concentrou a súa creación principalmente na canción e na sinfonía. As súas obras combinan formas de gran escala con materiais populares, marchas, danzas, cantos de natureza e contrastes extremos de carácter e orquestración.","work_context":"Mahler esbozou primeiro os dous movementos Nachtmusik durante o verán de 1904 e completou os movementos I, III e V no verán de 1905; a orquestración e as revisións continuaron despois. A estrea tivo lugar en Praga o 19 de setembro de 1908, dirixida polo propio compositor. O título popular “Canción da noite” non é de Mahler e non convén empregalo como se fose un subtítulo oficial.","excerpts":[{"name":"II. Nachtmusik I · anacrusa de [69] → [72]","location":"II movemento, desde a anacrusa de [69] ata [72]. É o corte especificado nunha audición recente de principal e corresponde ao movemento que o EP8661 selecciona para Mahler 7.","context":"Nachtmusik I mestura marcha, natureza e grotesco. Arredor desta zona a música alterna sensación de distancia, chamadas e movemento rústico; o clarinete debe encaixar nunha paisaxe sonora chea de ecos e cambios de perspectiva.","role":"O clarinete non actúa como cantante illado ao estilo de Respighi: é unha voz móbil dentro do tecido nocturno de madeiras. Debe combinar claridade de articulación, expresividade e capacidade de colorear sen sobresaír artificialmente.","technique":"Non legato lixeiro, control de dinámicas moi baixas, afinación, flexibilidade de tempo sen perder pulso, entradas seguras tras silencios e capacidade de cambiar de carácter rapidamente. As indicacións de Mahler sobre non apresurarse ou non inchar a dinámica son parte esencial do estilo.","pages":"EP8661: pp. 10–11 · II movemento (Nachtmusik I).","recording":"Berliner Philharmoniker · Claudio Abbado (2002)","recording_url":"https://classical.music.apple.com/us/album/1452238459","recording_locator":"Abrir a pista II “Nachtmusik (Allegro moderato)” (15:54) e seguir directamente [69]–[72]. Non se fixa minuto porque a duración do movemento varía bastante entre directores e a marca de ensaio é máis fiable."}],"study":["Antes de tocar o corte, escoitar todo Nachtmusik I e identificar trompas a distancia, madeiras tipo paxaro, marcha, danza rústica e campás de vaca.","Estudar as indicacións textuais de Mahler como parte da música, non como accesorios: “Nicht eilen” e os cambios de carácter condicionan articulación e dirección.","Buscar unha cor flexible: nin un solo operístico nin un mero tutti. O clarinete forma parte dunha escena de claroscuro e debe reaccionar á orquestración.","Comparar o II e o IV movementos para entender que “Nachtmusik” non significa unha única atmosfera: o primeiro é máis fantástico/rústico; o segundo, máis íntimo e amoroso."],"score_url":"https://imslp.org/wiki/Symphony_No.7_%28Mahler%2C_Gustav%29","score_note":"IMSLP: partitura completa, manuscritos, partes e extractos; obra de dominio público. Usar as marcas de ensaio da edición correspondente ao EP/audición.","recording":"Claudio Abbado · Berliner Philharmoniker (2002).","recording_url":"https://classical.music.apple.com/us/album/1452238459","recording_note":"A pista II dura 15:54. Para este extracto, [69]–[72] é un localizador máis robusto que un minuto aproximado.","sources":[["Barcelona Symphony: II Nachtmusik, anacrusa [69] → [72]","https://assets.muvac.com/vacancies/j16vzjr1/docs/678734/1753785327183-principal_clarinet_audition_rules.pdf?download="],["IMSLP Orchester-Probespiel: Mahler 7 = II movemento","https://imslp.org/wiki/Orchester-Probespiel"],["Mahler Foundation: historia e proceso de composición","https://www.mahlerfoundation.org/mahler/compositions/symphony-no-7/symphony-no-7-history/"],["Mahler Foundation: Nachtmusik I — análise e contexto","https://www.mahlerfoundation.org/mahler/compositions/symphony-no-7/symphony-no-7-movement-2-nachtmusik-allegro-moderato/"],["IMSLP: Sinfonía n.º 7","https://imslp.org/wiki/Symphony_No.7_%28Mahler%2C_Gustav%29"],["Apple Music Classical: Abbado / Berliner Philharmoniker","https://classical.music.apple.com/us/album/1452238459"]],"portrait_url":"https://commons.wikimedia.org/wiki/Special:Redirect/file/Gustav%20Mahler%20by%20Dupont%20%281909%29.jpg","period":"Romanticismo tardío · transición á modernidade","genre":"Sinfonía en cinco movementos, GMW 47","year":"1904–1905; orquestración/revisión 1906–1908","work_structure":"I. Langsam – Allegro risoluto, ma non troppo · II. Nachtmusik I, Allegro moderato · III. Scherzo, Schattenhaft · IV. Nachtmusik II, Andante amoroso · V. Rondo-Finale. Os tres movementos centrais forman unha grande zona “nocturna” enmarcada por dous movementos de maior escala.","influences":"A sinfonía explora unha idea ampla de noite e distancia, non un programa narrativo pechado. No II movemento hai chamadas de trompa, ecos, paxaros grotescos nas madeiras, marchas, danzas rústicas e campás de vaca afastadas. Mahler relacionou este Nachtmusik, segundo testemuño de Alphons Diepenbrock, coa atmosfera de claroscuro da “Rolda de noite” de Rembrandt: unha viaxe nocturna máis que unha escena literal.","portrait_credit":"Gustav Mahler, estudio A. Dupont (1909) · Library of Congress / Wikimedia Commons","portrait_source":"https://commons.wikimedia.org/wiki/File:Gustav_Mahler_by_Dupont_(1909).jpg","reviewed":"2026-10-01"},{"id":"3-1-25","course":3,"quarter":1,"instrument":"Clarinete baixo","composer":"Stravinski","work":"A consagración da primavera","probespiel":"40","status":"Ficha revisada · lista","summary":"Ballet de 1913 e unha das obras decisivas do modernismo musical. Para clarinete baixo non hai un único “solo”: as audicións profesionais seleccionan varios pasaxes das dúas partes, incluídos fragmentos de clarinete baixo I e II. A ficha separa catro cortes especialmente recorrentes e indica cando cambia a voz.","composer_bio":"Igor Stravinski (1882–1971) foi un compositor nacido no Imperio ruso e posteriormente cidadán francés e estadounidense. Formouse en San Petersburgo e recibiu orientación privada de Nikolái Rimski-Kórsakov, decisiva para a súa comprensión da orquestración. A colaboración con Sergei Diaghilev e os Ballets Russes —O paxaro de lume, Petrushka e A consagración da primavera— situouno no centro da modernidade musical europea. A súa longa carreira atravesou etapas rusa, neoclásica e serial.","work_context":"Stravinski compuxo A consagración da primavera para os Ballets Russes de Sergei Diaghilev entre 1910 e 1913, en colaboración co artista e estudoso da antiga Rusia Nikolái Roerich e co coreógrafo Vaslav Nijinsky. O argumento presenta unha Rusia pagá imaxinada: unha comunidade celebra a primavera mediante rituais que culminan na elección dunha moza que danza ata a morte como sacrificio. A estrea tivo lugar no Théâtre des Champs-Élysées de París o 29 de maio de 1913, con Pierre Monteux no podio. A enorme orquestra, os ostinati, a superposición de capas, os acentos irregulares e a transformación de materiais folclóricos crean unha linguaxe radicalmente nova.","excerpts":[{"name":"I parte · Introdución · Clarinete baixo II","location":"Un compás despois de [4] ata 4 compases despois de [6]. Corte documentado en listas profesionais recentes para clarinete baixo II.","context":"A obra abre cunha textura de madeiras extremadamente exposta e inestable, construída por pequenas células que aparecen e desaparecen. O clarinete baixo II participa nesa paisaxe primitiva antes de que a música adquira unha pulsación máis definida.","role":"Voz grave de cor dentro dunha polifonía de madeiras. Non debe soar como mero baixo harmónico: a liña ten identidade propia e debe conservar flexibilidade, presenza e capacidade de mestura.","technique":"Ataques suaves, afinación no rexistro grave, estabilidade do aire a dinámica baixa, homoxeneidade entre rexistros e capacidade de encaixar timbricamente con fagotes e clarinetes sen perder definición.","pages":"EP8661: p. 40 · A obra inclúe material das dúas partes; comprobar a voz exacta na edición empregada.","recording":"London Symphony Orchestra · Sir Simon Rattle (LSO, 2017)","recording_url":"https://www.youtube.com/watch?v=EkwqPJZe8ms","recording_locator":"Parte I, Introdución · segue a partitura desde [4]. Como o minutaxe varía segundo a edición do vídeo, a referencia máis segura é “1 despois de [4] → 4 despois de [6]”."},{"name":"I parte · Introdución · Clarinete baixo I","location":"[11] ata [12]. É un dos cortes máis recorrentes nas audicións de clarinete baixo.","context":"Cara ao final da introdución, antes de que irrompa a Danza dos adolescentes, a textura segue sendo fragmentaria e moi exposta. Cada entrada das madeiras debe parecer parte dun diálogo orgánico, non unha sucesión de exercicios.","role":"Clarinete baixo I con intervención moi visible dentro do entramado de madeiras. A cor escura do instrumento contrasta coas voces máis agudas e axuda a ampliar verticalmente a textura.","technique":"Seguridade de entrada, control do rexistro chalumeau, afinación de intervalos, fraseo flexible e dominio do cambio entre notas longas e xestos máis articulados. Evitar tocar “pesado”.","pages":"EP8661: p. 40 · I parte.","recording":"London Symphony Orchestra · Sir Simon Rattle (LSO, 2017)","recording_url":"https://www.youtube.com/watch?v=EkwqPJZe8ms","recording_locator":"Parte I, Introdución · [11]–[12]. Para traballo específico tamén se pode consultar o vídeo pedagóxico de Earspasm enlazado nas fontes."},{"name":"I parte · Rondes printanières / Spring Rounds · Clarinete baixo I","location":"[48] ata un compás antes de [49] (algunhas listas indican simplemente [48]–[49]).","context":"Tras a violencia rítmica das seccións anteriores, as Rondes printanières introducen unha danza máis pesada e hipnótica. A melodía de perfil folclórico aparece sobre unha pulsación máis ampla e escura.","role":"O clarinete baixo participa como voz característica dentro do material melódico e do relevo das madeiras graves. O obxectivo non é virtuosismo superficial senón unha liña clara, terrosa e de gran estabilidade tímbrica.","technique":"Legato entre rexistros, sostemento da columna de aire, precisión rítmica en tempo lento, afinación e capacidade de manter unha cor compacta sen endurecer os ataques.","pages":"EP8661: p. 40 · I parte.","recording":"London Symphony Orchestra · Sir Simon Rattle (LSO, 2017)","recording_url":"https://www.youtube.com/watch?v=EkwqPJZe8ms","recording_locator":"Parte I · Rondes printanières · [48]–[49]. A marca de ensaio é máis fiable ca un minuto acumulado porque as gravacións cambian bastante de duración."},{"name":"II parte · transición a Danse sacrale · Clarinete baixo II","location":"Un compás antes de [141] ata [142]. En materiais profesionais recentes aparece expresamente como pasaxe de clarinete baixo II.","context":"Na parte final do ritual, a tensión está xa orientada cara á Danza sacrificial. A textura é cada vez máis seca e ameazante; a entrada do clarinete baixo forma parte desa preparación extrema do clímax final.","role":"Intervención curta e moi exposta, cunha función máis rítmica e de cor ca cantabile. O instrumento debe aparecer con claridade desde unha dinámica contida e encaixar con precisión no mecanismo colectivo.","technique":"Conteo impecable, ataque controlado en pp, reacción rápida aos cambios de dinámica e carácter, afinación e precisión en entradas illadas. Convén estudar o contexto completo desde [139] para non perder a orientación.","pages":"EP8661: p. 40 · II parte.","recording":"London Symphony Orchestra · Sir Simon Rattle (LSO, 2017)","recording_url":"https://www.youtube.com/watch?v=EkwqPJZe8ms","recording_locator":"Parte II · zona final anterior á Danse sacrale · 1 antes de [141] → [142]."}],"study":["Estudar primeiro cada pasaxe coa partitura xeral: en Sacre é esencial saber que instrumentos comparten ou rodean a túa liña.","Diferenciar clarinete baixo I e II. A orquestración emprega unha voz específica de clarinete baixo e, nalgúns momentos, o terceiro clarinete dobra un segundo clarinete baixo; non todos os cortes pertencen á mesma parte.","Traballar as entradas desde silencio e con metrónomo afastado: o reto é conservar liberdade de frase sen perder a estrutura rítmica.","Escoitar a Introdución completa e as Rondes printanières antes de illar os fragmentos; o carácter vén do contexto, non só das notas.","Practicar [141]–[142] desde varios compases antes para adestrar o conteo e a reacción dentro da textura."],"score_url":"https://imslp.org/wiki/The_Rite_of_Spring%2C_K015_%28Stravinsky%2C_Igor%29","score_note":"IMSLP: partitura xeral e materiais segundo a edición e os dereitos territoriais. Para audicións, comprobar sempre se se pide a versión/revisión correspondente e se a voz é clarinete baixo I ou II.","recording":"London Symphony Orchestra · Sir Simon Rattle (2017), vídeo oficial da LSO.","recording_url":"https://www.youtube.com/watch?v=EkwqPJZe8ms","recording_note":"Por tratarse dunha obra longa e con versións de duración moi diferente, a biblioteca utiliza marcas de ensaio como localizador principal. Son máis precisas que un minuto aproximado.","sources":[["OFGC: Orchester-Probespiel, Stravinski · A consagración da primavera, p. 40","https://api.ofgrancanaria.com/storage/6842/g6WwBHfD8aApPbRiVOtG.pdf"],["Virginia Symphony: clarinete baixo I · [11]–antes de [12], [48]–antes de [49] e 1 antes de [141]–[142]","https://virginiasymphony.org/wp-content/uploads/2023/02/Bass-Clarinet-2023.pdf"],["Spartanburg Philharmonic: Rite, clarinete baixo, figuras 5–12 e 48–49","https://www.spartanburgphilharmonic.org/auditions-excerpts"],["El Paso Symphony: paquete de audición con [11]–[12] e [141]–[142] e indicación das voces","https://www.epso.org/wp-content/uploads/2025/02/3rd-Clarinet-Utility-Audition-Packet.pdf"],["Earspasm: Bass Clarinet Excerpt – The Rite of Spring","https://www.youtube.com/watch?v=QtWOwBsJbwA"],["London Symphony Orchestra / Simon Rattle: The Rite of Spring","https://www.youtube.com/watch?v=EkwqPJZe8ms"],["IMSLP: The Rite of Spring","https://imslp.org/wiki/The_Rite_of_Spring%2C_K015_%28Stravinsky%2C_Igor%29"]],"portrait_url":"https://commons.wikimedia.org/wiki/Special:Redirect/file/Igor_Stravinsky_LOC_32392u.jpg","period":"Século XX · modernismo · período ruso de Stravinski","genre":"Ballet en dúas partes, K015","year":"1910–1913 · estrea 1913 · revisións posteriores, incluída 1947","work_structure":"Parte I: L’Adoration de la terre (A adoración da terra) · Parte II: Le Sacrifice (O sacrificio). A sucesión de escenas conduce desde os primeiros ritos primaverais ata a Danza sacrificial da Elixida.","influences":"O proxecto nace da colaboración entre Stravinski, Diaghilev, Roerich e Nijinsky e dunha visión escénica dunha Rusia pagá arcaica. Stravinski transforma materiais e xiros asociados ao folclore do leste europeo mediante ostinati, superposicións harmónicas, cambios de acentuación e unha concepción da orquestra na que os instrumentos graves tamén funcionan como voces solistas e de cor.","portrait_credit":"Igor Stravinski, George Grantham Bain Collection, ca. 1920–1925 · Library of Congress / Wikimedia Commons","portrait_source":"https://commons.wikimedia.org/wiki/File:Igor_Stravinsky_LOC_32392u.jpg","reviewed":"2026-10-01"},{"id":"3-1-26","course":3,"quarter":1,"instrument":"Clarinete baixo","composer":"Ravel","work":"Daphnis et Chloé","probespiel":"—","status":"Ficha revisada · lista","summary":"Ballet de Ravel composto para os Ballets Russes. No clarinete baixo, o material de audición concéntrase sobre todo na Suite n.º 2 e inclúe varios pasaxes diferentes; non é correcto reducilo a un único “solo”. O EP8661 non inclúe Daphnis na sección de clarinete baixo: as pp. 34–35 corresponden ao requinto/clarinete agudo.","composer_bio":"Maurice Ravel (1875–1937) foi un dos grandes compositores franceses do cambio de século. Pianista de formación, destacou pola precisión formal, a refinada harmonía e unha orquestración extraordinariamente transparente. A súa música mantén vínculos co simbolismo e co impresionismo francés, aínda que Ravel conservou sempre unha forte disciplina clásica e un gusto por danzas, mecanismos e formas moi definidas.","work_context":"Ravel traballou en Daphnis et Chloé entre 1909 e 1912 por encargo de Sergei Diaghilev para os Ballets Russes. Michel Fokine elaborou o escenario a partir da novela pastoril atribuída a Longo, e Léon Bakst deseñou a produción. A estrea tivo lugar no Théâtre du Châtelet de París o 8 de xuño de 1912, dirixida por Pierre Monteux, con Vaslav Nijinsky e Tamara Karsavina. Ravel denominou a obra “symphonie chorégraphique”: máis ca unha sucesión convencional de números de ballet, é un gran arco sinfónico no que a orquestración crea luz, espazo e movemento. A Suite n.º 2 procede do terceiro cadro e reúne Lever du jour, Pantomime e Danse générale.","excerpts":[{"name":"Suite n.º 2 · Lever du jour · pasaxe arredor de [157]","location":"Delimitación moi habitual: 6 compases antes de [157] ata 3 despois de [157]. Outras audicións amplían o bloque desde [156] ata despois de [161].","context":"O terceiro cadro comeza co amencer. Ravel constrúe lentamente unha paisaxe sonora de luz, movemento da natureza e chamadas de paxaros; as madeiras emerxen dentro dunha textura que debe parecer espontánea e atmosférica.","role":"O clarinete baixo é unha voz de cor e movemento dentro dunha textura moi transparente. As notas rápidas non deben sonar mecánicas: forman parte do murmurio orquestral que fai “nacer” a escena.","technique":"Son cálido, dedos moi regulares, aire continuo baixo figuracións rápidas, afinación e capacidade de manter un carácter atmosférico mesmo cando a parte é tecnicamente activa.","pages":"Non aparece na sección de clarinete baixo do EP8661. Daphnis si aparece nas pp. 34–35 da sección de requinto/clarinete agudo, material distinto.","recording":"London Symphony Orchestra · Sir Simon Rattle · Suite n.º 2","recording_url":"https://www.youtube.com/watch?v=IlENd0p6aR4","recording_locator":"Suite n.º 2 · Lever du jour · localizar por [156]–[157]. A marca de ensaio é o localizador máis seguro na gravación completa.","materials":[{"type":"pdf","label":"PDF · Lever du jour arredor de [157]","url":"https://www.arena.it/storage/docs/20220908_Passi%20Audizione%202023%20%20Clarinetto%20basso%20%2B%20Clarinetto%202%C2%B0.pdf","source":"Fondazione Arena di Verona","note":"A particella de clarinete baixo mostra o material arredor de [157] e continúa con outros cortes da Suite n.º 2.","coverage":"Extracto exacto / ampliado"},{"type":"web","label":"Notación por extractos","url":"https://excerpts.one/instruments/bassclarinet/raveldaphnis.html","source":"Excerpts.one","note":"Páxina específica de clarinete baixo con localización arredor de [157].","coverage":"Extracto en web"},{"type":"score","label":"Abrir partitura / particella","url":"https://imslp.org/wiki/Daphnis_et_Chlo%C3%A9%2C_M.57_%28Ravel%2C_Maurice%29","source":"IMSLP","note":"Partitura/particella completa; localizar o corte coas marcas indicadas na ficha.","coverage":"Partitura completa"}]},{"name":"Suite n.º 2 · Lever du jour · [167]–[170]","location":"[167] ata 2–3 compases antes de [170]. É outro corte habitual de clarinete baixo.","context":"O amencer xa está máis desenvolvido e a textura gaña dirección. A liña do clarinete baixo debe seguir formando parte do fluxo natural sen converter a figuración en algo pesado.","role":"Voz interna exposta por timbre e rexistro, integrada coas cordas e madeiras. O instrumento achega profundidade sen escurecer a transparencia típica de Ravel.","technique":"Continuidade de aire, coordinación de dedos, dinámica flexible, afinación e control de articulación. Debe sentirse como unha única frase, non como grupos de notas independentes.","pages":"Fóra da sección de clarinete baixo do EP8661.","recording":"London Symphony Orchestra · Sir Simon Rattle · Suite n.º 2","recording_url":"https://www.youtube.com/watch?v=IlENd0p6aR4","recording_locator":"Suite n.º 2 · Lever du jour · [167] → antes de [170].","materials":[{"type":"pdf","label":"PDF · Daphnis · clarinete baixo [157]–[170]","url":"https://www.arena.it/storage/docs/20220908_Passi%20Audizione%202023%20%20Clarinetto%20basso%20%2B%20Clarinetto%202%C2%B0.pdf","source":"Fondazione Arena di Verona","note":"Particella de clarinete baixo con [157], [164]–[170].","coverage":"Extracto exacto / ampliado"},{"type":"web","label":"Notación por extractos","url":"https://excerpts.one/instruments/bassclarinet/raveldaphnis.html","source":"Excerpts.one","note":"Páxina específica de clarinete baixo con varios cortes profesionais.","coverage":"Extracto en web"},{"type":"score","label":"Abrir partitura / particella","url":"https://imslp.org/wiki/Daphnis_et_Chlo%C3%A9%2C_M.57_%28Ravel%2C_Maurice%29","source":"IMSLP","note":"Partitura/particella completa; localizar o corte coas marcas indicadas na ficha.","coverage":"Partitura completa"}]},{"name":"Suite n.º 2 · pasaxe 1 antes de [206]–[210]","location":"Un compás antes de [206] ata [210]. Incluído en recompilacións especializadas de repertorio de clarinete baixo.","context":"Xa dentro do tramo máis animado da suite, o clarinete baixo participa nun tecido máis rítmico e orientado á danza. A cor segue sendo importante, pero agora a precisión colectiva gaña peso.","role":"Voz de apoio e relevo dentro dunha textura en movemento; máis “orquestral” ca solista no sentido tradicional, pero moi útil en audición porque deixa ver lectura, pulso e resposta tímbrica.","technique":"Pulso, articulación coordinada co resto das madeiras, claridade de cambios de rexistro e control dinámico sen perder núcleo de son.","pages":"Fóra da sección de clarinete baixo do EP8661.","recording":"London Symphony Orchestra · Sir Simon Rattle · Suite n.º 2","recording_url":"https://www.youtube.com/watch?v=IlENd0p6aR4","recording_locator":"Suite n.º 2 · localizar un compás antes de [206] e seguir ata [210].","materials":[{"type":"pdf","label":"PDF · Daphnis · clarinete baixo","url":"https://marinsymphony.org/wp-content/uploads/2019/03/Marin-Clarinet-excerpt-list-2019-PDF.pdf","source":"Marin Symphony","note":"Inclúe o gran tramo 3 despois de [210] → 4 despois de [217], que cobre boa parte destes cortes.","coverage":"Extracto exacto / ampliado"},{"type":"web","label":"Notación por extractos","url":"https://excerpts.one/instruments/bassclarinet/raveldaphnis.html","source":"Excerpts.one","note":"Permite localizar individualmente [206]–[210], [212]–[214] e o tramo final.","coverage":"Extracto en web"},{"type":"score","label":"Abrir partitura / particella","url":"https://imslp.org/wiki/Daphnis_et_Chlo%C3%A9%2C_M.57_%28Ravel%2C_Maurice%29","source":"IMSLP","note":"Partitura/particella completa; localizar o corte coas marcas indicadas na ficha.","coverage":"Partitura completa"}]},{"name":"Suite n.º 2 · pasaxe 2 despois de [212]–[214]","location":"2–3 compases despois de [212] ata [214]. Este bloque aparece de forma recorrente en listas de audición de clarinete baixo.","context":"A música achégase ao tramo final de danza e a textura é cada vez máis motórica. A escritura esixe conservar a claridade dentro dunha orquestración moi densa.","role":"Clarinete baixo como engrenaxe rítmica e tímbrica de gran precisión. A liña debe proxectarse o suficiente para ser lexible, pero sen sobresair artificialmente.","technique":"Ritmo moi claro, resistencia, igualdade de articulación, dixitación segura e capacidade de manter a calidade do son en dinámica alta.","pages":"Fóra da sección de clarinete baixo do EP8661.","recording":"London Symphony Orchestra · Sir Simon Rattle · Suite n.º 2","recording_url":"https://www.youtube.com/watch?v=IlENd0p6aR4","recording_locator":"Suite n.º 2 · localizar 2–3 compases despois de [212] e seguir ata [214].","materials":[{"type":"pdf","label":"PDF · Daphnis · clarinete baixo","url":"https://marinsymphony.org/wp-content/uploads/2019/03/Marin-Clarinet-excerpt-list-2019-PDF.pdf","source":"Marin Symphony","note":"Inclúe o gran tramo 3 despois de [210] → 4 despois de [217], que cobre boa parte destes cortes.","coverage":"Extracto exacto / ampliado"},{"type":"web","label":"Notación por extractos","url":"https://excerpts.one/instruments/bassclarinet/raveldaphnis.html","source":"Excerpts.one","note":"Permite localizar individualmente [206]–[210], [212]–[214] e o tramo final.","coverage":"Extracto en web"},{"type":"score","label":"Abrir partitura / particella","url":"https://imslp.org/wiki/Daphnis_et_Chlo%C3%A9%2C_M.57_%28Ravel%2C_Maurice%29","source":"IMSLP","note":"Partitura/particella completa; localizar o corte coas marcas indicadas na ficha.","coverage":"Partitura completa"}]},{"name":"Suite n.º 2 · tramo final 2 despois de [215]–[218]","location":"2 compases despois de [215] ata [218]. Outro corte recollido en repertorio especializado de clarinete baixo.","context":"É unha das zonas de maior impulso da conclusión. A Danse générale empurra toda a orquestra cara ao final e o clarinete baixo debe responder cunha precisión case percusiva sen perder o carácter do instrumento.","role":"Parte de alta enerxía dentro da maquinaria orquestral. A función é máis de integración, ritmo e cor que de “solo” clásico, pero precisamente por iso resulta un excelente test de profesionalidade orquestral.","technique":"Resistencia, articulación, estabilidade do tempo, lectura vertical e control do forte. Preparar tamén varios compases antes para aprender a entrar dentro da textura real.","pages":"Fóra da sección de clarinete baixo do EP8661.","recording":"London Symphony Orchestra · Sir Simon Rattle · Suite n.º 2","recording_url":"https://www.youtube.com/watch?v=IlENd0p6aR4","recording_locator":"Suite n.º 2 · 2 despois de [215] → [218].","materials":[{"type":"pdf","label":"PDF · Daphnis · clarinete baixo","url":"https://marinsymphony.org/wp-content/uploads/2019/03/Marin-Clarinet-excerpt-list-2019-PDF.pdf","source":"Marin Symphony","note":"Inclúe o gran tramo 3 despois de [210] → 4 despois de [217], que cobre boa parte destes cortes.","coverage":"Extracto exacto / ampliado"},{"type":"web","label":"Notación por extractos","url":"https://excerpts.one/instruments/bassclarinet/raveldaphnis.html","source":"Excerpts.one","note":"Permite localizar individualmente [206]–[210], [212]–[214] e o tramo final.","coverage":"Extracto en web"},{"type":"score","label":"Abrir partitura / particella","url":"https://imslp.org/wiki/Daphnis_et_Chlo%C3%A9%2C_M.57_%28Ravel%2C_Maurice%29","source":"IMSLP","note":"Partitura/particella completa; localizar o corte coas marcas indicadas na ficha.","coverage":"Partitura completa"}]}],"study":["Non tratar todos os cortes como “solos”: Daphnis examina sobre todo a capacidade de integrarse nunha textura refinada e cambiar rapidamente entre funcións.","No bloque [156]–[170], practicar as figuracións rápidas moi por baixo do tempo procurando son cálido e dirección, non precisión mecánica sen frase.","Nos cortes [206]–[218], estudar coa partitura xeral para identificar que voces marcan o pulso e con quen debe aliñarse o clarinete baixo.","Comparar unha toma illada do extracto cunha interpretación dentro da suite completa: a dinámica e o carácter adoitan cambiar cando se entende a densidade real da orquestra.","Usar o vídeo específico de clarinete baixo enlazado nas fontes como apoio técnico, pero conservar unha gravación sinfónica completa como modelo musical."],"score_url":"https://imslp.org/wiki/Daphnis_et_Chlo%C3%A9%2C_M.57_%28Ravel%2C_Maurice%29","score_note":"IMSLP: partitura completa e materiais de Daphnis et Chloé. Para estes extractos convén traballar a Suite n.º 2/terceiro cadro. O EP8661 non contén estes pasaxes na sección de clarinete baixo.","recording":"London Symphony Orchestra · Sir Simon Rattle · Daphnis et Chloé, Suite n.º 2 (vídeo oficial LSO).","recording_url":"https://www.youtube.com/watch?v=IlENd0p6aR4","recording_note":"A biblioteca emprega marcas de ensaio como sistema principal de localización porque hai varias edicións e cortes de vídeo. Para [157] e [167] existen ademais materiais de audición específicos enlazados nas fontes.","sources":[["Boston Symphony / Tanglewood: Daphnis bass clarinet, [167] e arredor de [213]–[214]","https://www.bso.org/tmc/instrumental-program-application-requirements"],["Arena di Verona: parte de clarinete baixo con marcas [157], [165], [167], [170]","https://www.arena.it/storage/docs/20220908_Passi%20Audizione%202023%20%20Clarinetto%20basso%20%2B%20Clarinetto%202%C2%B0.pdf"],["Lexcerpts: cinco extractos de Daphnis para clarinete baixo, incluídos [206]–[210], [212]–[214] e [215]–[218]","https://pdfcoffee.com/lexcerpts-orchestral-excerpts-for-bass-clarinet-v31-us-pdf-free.html"],["Grzegorz Grzeszczyk: Daphnis et Chloé – bass clarinet excerpt","https://www.youtube.com/watch?v=BjCTKtP46rA"],["London Symphony Orchestra / Simon Rattle: Daphnis et Chloé Suite No. 2","https://www.youtube.com/watch?v=IlENd0p6aR4"],["IMSLP: Daphnis et Chloé","https://imslp.org/wiki/Daphnis_et_Chlo%C3%A9%2C_M.57_%28Ravel%2C_Maurice%29"]],"portrait_url":"https://commons.wikimedia.org/wiki/Special:FilePath/Maurice_Ravel_1925.jpg?width=500","period":"Século XX · modernismo francés / impresionismo e clasicismo de Ravel","genre":"Ballet / “symphonie chorégraphique” nun acto e tres cadros, M.57","year":"1909–1912 · estrea 1912","work_structure":"Un acto dividido en tres cadros. A Suite n.º 2, a máis utilizada en repertorio orquestral, corresponde esencialmente ao terceiro cadro: Lever du jour · Pantomime · Danse générale.","influences":"O punto de partida é a novela pastoril grega de Longo, filtrada polo escenario de Fokine e pola estética dos Ballets Russes. Ravel non busca unha reconstrución arqueolóxica de Grecia: crea unha antigüidade idealizada mediante harmonía modal, cor orquestral, gran continuidade sinfónica e unha escritura extraordinariamente detallada das madeiras.","portrait_credit":"Maurice Ravel, 1925 · Bibliothèque nationale de France / Wikimedia Commons","portrait_source":"https://commons.wikimedia.org/wiki/File:Maurice_Ravel_1925.jpg","reviewed":"2026-10-01"},{"id":"3-1-27","course":3,"quarter":1,"instrument":"Clarinete baixo","composer":"Wagner","work":"Tannhäuser","probespiel":"42","status":"Ficha revisada · lista","summary":"Ópera romántica de Wagner en tres actos. O extracto clásico de clarinete baixo do EP8661 está no Acto III, escena 1, arredor da oración de Elisabeth “Allmächt’ge Jungfrau” e da súa saída: un pasaxe lento, escuro e moi cantabile no que o instrumento funciona como comentario psicolóxico da escena.","composer_bio":"Richard Wagner (1813–1883) foi compositor, director e autor dos seus propios libretos. A súa concepción do drama musical procura integrar texto, escena e orquestra nun discurso continuo, e emprega motivos recorrentes asociados a personaxes, obxectos, emocións e ideas dramáticas. A súa escritura orquestral ampliou enormemente a función narrativa da orquestra e deu ás madeiras graves —entre elas o clarinete baixo— un papel de cor, comentario e caracterización psicolóxica, non só de reforzo harmónico.","work_context":"Wagner compuxo Tannhäuser na década de 1840 e dirixiu a estrea en Dresde o 19 de outubro de 1845. O libreto, escrito polo propio compositor, combina tradicións medievais alemás: a lenda do poeta Tannhäuser e Venusberg, a peregrinación a Roma e o concurso de cantores do Wartburg. A obra foi revisada repetidamente, especialmente para París en 1861, onde Wagner ampliou e transformou a escena de Venusberg. Musicalmente ocupa unha posición de transición entre a ópera romántica alemá dos seus primeiros anos e a continuidade dramática das obras maduras.","excerpts":[{"name":"Acto III · escena 1 · oración e saída de Elisabeth","location":"EP8661: Acto III, escena 1, p. 42. O pasaxe sitúase no contexto de “Allmächt’ge Jungfrau!”, a oración de Elisabeth, e no tramo orquestral da súa longa saída antes da escena de Wolfram.","context":"Elisabeth agarda o regreso dos peregrinos e comproba que Tannhäuser non está entre eles. Despois implora á Virxe e ofrece a súa vida pola salvación del. Cando deixa a escena, a orquestra continúa expresando o que xa non se di con palabras; inmediatamente despois Wolfram queda só e percibe a proximidade da morte.","role":"O clarinete baixo pasa a primeiro plano como voz escura, íntima e dolente. Non reforza simplemente o baixo: prolonga emocionalmente a oración de Elisabeth e a súa saída, funcionando case como unha voz interior da escena.","technique":"Legato moi sostido, estabilidade de afinación no rexistro grave, ataques suaves, respiración longa, control de pp/p e capacidade de dar dirección á frase sen excesivo rubato. A cor debe ser escura pero non opaca.","pages":"EP8661: p. 42 · “Tannhäuser, 3. Aufzug, 1. Szene”.","recording":"Birgit Nilsson · Dietrich Fischer-Dieskau · Orchester der Deutschen Oper Berlin · Otto Gerdes (DG, 1969)","recording_url":"https://www.youtube.com/watch?v=RhOgipzEVyc","recording_locator":"O vídeo corresponde a “Allmächt’ge Jungfrau”. Segue a escena desde o inicio da oración; o fragmento de clarinete baixo sitúase no tramo orquestral asociado á saída de Elisabeth, antes de “Wie Todesahnung”. Esta referencia escénica é máis fiable ca un minuto universal."}],"study":["Escoitar a escena completa, non só o solo: identificar o final da oración de Elisabeth, a súa saída e a posterior entrada de Wolfram.","Traballar a frase como se fose unha liña vocal: dirección harmónica, respiración e consonantes/ataques moi suaves.","Practicar pp no rexistro grave buscando núcleo de son. Un son simplemente “escuro” pero sen proxección non cumpre a función dramática.","Comparar a función do clarinete baixo aquí coa de Tristan: en ambos Wagner utiliza o instrumento como comentario psicolóxico, pero o carácter emocional é diferente.","Revisar a versión da partitura usada pola orquestra, porque Tannhäuser existe en varias revisións e a numeración/maquetación pode cambiar."],"score_url":"https://imslp.org/wiki/Tannh%C3%A4user%2C_WWV_70_%28Wagner%2C_Richard%29","score_note":"IMSLP: partituras completas e partes de varias versións. O EP8661 identifica o extracto de clarinete baixo como Acto III, escena 1, p. 42.","recording":"Otto Gerdes · Orchester der Deutschen Oper Berlin · Birgit Nilsson / Dietrich Fischer-Dieskau (DG, 1969), pista/escena “Allmächt’ge Jungfrau”.","recording_url":"https://www.youtube.com/watch?v=RhOgipzEVyc","recording_note":"Para esta ficha é máis práctico usar a propia escena como localizador: oración de Elisabeth → saída orquestral → “Wie Todesahnung”. Así o alumno entende ademais por que o clarinete baixo soa dese xeito.","sources":[["IMSLP: Tannhäuser, WWV 70 – versións, datas e materiais","https://imslp.org/wiki/Tannh%C3%A4user%2C_WWV_70_%28Wagner%2C_Richard%29"],["Orchester-Probespiel / repertorio: Tannhäuser, Acto III escena 1, p. 42","https://imslp.org/wiki/Orchester-Probespiel"],["RCSMM · Clarinete baixo: Tannhäuser como solo do Orchester-Probespiel","https://moodle.rcsmm.eu/pluginfile.php/1288/mod_folder/content/0/T%C3%ADtulo%20de%20Grado%20en%20EE.AA.SS.%20de%20M%C3%BAsica%20-%20Curso%2024-25/VMA_03%20Instrumento%20Auxiliar%20de%20la%20familia%20-Clarinete%20Bajo%20.pdf"],["DG/YouTube: “Allmächt’ge Jungfrau”, Gerdes / Deutsche Oper Berlin","https://www.youtube.com/watch?v=RhOgipzEVyc"]],"portrait_url":"https://commons.wikimedia.org/wiki/Special:Redirect/file/Wagner.png","period":"Romanticismo alemán · ópera romántica / transición cara ao drama musical wagneriano","genre":"Ópera romántica en tres actos, WWV 70","year":"1843–1845 · estrea 1845 · revisións de Dresde/París e posteriores","work_structure":"Tres actos. I: Venusberg e regreso de Tannhäuser a Wartburg · II: concurso de canto no Wartburg e conflito · III: regreso dos peregrinos, oración e morte de Elisabeth, retorno de Tannhäuser e redención final.","influences":"Wagner fusiona varias lendas medievais alemás e opón dous mundos simbólicos: Venusberg, asociado ao desexo sensual, e Wartburg/peregrinación, asociado á espiritualidade e á redención. A obra conserva números recoñecibles da ópera romántica, pero a orquestra xa asume un papel cada vez máis continuo e psicolóxico, algo especialmente evidente no solo de clarinete baixo do Acto III.","portrait_credit":"Richard Wagner, fotografía de 1871 · Wikimedia Commons (dominio público)","portrait_source":"https://commons.wikimedia.org/wiki/File:Wagner.png","reviewed":"2026-10-01"},{"id":"3-2-28","course":3,"quarter":2,"instrument":"Clarinete en Si♭ e La","composer":"Bartók","work":"O mandarín marabilloso","probespiel":"—","status":"Ficha revisada · lista","summary":"Pantomima-ballet op. 19 / Sz. 73, composta entre 1918 e 1924 a partir do relato de Menyhért Lengyel. Para clarinete 1.º hai dous grandes cortes de audición especialmente consolidados —[13]–[16] e [22]–[25]— e un terceiro chamamento arredor de [31]–[36] que aparece en listas profesionais, aínda que con menor frecuencia.","composer_bio":"Béla Bartók (1881–1945) foi compositor, pianista e investigador do folclore húngaro e centroeuropeo. A súa linguaxe integra ritmos e modos procedentes da música tradicional cunha escritura harmónica, contrapuntística e tímbrica plenamente moderna. Xunto con Kodály, realizou un traballo pioneiro de recollida e estudo de músicas populares, ao tempo que desenvolveu unha das voces máis persoais da primeira metade do século XX.","work_context":"Bartók coñeceu o relato de Menyhért Lengyel durante a Primeira Guerra Mundial e converteuno nunha pantomima de ambiente urbano deliberadamente incómodo: tres delincuentes obrigan unha rapaza a atraer homes para roubalos; o terceiro visitante é o misterioso Mandarín. A estrea escénica tivo lugar en Colonia o 27 de novembro de 1926 e provocou un forte escándalo. Bartók preparou despois unha suite de concerto, estreada en Budapest en 1928, que se converteu na versión máis habitual nas salas de concerto.","excerpts":[{"name":"Primeiro chamamento · [13]–[16] · extracto profesional habitual","location":"Clarinete 1.º · [13] → [16]. Moitas convocatorias amplían o final ata 4–5 compases despois de [16].","context":"Primeiro gran chamamento do clarinete dentro dos xogos de sedución. A música debe ter flexibilidade e intención escénica: a liña atrae, insinúa e cambia de dirección continuamente en vez de comportarse como unha melodía regular de concerto.","role":"Voz protagonista que personifica o xesto da rapaza. A presenza do clarinete queda en primeiro plano e necesita carácter, non só limpeza técnica.","technique":"Rubato controlado, acelerandi e ritardandi, cambios súbitos de carácter, ataques expresivos sen dureza, respiración planificada e estabilidade da afinación mentres o tempo se move.","pages":"Non figura nesta sección do EP8661.","recording":"Marin Alsop · Bournemouth Symphony Orchestra · ballet completo","recording_url":"https://www.naxos.com/CatalogueDetail/?id=8.557433","recording_locator":"Pista “First seduction game: the shabby old rake”. Para o corte exacto, seguir [13] → [16] na particella.","materials":[{"type":"pdf","label":"PDF · [13]–[16]","url":"https://www.njsymphony.org/assets/doc/Clarinet-Audition-Packet-9.25.21-FINAL-f00029e935.pdf","source":"New Jersey Symphony","note":"Paquete oficial de audición con partitura do primeiro chamamento.","coverage":"Extracto exacto"},{"type":"score","label":"Abrir partitura / particella","url":"https://imslp.org/wiki/The_Miraculous_Mandarin_%28Bart%C3%B3k%2C_B%C3%A9la%29","source":"IMSLP","note":"Partitura/particella completa; localizar o corte coas marcas indicadas na ficha.","coverage":"Partitura completa"},{"type":"book","label":"Hadcock · The Working Clarinetist","url":"https://www.clarinetallmusic.com/products/hadcock-the-working-clarinetist-orchestral-excerpts-roncorp-publications","source":"Roncorp Publications","note":"Inclúe a Suite de The Miraculous Mandarin.","coverage":"Referencia impresa"}]},{"name":"Segundo chamamento · [22]–[25] · extracto profesional habitual","location":"Clarinete 1.º · [22] → [25]. Segundo a convocatoria pode comezar 1 compás despois de [22] e rematar no primeiro compás / 1 despois de [25].","context":"Segundo xogo de sedución. É un dos pasaxes máis característicos da obra e unha proba directa de capacidade para facer que os numerosos cambios de tempo e de impulso soen como unha única escena.","role":"O clarinete encarna de novo a danza e o poder de atracción da rapaza; a frase pasa por momentos de insinuación, axitación e maior intensidade, en diálogo estreito co resto das madeiras.","technique":"Pacing moi preciso, rubato que non destrúa o pulso, coordinación co 2.º clarinete, tremolos e dixitacións incómodas, cambios rápidos de dinámica e capacidade de manter continuidade a través das transicións de tempo.","pages":"Non figura nesta sección do EP8661.","recording":"Marin Alsop · Bournemouth Symphony Orchestra · ballet completo","recording_url":"https://www.naxos.com/CatalogueDetail/?id=8.557433","recording_locator":"Pista “Second seduction game: the young student”. Seguir [22] → [25] para delimitar a versión exacta da audición.","materials":[{"type":"pdf","label":"PDF · [22]–[25]","url":"https://www.njsymphony.org/assets/doc/Clarinet-Audition-Packet-9.25.21-FINAL-f00029e935.pdf","source":"New Jersey Symphony","note":"Paquete oficial de audición con partitura do segundo chamamento.","coverage":"Extracto exacto"},{"type":"score","label":"Abrir partitura / particella","url":"https://imslp.org/wiki/The_Miraculous_Mandarin_%28Bart%C3%B3k%2C_B%C3%A9la%29","source":"IMSLP","note":"Partitura/particella completa; localizar o corte coas marcas indicadas na ficha.","coverage":"Partitura completa"},{"type":"book","label":"Hadcock · The Working Clarinetist","url":"https://www.clarinetallmusic.com/products/hadcock-the-working-clarinetist-orchestral-excerpts-roncorp-publications","source":"Roncorp Publications","note":"Inclúe a Suite de The Miraculous Mandarin.","coverage":"Referencia impresa"}]},{"name":"Terceiro chamamento · arredor de [31]–[36] · extracto adicional","location":"Clarinete 1.º · corte variable. Históricamente aparecen 3 compases antes de [31] → [34] e [31] → [36].","context":"Terceiro xogo de sedución e transición cara á escena co Mandarín. Non aparece con tanta regularidade coma os dous primeiros cortes, pero si está documentado en repertorios profesionais de principal.","role":"Continúa a función teatral dos chamamentos anteriores, agora nunha escena máis tensa e progresivamente máis obsesiva.","technique":"Cambios de tempo e dinámica, continuidade do xesto entre rexistros, control de articulación e capacidade para conservar dirección musical nun corte moi fragmentario se se estuda fóra de contexto.","pages":"Non figura nesta sección do EP8661.","recording":"Marin Alsop · Bournemouth Symphony Orchestra · ballet completo","recording_url":"https://www.naxos.com/CatalogueDetail/?id=8.557433","recording_locator":"Pista “Third seduction game” e continuación. A extensión exacta depende da lista; localizar [31] e seguir a marca de fin indicada.","materials":[{"type":"score","label":"Abrir partitura / particella","url":"https://imslp.org/wiki/The_Miraculous_Mandarin_%28Bart%C3%B3k%2C_B%C3%A9la%29","source":"IMSLP","note":"Partitura/particella pública: localizar [31]–[36] coas marcas de ensaio.","coverage":"Partitura completa"},{"type":"pdf","label":"PDF · lista profesional que inclúe [31]–[36]","url":"https://allisyar.com/wp-content/uploads/2012/06/principal-clarinet-rep-list-2817.pdf","source":"Cincinnati Symphony","note":"Confirma este terceiro corte como material profesional adicional; é lista, non reimpresión da parte.","coverage":"Referencia oficial"},{"type":"book","label":"Hadcock · The Working Clarinetist","url":"https://www.clarinetallmusic.com/products/hadcock-the-working-clarinetist-orchestral-excerpts-roncorp-publications","source":"Roncorp Publications","note":"Inclúe The Miraculous Mandarin; útil para ampliar o estudo do repertorio.","coverage":"Referencia impresa"}]}],"study":["Preparar primeiro [13]–[16] e [22]–[25]: son os dous cortes que se repiten con maior estabilidade nas convocatorias modernas.","Non estudar os cambios de tempo como unha sucesión de metrónomos illados. Construír unha liña de aceleración/relaxación e despois comprobar cada transición coa partitura.","No segundo chamamento, practicar por bloques moi curtos os tremolos e os enlaces de dedos antes de reintegralos no rubato.","Escoitar os tres xogos de sedución consecutivamente para entender que as tres cadencias pertencen á mesma acción dramática pero non teñen exactamente o mesmo carácter.","Preparar [31]–[36] como material adicional unha vez consolidados os dous cortes principais."],"score_url":"https://imslp.org/wiki/The_Miraculous_Mandarin_%28Bart%C3%B3k%2C_B%C3%A9la%29","score_note":"IMSLP dispón de partitura e particellas da obra/suite segundo os dereitos aplicables. A programación non lle asigna páxina no EP8661; os cortes profesionais deben localizarse polas marcas [13], [22] e [31].","recording":"Marin Alsop · Bournemouth Symphony Orchestra · Naxos, ballet completo.","recording_url":"https://www.naxos.com/CatalogueDetail/?id=8.557433","recording_note":"A edición está dividida por escenas —primeiro, segundo e terceiro xogo de sedución—, unha vantaxe pedagóxica para relacionar os tres grandes chamamentos do clarinete coa acción. Para os límites exactos mantéñense as marcas de ensaio.","sources":[["Barcelona Symphony Orchestra · Principal Clarinet 2025: [13]–5 despois de [16] e 1 despois de [22]–1 despois de [25]","https://assets.muvac.com/vacancies/j16vzjr1/docs/678734/1753785327183-principal_clarinet_audition_rules.pdf?download="],["Chattanooga Symphony 2025 · Principal Clarinet:
