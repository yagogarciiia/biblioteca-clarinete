r:#79511f;margin-right:6px}.materiallegend{background:#f8fbfd;border:1px solid #dce6ed;border-radius:8px;padding:10px 12px;margin:10px 0 16px;font-size:12px;color:#536a79;line-height:1.45}.study li{margin:7px 0;line-height:1.5}textarea{width:100%;min-height:100px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:9px 0 0}.actions button{padding:9px 12px;border:1px solid #cbdde7;background:#eaf2f7;border-radius:8px;cursor:pointer}.count{font-size:12px;color:#557080;margin:7px 0}.warn{color:#765c13}@media(max-width:820px){.layout{grid-template-columns:1fr}.sidebar{position:static;max-height:360px}.detail{padding:18px}}

or, obra, extracto…" aria-label="Buscar"><div class="filters"><select id="course"><option value="">Todos os cursos</option><option value="2">2.º curso</option><option value="3">3.º curso</option></select><select id="quarter"><option value="">Ambos cuadrimestres</option><option value="1">Primeiro</option><option value="2">Segundo</option></select><select id="instrument"><option value="">Todos os instrumentos</option><option value="Clarinete en Si♭ e La">Clarinete Sib/La</option><option value="Clarinete baixo">Clarinete baixo</option><option value="Requinto">Requinto</option></select><select id="status"><option value="">Todas as fichas</option><option value="documentada">Documentadas</option><option value="pendiente">Pendentes</option></select></div><div id="count" class="count"></div><div id="results"></div></aside><main class="panel detail" id="detail"><p>Escolle unha obra na biblioteca.</p></main></div></div>
<script>const DB={"project":"Biblioteca personal de extractos orquestales de clarinete","version":"1.4.1","source":"Programacións docentes CSM A Coruña 2026/27 + investigación documental por fichas; v1.2 incorpora material de estudo por extracto fóra do Probespiel: PDFs institucionais de audición, partituras públicas e referencias bibliográficas a coleccións profesionais.","entries":[{"id":"2-1-1","course":2,"quarter":1,"instrument":"Clarinete en Si♭ e La","composer":"Rimski-Kórsakov","work":"Capricho español","probespiel":"—","status":"Ficha revisada · lista","summary":"Capricho orquestral op. 34 (1887) en cinco seccións encadeadas. O clarinete é un dos grandes protagonistas tímbricos da obra: ten solos de audición nas Alboradas e na Scena e canto gitano, ademais dun pasaxe exposto no Fandango final.","composer_bio":"Nikolái Rimski-Kórsakov (1844–1908) foi compositor, director e pedagogo ruso, membro do grupo coñecido como “Os Cinco”. Formouse tamén como oficial de mariña e acabou converténdose nunha das grandes referencias da orquestración do século XIX. A súa obra combina interese por materiais nacionais ou exóticos cun dominio extraordinario da cor instrumental; a súa actividade como profesor e o seu tratado de orquestración tiveron unha influencia enorme nas xeracións posteriores.","work_context":"Durante o verán de 1887 Rimski-Kórsakov traballaba na orquestración de O príncipe Ígor de Borodin cando interrompeu o proxecto para compoñer unha obra sobre temas españois. A idea inicial era unha fantasía virtuosa para violín e orquestra, pero decidiu repartir o virtuosismo entre toda a formación. A obra estreouse en San Petersburgo en 1887 baixo a súa dirección e foi dedicada aos músicos da Orquestra da Ópera Imperial. O propio compositor insistiu en que os cambios de timbre, as figuracións adaptadas a cada instrumento e as pequenas cadencias solistas son a esencia da obra, non simple decoración.","excerpts":[{"name":"I. Alborada · 1.º solo","location":"Movemento I, [A]–[B]. Clarinete 1.º en La. É un dos cortes estándar de audición.","context":"Tras a apertura orquestral, o clarinete presenta material brillante da Alborada e funciona como un dos primeiros focos solistas da obra.","role":"Solista virtuoso: enerxía de danza, luminosidade e resposta inmediata ao tutti. Debe proxectar sen facer pesado o fraseo.","technique":"Trinos, figuración rápida, ataques definidos, pulsación estable e dirección do crescendo.","pages":"Non figura en EP8661","recording":"Ernest Ansermet · Orchestre de la Suisse Romande (Decca)","recording_url":"https://classical.music.apple.com/gb/album/1896452404","recording_locator":"Pista I “Alborada” (1:16). O primeiro solo aparece practicamente ao comezo; referencia exacta: [A]–[B].","materials":[{"type":"pdf","label":"PDF · I movemento [A]–final","url":"https://www.carnegiehall.org/uploadedFiles/Resources_and_Components/PDF/WMI_Brochures_Applications_Forms/Clarinet_NYO-USA.pdf#page=3","source":"Carnegie Hall · NYO-USA","note":"O PDF mostra a parte de clarinete do I movemento desde [A], polo que cobre este solo e o seguinte.","coverage":"Extracto exacto / ampliado"},{"type":"score","label":"Abrir partitura / particella","url":"https://imslp.org/wiki/Spanish_Capriccio%2C_Op.34_(Rimsky-Korsakov%2C_Nikolai)","source":"IMSLP","note":"Partitura/particella completa; localizar o corte coas marcas indicadas na ficha.","coverage":"Partitura completa"},{"type":"book","label":"McGinnis · vol. II","url":"https://www.clarinetallmusic.com/products/clarinet-orchestral-excerpts-vol-2-imc-mcginnis","source":"International Music Company","note":"O volume II inclúe Capriccio Espagnol. Edición comercial: úsase como referencia, non se incorpora ao ZIP.","coverage":"Referencia impresa"},{"type":"book","label":"Hadcock · The Working Clarinetist","url":"https://www.clarinetallmusic.com/products/hadcock-the-working-clarinetist-orchestral-excerpts-roncorp-publications","source":"Roncorp Publications","note":"Inclúe Capriccio espagnole e comentarios de preparación de repertorio.","coverage":"Referencia impresa"}]},{"name":"I. Alborada · 2.º solo","location":"Movemento I, [C] ata aproximadamente 11 compases antes do final (o corte exacto varía lixeiramente segundo a lista).","context":"Segunda aparición exposta do clarinete dentro da mesma Alborada, novamente en alternancia co violín e co tutti.","role":"Mantén o carácter extrovertido, pero require que o segundo solo soe tan espontáneo e limpo como o primeiro.","technique":"Resistencia, repeticións rápidas, limpeza de cambios de rexistro e control dos acentos.","pages":"Non figura en EP8661","recording":"Ernest Ansermet · Orchestre de la Suisse Romande (Decca)","recording_url":"https://classical.music.apple.com/gb/album/1896452404","recording_locator":"Pista I “Alborada”. Localiza a letra [C]; é o segundo gran pasaxe de clarinete do movemento.","materials":[{"type":"pdf","label":"PDF · I movemento [A]–final","url":"https://www.carnegiehall.org/uploadedFiles/Resources_and_Components/PDF/WMI_Brochures_Applications_Forms/Clarinet_NYO-USA.pdf#page=3","source":"Carnegie Hall · NYO-USA","note":"Inclúe o segundo gran pasaxe do I movemento, arredor de [C].","coverage":"Extracto exacto / ampliado"},{"type":"score","label":"Abrir partitura / particella","url":"https://imslp.org/wiki/Spanish_Capriccio%2C_Op.34_(Rimsky-Korsakov%2C_Nikolai)","source":"IMSLP","note":"Partitura/particella completa; localizar o corte coas marcas indicadas na ficha.","coverage":"Partitura completa"},{"type":"book","label":"McGinnis · vol. II","url":"https://www.clarinetallmusic.com/products/clarinet-orchestral-excerpts-vol-2-imc-mcginnis","source":"International Music Company","note":"O volume II inclúe Capriccio Espagnol. Edición comercial: úsase como referencia, non se incorpora ao ZIP.","coverage":"Referencia impresa"},{"type":"book","label":"Hadcock · The Working Clarinetist","url":"https://www.clarinetallmusic.com/products/hadcock-the-working-clarinetist-orchestral-excerpts-roncorp-publications","source":"Roncorp Publications","note":"Inclúe Capriccio espagnole e comentarios de preparación de repertorio.","coverage":"Referencia impresa"}]},{"name":"III. Alborada","location":"Movemento III, aproximadamente 10/11 compases despois de [K] ata o final.","context":"Regresa a música da primeira Alborada, transposta e reorquestrada. Rimski intercambia funcións: material que no I era do clarinete pasa ao violín e viceversa.","role":"O clarinete participa no xogo de intercambio tímbrico co violín; a comparación entre I e III é unha lección de orquestración en si mesma.","technique":"Axilidade, precisión no relevo, resposta en frío e igualdade de articulación a gran velocidade.","pages":"Non figura en EP8661","recording":"Ernest Ansermet · Orchestre de la Suisse Romande (Decca)","recording_url":"https://classical.music.apple.com/gb/album/1896452404","recording_locator":"Pista III “Alborada” (1:08). O extracto está no tramo final; referencia: 10/11 compases despois de [K] ata o final.","materials":[{"type":"pdf","label":"PDF · III movemento, 11 despois de [K]–final","url":"https://www.carnegiehall.org/uploadedFiles/Resources_and_Components/PDF/WMI_Brochures_Applications_Forms/Clarinet_NYO-USA.pdf#page=4","source":"Carnegie Hall · NYO-USA","note":"Coincide co corte profesional habitual do III movemento.","coverage":"Extracto exacto"},{"type":"score","label":"Abrir partitura / particella","url":"https://imslp.org/wiki/Spanish_Capriccio%2C_Op.34_(Rimsky-Korsakov%2C_Nikolai)","source":"IMSLP","note":"Partitura/particella completa; localizar o corte coas marcas indicadas na ficha.","coverage":"Partitura completa"},{"type":"book","label":"McGinnis · vol. II","url":"https://www.clarinetallmusic.com/products/clarinet-orchestral-excerpts-vol-2-imc-mcginnis","source":"International Music Company","note":"O volume II inclúe Capriccio Espagnol. Edición comercial: úsase como referencia, non se incorpora ao ZIP.","coverage":"Referencia impresa"},{"type":"book","label":"Hadcock · The Working Clarinetist","url":"https://www.clarinetallmusic.com/products/hadcock-the-working-clarinetist-orchestral-excerpts-roncorp-publications","source":"Roncorp Publications","note":"Inclúe Capriccio espagnole e comentarios de preparación de repertorio.","coverage":"Referencia impresa"}]},{"name":"IV. Scena e canto gitano · cadencia","location":"Movemento IV, arredor de 4 compases despois de [L] ata 7 compases antes de [M] nas listas habituais.","context":"Tras unha fanfarra e varias intervencións solistas, o clarinete recibe unha cadencia libre sobre un redobre de pratos; forma parte dunha cadea de exhibicións tímbricas antes do canto gitano.","role":"Solista claramente exposto: debe soar flexible, improvisatorio e brillante, mantendo a dirección cara á reentrada da orquestra.","technique":"Liberdade agóxica controlada, respiración, progresión dinámica, seguridade de ataques e cor.","pages":"Non figura en EP8661","recording":"Ernest Ansermet · Orchestre de la Suisse Romande (Decca)","recording_url":"https://classical.music.apple.com/gb/album/1896452404","recording_locator":"Pista IV “Scena e canto gitano” (3:48). A cadencia de clarinete chega tras as intervencións iniciais de fanfarra, violín e frauta; a referencia máis rápida é [L]–[M].","materials":[{"type":"pdf","label":"PDF · IV movemento · cadencia","url":"https://depts.washington.edu/uwwinds/auditions/2013/clarinet13.pdf","source":"University of Washington · Large Ensemble Auditions","note":"O paquete identifica e imprime a cadencia do IV movemento como Excerpt 5.","coverage":"Extracto exacto"},{"type":"score","label":"Abrir partitura / particella","url":"https://imslp.org/wiki/Spanish_Capriccio%2C_Op.34_(Rimsky-Korsakov%2C_Nikolai)","source":"IMSLP","note":"Partitura/particella de dominio público. Localizar a cadencia do IV movemento na letra indicada na ficha.","coverage":"Partitura completa"},{"type":"book","label":"McGinnis · vol. II","url":"https://www.clarinetallmusic.com/products/clarinet-orchestral-excerpts-vol-2-imc-mcginnis","source":"International Music Company","note":"O volume II inclúe Capriccio Espagnol. Edición comercial: úsase como referencia, non se incorpora ao ZIP.","coverage":"Referencia impresa"},{"type":"book","label":"Hadcock · The Working Clarinetist","url":"https://www.clarinetallmusic.com/products/hadcock-the-working-clarinetist-orchestral-excerpts-roncorp-publications","source":"Roncorp Publications","note":"Inclúe Capriccio espagnole e comentarios de preparación de repertorio.","coverage":"Referencia impresa"}]},{"name":"V. Fandango asturiano · solo adicional","location":"Movemento V. Non sempre se inclúe nas listas de audición, pero a particella contén un pasaxe de clarinete claramente exposto dentro do Fandango.","context":"O último movemento acumula e transforma materiais previos e conduce á coda final. A escritura solista segue mostrando a filosofía da obra: alternancia continua de cores.","role":"Pasaxe exposto dentro do movemento final, máis integrado no fluxo do Fandango que as cadencias do IV.","technique":"Claridade de trinos, afinación, articulación lixeira e capacidade de emerxer da textura sen romper o carácter da danza.","pages":"Non figura en EP8661","recording":"Ernest Ansermet · Orchestre de la Suisse Romande (Decca)","recording_url":"https://classical.music.apple.com/gb/album/1896452404","recording_locator":"Pista V “Fandango asturiano” (3:24). Para unha localización exacta, seguir a particella de clarinete: é un solo interno do movemento, non un corte estándar universal.","materials":[{"type":"score","label":"Abrir partitura / particella","url":"https://www.free-scores.com/partitions_telecharger.php?partition=7835","source":"IMSLP","note":"Free-scores ofrece a particella completa de Clarinete 1/2 en PDF; nela aparece o V. Fandango asturiano.","coverage":"Partitura completa"},{"type":"score","label":"Abrir partitura / particella","url":"https://imslp.org/wiki/Spanish_Capriccio%2C_Op.34_(Rimsky-Korsakov%2C_Nikolai)","source":"IMSLP","note":"Partitura/particella de dominio público. Localizar o solo do Fandango coas marcas indicadas na ficha.","coverage":"Partitura completa"},{"type":"book","label":"McGinnis · vol. II","url":"https://www.clarinetallmusic.com/products/clarinet-orchestral-excerpts-vol-2-imc-mcginnis","source":"International Music Company","note":"O volume II inclúe Capriccio Espagnol. Edición comercial: úsase como referencia, non se incorpora ao ZIP.","coverage":"Referencia impresa"},{"type":"book","label":"Hadcock · The Working Clarinetist","url":"https://www.clarinetallmusic.com/products/hadcock-the-working-clarinetist-orchestral-excerpts-roncorp-publications","source":"Roncorp Publications","note":"Inclúe Capriccio espagnole e comentarios de preparación de repertorio.","coverage":"Referencia impresa"}]}],"study":["Comparar I e III coa partitura xeral: anotar que material troca entre violín e clarinete.","Preparar por separado os dous solos do I, o final do III e a cadencia do IV, porque poden pedirse de forma independente.","No IV, escoitar toda a cadea de cadencias para comprender o carácter que debe herdar e transformar o clarinete.","Ler tamén o solo do V, aínda que non sexa tan frecuente nas audicións, para completar a visión da obra."],"score_url":"https://imslp.org/wiki/Spanish_Capriccio%2C_Op.34_(Rimsky-Korsakov%2C_Nikolai)","score_note":"IMSLP: partitura xeral e particellas. O Capricho español non está incluído no EP8661 de clarinete; para a biblioteca usamos a particella orixinal e cortes de audición profesionais.","recording":"Ernest Ansermet · Orchestre de la Suisse Romande, Decca. A edición dixital separa os cinco movementos en pistas, facilitando a localización.","recording_url":"https://classical.music.apple.com/gb/album/1896452404","recording_note":"Cada extracto indica a pista e unha referencia de ensaio. Como os movementos son curtos, esta combinación permite localizar os solos rapidamente.","sources":[["LA Phil: estrutura, orquestración e función das cadencias","https://www.laphil.com/works/capriccio-espagnol-op-34"],["Excerpts.one: cortes de audición de clarinete","https://excerpts.one/instruments/clarinet/rimskycapriccio.html"],["Philip Hale / Project Gutenberg: cadencia do IV e solo de clarinete no Fandango V","https://www.gutenberg.org/files/56208/56208-h/56208-h.htm"],["Sphinx 2025: cortes [A]–[B], [C], III e IV","https://www.scribd.com/document/804825953/03-CLARINET-Full-List-SOPA-2025"],["Apple Music Classical: Ansermet / Suisse Romande, pistas e duracións","https://classical.music.apple.com/gb/album/1896452404"],["IMSLP: Capriccio espagnol, op. 34","https://imslp.org/wiki/Spanish_Capriccio%2C_Op.34_(Rimsky-Korsakov%2C_Nikolai)"]],"portrait_url":"https://commons.wikimedia.org/wiki/Special:Redirect/file/Rimsky-Korsakov%20by%20Repin.jpg","period":"Romanticismo tardío · nacionalismo ruso","genre":"Capricho / suite orquestral de cinco seccións, op. 34","year":"1887","work_structure":"I Alborada · II Variazioni · III Alborada · IV Scena e canto gitano · V Fandango asturiano; interprétanse sen pausa.","influences":"Os temas proceden de materiais de carácter español, especialmente danzas e melodías asociadas ao norte peninsular. A composición nace menos como reconstrución folclórica que como laboratorio de cor orquestral: un mesmo tema cambia de personalidade ao pasar de clarinete a violín, de madeira a metal ou de solista a tutti.","portrait_credit":"Rimski-Kórsakov, retrato de Iliá Repin (1893) · Wikimedia Commons","portrait_source":"https://commons.wikimedia.org/wiki/File:Rimsky-Korsakov_by_Repin.jpg","reviewed":"2026-10-01"},{"id":"2-1-2","course":2,"quarter":1,"instrument":"Clarinete en Si♭ e La","composer":"Rimski-Kórsakov","work":"Scheherezade","probespiel":"19–20","status":"Ficha revisada · lista","summary":"Suite sinfónica op. 35 (1888), inspirada no marco narrativo de As mil e unha noites. O clarinete participa de maneira moi exposta no carácter narrativo e colorista da obra: o Probespiel reúne unha cadencia do II movemento e solos dos movementos III e IV, todos con funcións expresivas diferentes.","composer_bio":"Nikolái Rimski-Kórsakov (1844–1908) foi compositor, director e pedagogo ruso, membro de “Os Cinco”. A súa experiencia como oficial de mariña ampliou o seu contacto con outras culturas, pero a súa importancia histórica vén sobre todo do dominio da orquestración: converteu a cor instrumental nun elemento estrutural da composición e exerceu unha influencia enorme a través da súa docencia e do seu tratado de orquestración.","work_context":"Scheherezade foi composta no verán de 1888 como “suite sinfónica sobre As mil e unha noites”. A historia marco presenta á sultá Scheherezade, que salva a vida mantendo o sultán fascinado cos seus relatos. Rimski utilizou inicialmente títulos descritivos para os catro movementos, pero insistiu despois en que non quería unha narración literal: os temas e as cores debían activar a imaxinación do oínte. O motivo severo do inicio adoita asociarse ao sultán e o violín solista, acompañado pola arpa, funciona como a voz recorrente de Scheherezade. A obra é unha das culminacións da súa escritura orquestral.","excerpts":[{"name":"II. O conto do príncipe Kalendar · cadencia","location":"Movemento II, Recitativo / Moderato assai, letra [F]–[G]. Clarinete 1.º en La. É un dos cortes máis universais de audición.","context":"No segundo movemento, a narración alterna episodios contrastantes e recitativos instrumentais. En [F] o clarinete recibe unha cadencia de carácter improvisatorio, como se asumise por un momento a voz do narrador.","role":"Solista moi exposto. Debe combinar liberdade retórica e control estrutural: a sensación é de improvisación, pero as repeticións, accelerandi, ritardandi e dirección dinámica teñen que estar perfectamente organizados.","technique":"Control dos grupos repetidos, igualdade dixital, aceleración progresiva sen tensión, respiración planificada, afinación nos cambios de rexistro e capacidade de volver ao tempo con precisión.","pages":"EP8661: p. 19","recording":"Chicago Symphony Orchestra · Fritz Reiner · Sidney Harth, violín (RCA, 1960)","recording_url":"https://classical.music.apple.com/us/recording/nicolay-rimsky-korsakov-1844-pp42-401462641","recording_locator":"Pista II, “The Story of the Kalender Prince”. Para localizalo rapidamente, segue a letra [F]: aparece como Recit. Moderato assai e remata en [G]. É máis fiable a letra de ensaio ca un minuto universal."},{"name":"III. O novo príncipe e a nova princesa · solo lírico","location":"Movemento III, Andantino quasi allegretto. O solo que recolle o Probespiel está no primeiro tramo do movemento; segundo edicións/listas aparece arredor dos cc. 20–24, aproximadamente 5 compases antes de [A] ata [A]. Clarinete 1.º en Si♭.","context":"O terceiro movemento é o máis lírico da suite. Tras o tema inicial das cordas, o clarinete introduce arabescos e unha liña solista sobre un acompañamento moi transparente, contribuíndo ao clima íntimo e elegante do episodio.","role":"Solista cantabile e ornamentador. A función non é “virtuosa” no sentido da cadencia do II, senón crear continuidade, flexibilidade e cor dentro dunha textura delicada.","technique":"Legato entre rexistros, homoxeneidade de son, afinación nas figuras arpexadas, fraseo en 6/8 e equilibrio entre expresividade e estabilidade do pulso.","pages":"EP8661: p. 20","recording":"Chicago Symphony Orchestra · Fritz Reiner · Sidney Harth, violín (RCA, 1960)","recording_url":"https://classical.music.apple.com/us/recording/nicolay-rimsky-korsakov-1844-pp42-401462641","recording_locator":"Pista III, “The Young Prince and the Young Princess”. Está no comezo do movemento; a referencia práctica é cc. 20–24 / cinco compases antes de [A] ata [A]."},{"name":"IV. Festival en Bagdad · solo Vivo","location":"Movemento IV, solo entre [I] e [K] nas listas profesionais máis habituais. Clarinete 1.º en La.","context":"O finale acumula escenas de festa, recordos dos movementos anteriores e unha orquestración de enorme enerxía. O solo de clarinete aparece no medio deste fluxo como unha intervención áxil e incisiva.","role":"Solista brillante dentro dunha textura moi activa. Ten que emerxer con carácter e precisión sen romper a sensación de impulso continuo do movemento.","technique":"Articulación rápida, estabilidade rítmica, coordinación lingua-dedos, seguridade nas entradas e proxección clara sobre unha orquestra densa.","pages":"EP8661: p. 20","recording":"Chicago Symphony Orchestra · Fritz Reiner · Sidney Harth, violín (RCA, 1960)","recording_url":"https://classical.music.apple.com/us/recording/nicolay-rimsky-korsakov-1844-pp42-401462641","recording_locator":"Pista IV, “Festival in Bagdad…”. A referencia máis rápida é [I]–[K]. O minutaxe depende bastante da edición e do tempo da interpretación."}],"study":["Estudar os tres extractos como problemas expresivos diferentes: recitativo/cadencia (II), cantabile e cor (III), e virtuosismo rítmico (IV).","No II, contar conscientemente os grupos repetidos antes de introducir liberdade agóxica.","No III, escoitar a relación coas cordas e co fagot para evitar tocar o solo como unha peza independente.","No IV, practicar entradas en frío desde [I] e conservar a pulsación interna aínda que a orquestra sexa moi densa.","Como ampliación, coñecer tamén outros pasaxes frecuentes de audición: clarinete 2.º no I movemento e varios cortes adicionais do III."],"score_url":"https://imslp.org/wiki/Scheherazade%2C_Op.35_%28Rimsky-Korsakov%2C_Nikolay%29","score_note":"IMSLP: partitura xeral e particellas. As letras de ensaio permiten localizar con máis seguridade os extractos ca o minutaxe dunha gravación.","recording":"Chicago Symphony Orchestra · Fritz Reiner · Sidney Harth, violín (RCA, 1960). Gravación histórica de referencia, dividida en catro pistas.","recording_url":"https://classical.music.apple.com/us/recording/nicolay-rimsky-korsakov-1844-pp42-401462641","recording_note":"Cada extracto inclúe a pista e a letra/compás de referencia. A separación por movementos facilita a localización.","sources":[["Santa Fe Symphony: contexto de Scheherezade e As mil e unha noites","https://santafesymphony.org/thousand-nights-notes/"],["New Jersey Symphony: composición, orquestración e lugar da obra na produción de Rimski","https://www.njsymphony.org/program_notes/detail/program-notes-apr-5-7"],["Orchester-Probespiel EP8661: contido das pp. 19–20","https://www.scribd.com/document/475150634/PROBESPIEL-KLARINETTE"],["Seoul Philharmonic 2025: II [F]–[G] e IV [I]–[K]","https://www.scribd.com/document/955486582/%E1%84%89%E1%85%A5%E1%84%8B%E1%85%AE%E1%86%AF%E1%84%89%E1%85%B5%E1%84%92%E1%85%A3%E1%86%BC%E1%84%8B%E1%85%A6%E1%86%A8%E1%84%89%E1%85%A5%E1%86%A8"],["International Clarinet Association: cortes de audición de Scheherezade","https://www.clarinet.org/wp-content/uploads/2022/10/VOL40N4-SEPTEMBER2013.pdf"],["Estudo sobre a orquestración: solo do III movemento e outros pasaxes destacados","https://digital.library.unt.edu/ark:/67531/metadc83755/m2/1/high_res_d/m_01801.pdf"],["Apple Music Classical: Reiner / Chicago Symphony (1960)","https://classical.music.apple.com/us/recording/nicolay-rimsky-korsakov-1844-pp42-401462641"],["IMSLP: Scheherazade, op. 35","https://imslp.org/wiki/Scheherazade%2C_Op.35_%28Rimsky-Korsakov%2C_Nikolay%29"]],"portrait_url":"https://commons.wikimedia.org/wiki/Special:Redirect/file/Rimsky-Korsakov%20by%20Repin.jpg","period":"Romanticismo tardío · nacionalismo ruso","genre":"Suite sinfónica, op. 35","year":"1888","work_structure":"I O mar e o barco de Simbad · II O conto do príncipe Kalendar · III O novo príncipe e a nova princesa · IV Festival en Bagdad / O mar / Naufraxio / conclusión.","influences":"A fonte literaria é As mil e unha noites, pero Rimski evita unha tradución narrativa literal. A influencia máis importante é a súa propia concepción da orquestración como forma: os temas regresan transformados por cambios de timbre, rexistro e función instrumental. A estética orientalista do século XIX aparece filtrada pola linguaxe sinfónica rusa.","portrait_credit":"Rimski-Kórsakov, retrato de Iliá Repin (1893) · Wikimedia Commons","portrait_source":"https://commons.wikimedia.org/wiki/File:Rimsky-Korsakov_by_Repin.jpg","reviewed":"2026-10-01"},{"id":"2-1-3","course":2,"quarter":1,"instrument":"Clarinete en Si♭ e La","composer":"Rajmáninov","work":"Sinfonía n.º 2","probespiel":"—","status":"Ficha revisada · lista","summary":"Sinfonía n.º 2 en mi menor, op. 27 (1906–1908). O extracto fundamental para clarinete é o gran solo do III movemento, un dos pasaxes cantabile máis coñecidos do repertorio; tamén existe un solo breve e frecuente en listas de audición no II movemento.","composer_bio":"Sergei Rajmáninov (1873–1943) foi compositor, pianista e director ruso. Formouse no Conservatorio de Moscova e desenvolveu unha linguaxe de forte continuidade romántica, caracterizada pola amplitude melódica, a harmonía cromática, a escritura pianística virtuosa e un profundo sentido do canto. Tras a Revolución rusa abandonou o país en 1917 e terminou asentándose nos Estados Unidos, onde a súa actividade como pianista ocupou boa parte da súa carreira.","work_context":"A Segunda Sinfonía naceu despois do trauma provocado polo fracaso da Primeira Sinfonía en 1897. En 1906 Rajmáninov trasladouse coa familia a Dresde para afastarse das obrigas profesionais de Moscova e recuperar tempo para compoñer. Traballou na sinfonía entre 1906 e 1907/08 e dirixiu el mesmo a estrea en San Petersburgo en febreiro de 1908, con grande éxito. Está dedicada ao seu antigo profesor Sergei Taneyev. A obra emprega procedementos cíclicos: ideas do inicio reaparecen transformadas ao longo dos catro movementos, mentres o III Adagio concentra o lirismo máis expansivo.","excerpts":[{"name":"II. Allegro molto · solo breve","location":"Movemento II, solo de clarinete 1.º en Si♭ aproximadamente 12 compases antes de [29]. É un pasaxe frecuente en coleccións de extractos, aínda que menos universal ca o Adagio.","context":"O Scherzo alterna enerxía rítmica, materiais de carácter marcial e episodios máis líricos. O solo aparece como unha breve apertura de cor no medio dunha textura moito máis activa.","role":"Intervención solista breve que debe soar espontánea e cantabile sen perder a pulsación do movemento.","technique":"Entrada en frío, control de afinación, dirección da frase curta, articulación limpa e cambio rápido de carácter respecto do tutti.","pages":"Non figura en EP8661","recording":"London Symphony Orchestra · André Previn (EMI, 1973)","recording_url":"https://classical.music.apple.com/us/recording/sergey-rachmaninov-1873-pp14-693573859","recording_locator":"Pista II “Scherzo. Allegro molto” (10:08). Localización fiable: 12 compases antes de [29]; o minuto exacto cambia segundo o tempo e a edición.","materials":[{"type":"pdf","label":"PDF educativo · II movemento, solo 12 antes de [29]","url":"https://www.ucg.ac.me/skladiste/blog_23884/objava_65770/fajlovi/335894943_Orchestral_Excerpts_for_Clarinet_v2_1_US.pdf#page=16","source":"University of Montenegro · colección WoodwindExcerpts","note":"Colección educativa hospedada por unha universidade; a p. 16 reúne os dous cortes da Sinfonía n.º 2.","coverage":"Extracto exacto"},{"type":"web","label":"Notación · II movemento","url":"https://excerpts.one/instruments/clarinet/rachmaninoffsecond.html","source":"Excerpts.one","note":"Mostra directamente o solo 12 compases antes de [29].","coverage":"Extracto exacto en web"},{"type":"score","label":"Abrir partitura / particella","url":"https://imslp.org/wiki/Symphony_No.2%2C_Op.27_%28Rachmaninoff%2C_Sergei%29","source":"IMSLP","note":"Particella pública. O solo breve do II movemento localízase 12 compases antes de [29].","coverage":"Partitura completa"},{"type":"book","label":"McGinnis · vol. I","url":"https://www.clarinetallmusic.com/products/clarinet-orchestral-excerpts-vol-1-imc-mcginnis","source":"International Music Company","note":"O volume I inclúe a Sinfonía n.º 2 de Rajmáninov.","coverage":"Referencia impresa"},{"type":"book","label":"Hadcock · The Working Clarinetist","url":"https://www.clarinetallmusic.com/products/hadcock-the-working-clarinetist-orchestral-excerpts-roncorp-publications","source":"Roncorp Publications","note":"Inclúe Rachmaninoff Symphony No. 2.","coverage":"Referencia impresa"}]},{"name":"III. Adagio · gran solo de clarinete","location":"Movemento III. O corte de audición máis habitual vai desde o comezo do movemento / entrada do clarinete ata [47]; segundo a convocatoria pode rematar 1–2 compases antes ou 2 compases despois de [47]. Clarinete 1.º en La.","context":"Tras unha breve introdución das cordas, o clarinete presenta a gran melodía do movemento. A liña funciona como verdadeiro centro emocional do Adagio e regresa despois transformada noutras voces.","role":"Solista cantabile de primeira orde: o clarinete debe soar como unha voz humana, con arco longo, calor tímbrica e liberdade expresiva, pero mantendo unha referencia clara do pulso e da harmonía.","technique":"Respiración de frase longa, legato entre rexistros, control do p–mf sen perder núcleo sonoro, afinación en intervalos amplos, rubato moderado e chegada orgánica aos puntos culminantes.","pages":"Non figura en EP8661 · Dangain, Orchestral Excerpts: The Clarinet, vol. 1, pp. 56–57","recording":"London Symphony Orchestra · André Previn (EMI, 1973) · clarinete: Jack Brymer","recording_url":"https://classical.music.apple.com/us/recording/sergey-rachmaninov-1873-pp14-693573859","recording_locator":"Pista III “Adagio” (15:45). O solo de clarinete entra moi ao comezo, aproximadamente arredor de 0:25–0:30, despois da introdución das cordas. Referencia exacta: entrada inicial ata [47].","materials":[{"type":"pdf","label":"PDF · III movemento, inicio–2 despois de [47]","url":"https://www.carnegiehall.org/-/media/CarnegieHall/Files/PDFs/Education/Young-Musicians/NYO-USA/Excerpts-2025/Clarinet-Excerpts.pdf","source":"Carnegie Hall · NYO-USA 2025","note":"Material oficial de audición coa parte musical do gran solo do Adagio.","coverage":"Extracto exacto"},{"type":"score","label":"Abrir partitura / particella","url":"https://imslp.org/wiki/Symphony_No.2%2C_Op.27_%28Rachmaninoff%2C_Sergei%29","source":"IMSLP","note":"Partitura/particella completa; localizar o corte coas marcas indicadas na ficha.","coverage":"Partitura completa"},{"type":"book","label":"McGinnis · vol. I","url":"https://www.clarinetallmusic.com/products/clarinet-orchestral-excerpts-vol-1-imc-mcginnis","source":"International Music Company","note":"O volume I inclúe a Sinfonía n.º 2 de Rajmáninov.","coverage":"Referencia impresa"},{"type":"book","label":"Hadcock · The Working Clarinetist","url":"https://www.clarinetallmusic.com/products/hadcock-the-working-clarinetist-orchestral-excerpts-roncorp-publications","source":"Roncorp Publications","note":"Inclúe Rachmaninoff Symphony No. 2.","coverage":"Referencia impresa"}]}],"study":["Comezar o Adagio estudando a liña sen rubato: primeiro respiración, afinación e dirección harmónica; a liberdade vén despois.","Escoitar a introdución das cordas para tomar o carácter antes da primeira nota do clarinete.","Planificar respiracións que non rompan o arco da frase e probar varias opcións segundo o tempo da gravación/director.","Comparar a toma de Jack Brymer con outras escolas de clarinete para discutir vibrato, flexibilidade e velocidade do aire.","Preparar tamén o solo breve do II movemento como exercicio de cambio inmediato de carácter."],"score_url":"https://imslp.org/wiki/Symphony_No.2%2C_Op.27_%28Rachmaninoff%2C_Sergei%29","score_note":"IMSLP inclúe partitura xeral, particellas e materiais de referencia. O extracto principal está no III movemento e o corte exacto pode variar lixeiramente segundo a audición.","recording":"London Symphony Orchestra · André Previn (EMI, 1973). Gravación completa sen os grandes cortes históricos e unha referencia clásica para o Adagio.","recording_url":"https://classical.music.apple.com/us/album/693573859","recording_note":"O III movemento dura 15:45 nesta edición; o solo principal entra aproximadamente aos 25–30 segundos.","sources":[["Nashville Symphony: contexto da composición en Dresde e recepción da obra","https://www.nashvillesymphony.org/classical-program-notes/sergei-rachmaninoff-symphony-no-2/"],["Mariinsky: composición 1906–1907, dedicatoria a Taneyev e estrea","https://www.mariinsky.ru/en/playbill/playbill/2016/10/3/3_1900/"],["Excerpts.one: II, 12 antes de [29], e III, inicio–[47]","https://excerpts.one/instruments/clarinet/rachmaninoffsecond.html"],["Carnegie Hall / NYO-USA 2025: III movemento, inicio–2 despois de [47]","https://www.carnegiehall.org/-/media/CarnegieHall/Files/PDFs/Education/Young-Musicians/NYO-USA/Excerpts-2025/Clarinet-Excerpts.pdf"],["OFGC: Dangain vol. 1, pp. 56–57 para o Adagio","https://es.scribd.com/document/731018234/1712924581721-bases-audiciones-junio-definitivo"],["BBC Music Magazine: Previn 1973 e Jack Brymer no solo de clarinete","https://www.classical-music.com/reviews/orchestral/rachmaninoff-22"],["Apple Music Classical: Previn / LSO 1973","https://classical.music.apple.com/us/recording/sergey-rachmaninov-1873-pp14-693573859"],["IMSLP: Symphony No. 2, op. 27","https://imslp.org/wiki/Symphony_No.2%2C_Op.27_%28Rachmaninoff%2C_Sergei%29"]],"portrait_url":"https://commons.wikimedia.org/wiki/Special:Redirect/file/Sergei%20Rachmaninoff%20cph.3a40575.jpg","period":"Romanticismo tardío ruso","genre":"Sinfonía en catro movementos, op. 27","year":"1906–1908","work_structure":"I Largo – Allegro moderato · II Allegro molto · III Adagio · IV Allegro vivace.","influences":"A obra continúa a gran tradición sinfónica rusa de Tchaikovsky, pero cunha integración cíclica moi propia de Rajmáninov: células e motivos reaparecen transformados. O fracaso da Primeira Sinfonía forma parte inevitable do contexto biográfico, mentres a estancia en Dresde lle proporcionou distancia e tempo para volver ao xénero sinfónico con confianza.","portrait_credit":"Sergei Rajmáninov, Kubey-Rembrandt Studios (1921) · Library of Congress / Wikimedia Commons","portrait_source":"https://commons.wikimedia.org/wiki/File:Sergei_Rachmaninoff_cph.3a40575.jpg","reviewed":"2026-10-01"},{"id":"2-1-4","course":2,"quarter":1,"instrument":"Clarinete en Si♭ e La","composer":"Mahler","work":"Sinfonía n.º 1","probespiel":"—","status":"Ficha revisada · lista","summary":"Primeira Sinfonía de Mahler (versión definitiva en catro movementos). A programación non sinala un único corte, polo que a ficha reúne varios pasaxes habituais de clarinete 1.º que amosan funcións moi diferentes: natureza e eco, danza, marcha fúnebre e dramatismo do finale.","composer_bio":"Gustav Mahler (1860–1911) foi compositor e director austro-bohemio, unha das figuras fundamentais da transición entre o Romanticismo tardío e a modernidade musical. Desenvolveu unha carreira extraordinaria como director de ópera e orquestra —entre outros postos, na Ópera da Corte de Viena— e concentrou a súa creación principalmente na canción e na sinfonía. As súas obras combinan formas de gran escala con materiais populares, marchas, danzas, cantos de natureza e contrastes extremos de carácter e orquestración.","work_context":"A Primeira Sinfonía foi composta principalmente entre 1887 e 1888, cando Mahler traballaba en Leipzig, e estreouse en Budapest en 1889 baixo a súa dirección. A obra foi revisada varias veces: inicialmente tivo cinco movementos e unha lectura programática asociada ao título “Titan”, pero Mahler acabou eliminando o movemento Blumine e retirando os textos explicativos. A versión definitiva ten catro movementos. O primeiro incorpora material de Lieder eines fahrenden Gesellen; o segundo parte do Ländler; o terceiro transforma Bruder Martin / Frère Jacques nunha marcha fúnebre irónica; e o finale leva o conflito cara a unha conclusión triunfal.","excerpts":[{"name":"I. Langsam. Schleppend · tema de peche / pasaxe de clarinete 1.º","location":"Movemento I, aproximadamente 8 compases antes de [10] ata [12], segundo unha selección académica habitual. Clarinete 1.º.","context":"O primeiro movemento parte dunha paisaxe sonora case inmóbil e vai adquirindo perfil de canción e de danza. Este pasaxe pertence á zona máis afirmativa da exposición e esixe cambiar desde a textura “de natureza” a unha frase máis definida.","role":"Parte destacada dentro da madeira, máis integrada no tecido que un solo de concerto. O clarinete contribúe á claridade das liñas e á sensación de expansión do movemento.","technique":"Afinación de acordes, entradas suaves, homoxeneidade de rexistro, articulación flexible e atención ás indicacións de carácter de Mahler.","pages":"Non figura en EP8661","recording":"Bavarian Radio Symphony Orchestra · Rafael Kubelík (DG, 1968)","recording_url":"https://classical.music.apple.com/gb/recording/gustav-mahler-1860-pp1-1699680642","recording_locator":"Pista I “Langsam. Schleppend” (14:30). Referencia exacta na partitura: 8 compases antes de [10] ata [12].","materials":[{"type":"pdf","label":"PDF · Mahler 1 · selección de clarinete 1.º","url":"https://music.sas.upenn.edu/sites/default/files/Mahler%201%20excerpts.pdf","source":"University of Pennsylvania","note":"O documento reúne os catro movementos e imprime os pasaxes da primeira parte de clarinete.","coverage":"Extractos exactos"},{"type":"score","label":"Abrir partitura / particella","url":"https://imslp.org/wiki/Symphony_No.1_%28Mahler%2C_Gustav%29","source":"IMSLP","note":"Partitura/particella completa; localizar o corte coas marcas indicadas na ficha.","coverage":"Partitura completa"}]},{"name":"II. Kräftig bewegt · pasaxe de danza","location":"Movemento II, aproximadamente 3 compases despois de [26] ata [27] nunha selección frecuente de clarinete 1.º.","context":"O segundo movemento está baseado no Ländler, danza centroeuropea de carácter rústico. O clarinete participa nunha escritura máis directa, terrosa e articulada que no primeiro movemento.","role":"Cor de madeira dentro da danza. A prioridade é encaixar o acento e o peso do fraseo no carácter do Ländler, evitando unha articulación excesivamente refinada.","technique":"Pulso de danza, acentos, igualdade de articulación, flexibilidade de tempo e integración coa sección.","pages":"Non figura en EP8661","recording":"Bavarian Radio Symphony Orchestra · Rafael Kubelík (DG, 1968)","recording_url":"https://classical.music.apple.com/gb/recording/gustav-mahler-1860-pp1-1699680642","recording_locator":"Pista II “Kräftig bewegt” (6:55). Localización por partitura: 3 despois de [26]–[27].","materials":[{"type":"pdf","label":"PDF · Mahler 1 · selección de clarinete 1.º","url":"https://music.sas.upenn.edu/sites/default/files/Mahler%201%20excerpts.pdf","source":"University of Pennsylvania","note":"O documento reúne os catro movementos e imprime os pasaxes da primeira parte de clarinete.","coverage":"Extractos exactos"},{"type":"score","label":"Abrir partitura / particella","url":"https://imslp.org/wiki/Symphony_No.1_%28Mahler%2C_Gustav%29","source":"IMSLP","note":"Partitura/particella completa; localizar o corte coas marcas indicadas na ficha.","coverage":"Partitura completa"}]},{"name":"III. Marcha fúnebre · pasaxe de clarinete 1.º","location":"Movemento III, aproximadamente 2 compases antes de [3] ata [5] nunha selección habitual.","context":"O movemento comeza coa célebre marcha sobre Bruder Martin / Frère Jacques en modo menor. Mahler mestura solemnidade, ironía e episodios de música popular, creando unha procesión deliberadamente ambigua.","role":"O clarinete participa no relevo e na caracterización da marcha. Debe conservar un son simple e contido, máis próximo a unha voz de procesión que a un solo romántico expansivo.","technique":"Afinación en dinámica baixa, fraseo simple, control de ataques, estabilidade do tempo e capacidade de cambiar rapidamente entre solemnidade e ironía.","pages":"Non figura en EP8661","recording":"Bavarian Radio Symphony Orchestra · Rafael Kubelík (DG, 1968)","recording_url":"https://classical.music.apple.com/gb/recording/gustav-mahler-1860-pp1-1699680642","recording_locator":"Pista III “Feierlich und gemessen” (10:36). Referencia de partitura: 2 antes de [3]–[5].","materials":[{"type":"pdf","label":"PDF · Mahler 1 · selección de clarinete 1.º","url":"https://music.sas.upenn.edu/sites/default/files/Mahler%201%20excerpts.pdf","source":"University of Pennsylvania","note":"O documento reúne os catro movementos e imprime os pasaxes da primeira parte de clarinete.","coverage":"Extractos exactos"},{"type":"score","label":"Abrir partitura / particella","url":"https://imslp.org/wiki/Symphony_No.1_%28Mahler%2C_Gustav%29","source":"IMSLP","note":"Partitura/particella completa; localizar o corte coas marcas indicadas na ficha.","coverage":"Partitura completa"}]},{"name":"IV. Stürmisch bewegt · pasaxe dramático","location":"Movemento IV, [6]–[8] nunha selección frecuente de clarinete 1.º.","context":"O finale irrompe de maneira violenta e emprega unha orquestra moi ampliada. Mahler leva ao extremo os contrastes de dinámica, articulación e densidade.","role":"Parte da masa dramática, pero con liñas que teñen que permanecer perfectamente definidas. O clarinete debe atravesar a textura sen endurecer o son.","technique":"Proxección, articulación forte controlada, resistencia, precisión rítmica e recuperación inmediata despois de silencios.","pages":"Non figura en EP8661","recording":"Bavarian Radio Symphony Orchestra · Rafael Kubelík (DG, 1968)","recording_url":"https://classical.music.apple.com/gb/recording/gustav-mahler-1860-pp1-1699680642","recording_locator":"Pista IV “Stürmisch bewegt” (17:39). Referencia exacta: [6]–[8].","materials":[{"type":"pdf","label":"PDF · Mahler 1 · selección de clarinete 1.º","url":"https://music.sas.upenn.edu/sites/default/files/Mahler%201%20excerpts.pdf","source":"University of Pennsylvania","note":"O documento reúne os catro movementos e imprime os pasaxes da primeira parte de clarinete.","coverage":"Extractos exactos"},{"type":"score","label":"Abrir partitura / particella","url":"https://imslp.org/wiki/Symphony_No.1_%28Mahler%2C_Gustav%29","source":"IMSLP","note":"Partitura/particella completa; localizar o corte coas marcas indicadas na ficha.","coverage":"Partitura completa"}]}],"study":["Non estudar Mahler como unha sucesión de notas: anotar en cada pasaxe o carácter específico (“natureza”, Ländler, marcha, tempestade).","Escoitar as distintas afinacións e instrumentos da sección de clarinetes; Mahler cambia constantemente a cor da familia.","Practicar os extractos en frío, xa que os cambios de carácter e dinámica son parte da dificultade real dunha audición.","Comparar o III movemento coa melodía de Bruder Martin para comprender a deformación irónica do material popular.","Seguir unha partitura xeral para identificar cando o clarinete dobra, responde ou contrasta con outras madeiras."],"score_url":"https://imslp.org/wiki/Symphony_No.1_%28Mahler%2C_Gustav%29","score_note":"IMSLP: partitura completa e particellas. A programación cita a obra de maneira xeral, polo que a ficha reúne unha selección de pasaxes habituais de clarinete 1.º.","recording":"Bavarian Radio Symphony Orchestra · Rafael Kubelík (DG, 1968). Unha versión clara, relativamente áxil e moi útil para seguir a partitura.","recording_url":"https://classical.music.apple.com/gb/recording/gustav-mahler-1860-pp1-1699680642","recording_note":"A gravación está dividida en catro pistas; en cada extracto indícase o movemento e a referencia de ensaio.","sources":[["Mahler Foundation: xénese, revisións, estrutura e programa inicial da Sinfonía n.º 1","https://www.mahlerfoundation.org/mahler/compositions/symphony-no-1/symphony-no-1-introduction/"],["Mahler Foundation: orquestración e presenza do clarinete baixo","https://www.mahlerfoundation.org/mahler/compositions/symphony-no-1/symphony-no-1-orchestration/"],["Apple Music Classical: Kubelík / Bavarian Radio Symphony Orchestra","https://classical.music.apple.com/gb/recording/gustav-mahler-1860-pp1-1699680642"],["IMSLP: Symphony No. 1, GMW 11","https://imslp.org/wiki/Symphony_No.1_%28Mahler%2C_Gustav%29"],["University of Pennsylvania: selección de pasaxes de clarinete 1.º nos catro movementos","https://music.sas.upenn.edu/sites/default/files/Mahler%201%20excerpts.pdf"],["NYYS: outros cortes de clarinete e instrumentos afíns en Mahler 1","https://www.nyys.org/wp-content/uploads/2022/10/22-23-Clarinet-excerpts-orchestra-audition-nyyss.pdf"]],"portrait_url":"https://commons.wikimedia.org/wiki/Special:Redirect/file/Gustav%20Mahler%20by%20Dupont%20%281909%29.jpg","period":"Romanticismo tardío · fin de século","genre":"Sinfonía en catro movementos (versión definitiva), GMW 11","year":"1887–1888; revisada ata a década de 1890","work_structure":"I Langsam, schleppend · II Kräftig bewegt · III Feierlich und gemessen · IV Stürmisch bewegt. O movemento Blumine foi eliminado antes da edición definitiva.","influences":"Mahler integra canción, danza popular e música de programa dentro da sinfonía. O I movemento reutiliza material de Lieder eines fahrenden Gesellen; o II parte do Ländler; o III transforma Bruder Martin / Frère Jacques nunha marcha fúnebre; e o finale retoma conflitos e materiais previos. O título “Titan” pertence ás primeiras versións e foi posteriormente abandonado polo compositor.","portrait_credit":"Gustav Mahler, estudio A. Dupont (1909) · Library of Congress / Wikimedia Commons","portrait_source":"https://commons.wikimedia.org/wiki/File:Gustav_Mahler_by_Dupont_(1909).jpg","reviewed":"2026-10-01"},{"id":"2-1-5","course":2,"quarter":1,"instrument":"Clarinete en Si♭ e La","composer":"Mendelssohn","work":"Soño dunha noite de verán","probespiel":"13–14","status":"Ficha revisada · lista","summary":"Música incidental op. 61 para a comedia de Shakespeare. O Scherzo concentra algúns dos pasaxes de clarinete máis habituais nas audicións: extrema lixeireza, regularidade rítmica, articulación limpa e integración co tecido de madeiras e cordas.","composer_bio":"Felix Mendelssohn Bartholdy (1809–1847) foi compositor, pianista, organista e director alemán, figura central do primeiro Romanticismo. A súa escritura combina claridade formal, precisión contrapuntística e unha especial capacidade para crear atmosferas mediante a cor orquestral. En 1829 dirixiu unha célebre recuperación da Paixón segundo San Mateo de J. S. Bach, decisiva para o renacemento moderno da obra bachiana, e desde 1835 estivo estreitamente ligado á Gewandhaus de Leipzig.","work_context":"Mendelssohn escribiu a Obertura de Soño dunha noite de verán en 1826, con 17 anos, inspirado directamente na comedia de William Shakespeare. En 1842–1843, por encargo do rei Federico Guillerme IV de Prusia, ampliou aquel universo sonoro cun conxunto de números para unha representación completa da obra. O Scherzo conserva o mundo fantástico da obertura: figuracións rapidísimas, dinámica lixeira e motivos que pasan continuamente de cordas a madeiras. Non describe un personaxe concreto; recrea o movemento e a volatilidade do bosque encantado.","excerpts":[{"name":"Scherzo · pasaxe 1","location":"Scherzo, cc. 1–48 (comezo ata a letra B). É o corte máis universal nas listas de audición.","context":"Comeza o Scherzo. A actividade motórica aparece desde o primeiro compás e o clarinete intégrase nunha textura moi lixeira de madeiras e cordas.","role":"Clarinete 1.º en Si♭: participa no xogo de relevos e na sensación de movemento continuo. O obxectivo non é soar “solista” por volume, senón manter claridade, elasticidade e cor dentro dunha textura transparente.","technique":"Coordinación lingua-dedos, igualdade das semicorcheas, trinos limpos, articulación curta sen dureza, control do aire a dinámica baixa e estabilidade do tempo.","pages":"EP8661: pp. 13–14","recording":"London Symphony Orchestra · Sir John Eliot Gardiner (Barbican, 2019)","recording_url":"https://www.youtube.com/watch?v=NpGPakaccUA","recording_locator":"Localización inmediata: o vídeo é o Scherzo completo e o extracto comeza no 0:00. Remata no c. 48 / letra B."},{"name":"Scherzo · pasaxes posteriores","location":"No repertorio profesional aparecen varios cortes posteriores. Unha formulación moi usada é cc. 99–153; outras convocatorias dividen o material en anacrusa de C–E, L–M e os compases finais. Convén estudar o contido completo das pp. 13–14 do Probespiel.","context":"O mesmo material de lixeireza e intercambio reaparece en zonas posteriores do Scherzo, con novas entradas, acentos e combinacións instrumentais.","role":"O clarinete debe conservar exactamente o mesmo carácter aínda cando cambia o rexistro, a dinámica ou o interlocutor orquestral. A dificultade principal é manter a mesma calidade tras entradas en frío.","technique":"Preparación de entradas illadas, control de subdivisión, cambios rápidos de dinámica e articulación, e capacidade de recuperar o pulso despois de silencios.","pages":"EP8661: pp. 13–14","recording":"London Symphony Orchestra · Sir John Eliot Gardiner (Barbican, 2019)","recording_url":"https://www.youtube.com/watch?v=NpGPakaccUA","recording_locator":"Para localizalo con precisión usa a partitura: cc. 99–153 (ou as letras C–E / L–M segundo a edición). O vídeo é o movemento completo; o minuto varía segundo o corte exacto da convocatoria."}],"study":["Traballar primeiro cc. 1–48 completos e despois as entradas posteriores como fragmentos independentes de audición.","Comparar a articulación coas frautas e coa corda: a lixeireza debe vir do aire e da coordinación, non de “morder” a lingua.","Practicar entradas en frío cunha conta previa exacta, como se fose unha proba de orquestra.","Escoitar o Scherzo completo seguindo a partitura xeral para identificar quen recibe cada motivo."],"score_url":"https://imslp.org/wiki/A_Midsummer_Night%27s_Dream%2C_Op.61_(Mendelssohn%2C_Felix)","score_note":"IMSLP: partitura xeral e particellas. Para a clase, contrastar sempre as letras/compases coa edición usada polo alumno.","recording":"London Symphony Orchestra · Sir John Eliot Gardiner, Scherzo completo (gravación en directo; DW Classical Music).","recording_url":"https://www.youtube.com/watch?v=NpGPakaccUA","recording_note":"Cada extracto inclúe o seu propio localizador. Nos cortes posteriores é máis fiable a referencia de compás/letra que un minuto universal.","sources":[["RCSMM: Orchester-Probespiel, Mendelssohn · Scherzo, pp. 13–14","https://rcsmm.eu/sites/default/files/upload-files/Listado%20pasajes%20orquestales%20pruebas%20MIS%202025.pdf"],["ERT 2026: Scherzo, cc. 1–48 e 99–153","https://www.ert.gr/wp-content/uploads/2026/03/eso-akroaseis-2026-orxistrika-apospasmata-klarineto.pdf"],["Sphinx 2025: cortes adicionais do Scherzo","https://www.scribd.com/document/804825953/03-CLARINET-Full-List-SOPA-2025"],["Library of Congress: Mendelssohn, Bach e a Gewandhaus","https://guides.loc.gov/mendelssohn"],["DW Classical Music: Gardiner / LSO, Scherzo","https://www.youtube.com/watch?v=NpGPakaccUA"],["IMSLP: A Midsummer Night’s Dream, op. 61","https://imslp.org/wiki/A_Midsummer_Night%27s_Dream%2C_Op.61_(Mendelssohn%2C_Felix)"]],"portrait_url":"https://commons.wikimedia.org/wiki/Special:Redirect/file/Portrait%20of%20Mendelssohn%20%284672631%29.jpg","period":"Romanticismo temperán","genre":"Música incidental para teatro, op. 61","year":"1842–1843 (obertura orixinal: 1826)","work_structure":"Obertura + números incidentais para a representación teatral; o Scherzo é o n.º 1 da música incidental e funciona como transición cara ao Acto II.","influences":"A fonte extramusical é Shakespeare. Musicalmente, Mendelssohn retoma de maneira consciente a linguaxe tímbrica da súa obertura xuvenil: texturas transparentes, pulsación moi viva e intercambio de pequenos motivos. O resultado é romántico pola imaxinación literaria, pero de gran disciplina clásica na forma e na claridade da escritura.","portrait_credit":"Retrato de Felix Mendelssohn · Welsh Portrait Collection / Wikimedia Commons","portrait_source":"https://commons.wikimedia.org/wiki/File:Portrait_of_Mendelssohn_(4672631).jpg","reviewed":"2026-10-01"},{"id":"2-1-6","course":2,"quarter":1,"instrument":"Clarinete baixo","composer":"Mahler","work":"Sinfonía n.º 1","probespiel":"—","status":"Ficha revisada · lista","summary":"A mesma Sinfonía n.º 1, estudada desde o posto de clarinete baixo. Mahler utiliza o clarinete 3.º como dobrador de clarinete baixo e requinto, polo que o intérprete debe cambiar de función e de cor rapidamente. Os pasaxes máis habituais de clarinete baixo concéntranse nos movementos I e III.","composer_bio":"Gustav Mahler (1860–1911) foi compositor e director austro-bohemio, unha das figuras fundamentais da transición entre o Romanticismo tardío e a modernidade musical. Desenvolveu unha carreira extraordinaria como director de ópera e orquestra —entre outros postos, na Ópera da Corte de Viena— e concentrou a súa creación principalmente na canción e na sinfonía. As súas obras combinan formas de gran escala con materiais populares, marchas, danzas, cantos de natureza e contrastes extremos de carácter e orquestración.","work_context":"A Primeira Sinfonía foi composta principalmente entre 1887 e 1888, cando Mahler traballaba en Leipzig, e estreouse en Budapest en 1889 baixo a súa dirección. A obra foi revisada varias veces: inicialmente tivo cinco movementos e unha lectura programática asociada ao título “Titan”, pero Mahler acabou eliminando o movemento Blumine e retirando os textos explicativos. A versión definitiva ten catro movementos. O primeiro incorpora material de Lieder eines fahrenden Gesellen; o segundo parte do Ländler; o terceiro transforma Bruder Martin / Frère Jacques nunha marcha fúnebre irónica; e o finale leva o conflito cara a unha conclusión triunfal.","excerpts":[{"name":"I. Langsam. Schleppend · entrada de clarinete baixo","location":"Movemento I, arredor de 8 compases antes de [1] ata 4 compases antes de [1] (ou un corte algo máis amplo, cc. 9–21, segundo a lista). Clarinete baixo en Si♭.","context":"O inicio da sinfonía constrúe unha paisaxe de “son da natureza” con notas longas, chamadas afastadas e pequenas entradas de madeira. O clarinete baixo aparece como unha das cores graves desta atmosfera.","role":"Cor orquestral antes que solo melódico: debe fundirse co plano grave e manter unha presenza moi estable a dinámica baixa.","technique":"Ataques pp, afinación de notas sostidas, estabilidade do aire, homoxeneidade no rexistro grave e precisión de entradas tras silencios.","pages":"Non figura en EP8661","recording":"Bavarian Radio Symphony Orchestra · Rafael Kubelík (DG, 1968)","recording_url":"https://classical.music.apple.com/gb/recording/gustav-mahler-1860-pp1-1699680642","recording_locator":"Pista I. O pasaxe está no inicio do movemento; a referencia máis precisa é 8 antes de [1]–4 antes de [1].","materials":[{"type":"pdf","label":"PDF · I movemento, clarinete baixo","url":"https://marinsymphony.org/wp-content/uploads/2019/03/Marin-Clarinet-excerpt-list-2019-PDF.pdf","source":"Marin Symphony","note":"Inclúe bar 5 → 4 despois de [1].","coverage":"Extracto exacto"},{"type":"pdf","label":"PDF · Mahler 1 · instrumentos afíns","url":"https://www.nyys.org/wp-content/uploads/2022/10/22-23-Clarinet-excerpts-orchestra-audition-nyyss.pdf","source":"New York Youth Symphony","note":"Inclúe material opcional de clarinete baixo.","coverage":"Extracto en PDF"},{"type":"web","label":"Ver extractos anotados","url":"https://excerpts.one/instruments/bassclarinet/mahlerfirst.html","source":"Excerpts.one","note":"Referencia rápida con notación e marcas de ensaio.","coverage":"Extracto en web"},{"type":"score","label":"Abrir partitura / particella","url":"https://imslp.org/wiki/Symphony_No.1_%28Mahler%2C_Gustav%29","source":"IMSLP","note":"Partitura/particella completa; localizar o corte coas marcas indicadas na ficha.","coverage":"Partitura completa"}]},{"name":"III. Marcha fúnebre · pasaxe arredor de [4]","location":"Movemento III, aproximadamente 2 compases antes de [4] ata 8 compases despois de [4]. Algunhas audicións prolongan o corte ata varios compases antes de [5].","context":"A marcha de Bruder Martin xa está establecida e a textura vai incorporando novas cores. O clarinete baixo reforza o carácter escuro, terroso e lixeiramente grotesco da procesión.","role":"Voz grave exposta dentro da sección de madeiras. Debe ter identidade tímbrica sen separarse da marcha nin converter o pasaxe nun solo excesivamente romántico.","technique":"Control do staccato/portato, afinación grave, precisión de ritmo punteado, sostén do aire e equilibrio con fagotes e contrabaixos.","pages":"Non figura en EP8661","recording":"Bavarian Radio Symphony Orchestra · Rafael Kubelík (DG, 1968)","recording_url":"https://classical.music.apple.com/gb/recording/gustav-mahler-1860-pp1-1699680642","recording_locator":"Pista III “Feierlich und gemessen”. Localización: 2 antes de [4] e zona inmediatamente posterior a [4].","materials":[{"type":"pdf","label":"PDF · Mahler 1 · clarinete baixo","url":"https://www.nyys.org/wp-content/uploads/2022/10/22-23-Clarinet-excerpts-orchestra-audition-nyyss.pdf","source":"New York Youth Symphony","note":"O paquete inclúe material opcional de clarinete baixo do III movemento.","coverage":"Extracto de audición"},{"type":"web","label":"Ver extractos anotados","url":"https://excerpts.one/instruments/bassclarinet/mahlerfirst.html","source":"Excerpts.one","note":"Notación e marcas para os principais cortes de clarinete baixo.","coverage":"Extracto en web"},{"type":"score","label":"Abrir partitura / particella","url":"https://imslp.org/wiki/Symphony_No.1_%28Mahler%2C_Gustav%29","source":"IMSLP","note":"Partitura/particella completa; localizar o corte coas marcas indicadas na ficha.","coverage":"Partitura completa"}]},{"name":"III. Marcha fúnebre · pasaxe arredor de [14]–[15]","location":"Movemento III, aproximadamente 6 compases antes de [14] ata [15]. Clarinete baixo en Si♭.","context":"Nunha sección posterior do movemento reaparecen e mestúranse o carácter de marcha e elementos máis populares. O clarinete baixo participa na transformación tímbrica da textura.","role":"Parte de carácter con momentos expostos: a prioridade é manter o pulso e a cor adecuada dentro dunha escritura deliberadamente irónica.","technique":"Cambios de articulación, control de dinámica, entradas precisas, afinación e flexibilidade de carácter.","pages":"Non figura en EP8661","recording":"Bavarian Radio Symphony Orchestra · Rafael Kubelík (DG, 1968)","recording_url":"https://classical.music.apple.com/gb/recording/gustav-mahler-1860-pp1-1699680642","recording_locator":"Pista III. Referencia máis rápida: 6 compases antes de [14] ata [15].","materials":[{"type":"pdf","label":"PDF · Mahler 1 · clarinete baixo","url":"https://www.nyys.org/wp-content/uploads/2022/10/22-23-Clarinet-excerpts-orchestra-audition-nyyss.pdf","source":"New York Youth Symphony","note":"O paquete inclúe material opcional de clarinete baixo do III movemento.","coverage":"Extracto de audición"},{"type":"web","label":"Ver extractos anotados","url":"https://excerpts.one/instruments/bassclarinet/mahlerfirst.html","source":"Excerpts.one","note":"Notación e marcas para os principais cortes de clarinete baixo.","coverage":"Extracto en web"},{"type":"score","label":"Abrir partitura / particella","url":"https://imslp.org/wiki/Symphony_No.1_%28Mahler%2C_Gustav%29","source":"IMSLP","note":"Partitura/particella completa; localizar o corte coas marcas indicadas na ficha.","coverage":"Partitura completa"}]}],"study":["Traballar o I movemento con afinador/dron a dinámica moi baixa: a dificultade principal é a estabilidade, non a velocidade.","No III, escoitar a marcha completa e identificar fagotes, contrabaixos, requinto e clarinete baixo para entender o carácter de conxunto.","Practicar cambios entre clarinete ordinario, baixo e requinto como parte do posto real de clarinete 3.º/dobrador.","Evitar un son excesivamente pesado no baixo: Mahler precisa definición de articulación incluso nas cores máis escuras.","Preparar varias lonxitudes de corte, porque as audicións non coinciden exactamente nos compases finais."],"score_url":"https://imslp.org/wiki/Symphony_No.1_%28Mahler%2C_Gustav%29","score_note":"IMSLP inclúe a partitura completa e particellas. A instrumentación asigna o clarinete baixo como dobra do terceiro clarinete.","recording":"Bavarian Radio Symphony Orchestra · Rafael Kubelík (DG, 1968).","recording_url":"https://classical.music.apple.com/gb/recording/gustav-mahler-1860-pp1-1699680642","recording_note":"Os pasaxes principais están nos movementos I e III. A ficha usa letras de ensaio para unha localización segura.","sources":[["Mahler Foundation: xénese, revisións, estrutura e programa inicial da Sinfonía n.º 1","https://www.mahlerfoundation.org/mahler/compositions/symphony-no-1/symphony-no-1-introduction/"],["Mahler Foundation: orquestración e presenza do clarinete baixo","https://www.mahlerfoundation.org/mahler/compositions/symphony-no-1/symphony-no-1-orchestration/"],["Apple Music Classical: Kubelík / Bavarian Radio Symphony Orchestra","https://classical.music.apple.com/gb/recording/gustav-mahler-1860-pp1-1699680642"],["IMSLP: Symphony No. 1, GMW 11","https://imslp.org/wiki/Symphony_No.1_%28Mahler%2C_Gustav%29"],["Excerpts.one: tres pasaxes habituais de clarinete baixo en Mahler 1","https://excerpts.one/instruments/bassclarinet/mahlerfirst.html"],["NZSO 2025: dous cortes de Mahler 1 para clarinete baixo","https://www.scribd.com/document/853434428/Nzso-2025-April-Principal-Bass-Clarinet-Excerpts"],["Marin Symphony: I movemento, bar 5–4 despois de [1]","https://marinsymphony.org/wp-content/uploads/2019/03/Marin-Clarinet-excerpt-list-2019-PDF.pdf"],["NYYS: cortes opcionais de clarinete baixo en Mahler 1","https://www.nyys.org/wp-content/uploads/2022/10/22-23-Clarinet-excerpts-orchestra-audition-nyyss.pdf"]],"portrait_url":"https://commons.wikimedia.org/wiki/Special:Redirect/file/Gustav%20Mahler%20by%20Dupont%20%281909%29.jpg","period":"Romanticismo tardío · fin de século","genre":"Sinfonía en catro movementos (versión definitiva), GMW 11","year":"1887–1888; revisada ata a década de 1890","work_structure":"I Langsam, schleppend · II Kräftig bewegt · III Feierlich und gemessen · IV Stürmisch bewegt. O clarinete baixo intervén sobre todo nos movementos I e III.","influences":"A escritura do clarinete baixo forma parte da ampliación da paleta de madeiras de Mahler. Máis ca un instrumento “solista” constante, funciona como unha cor que prolonga o grave da sección, reforza a atmosfera de natureza do I e acentúa a dimensión escura e irónica da marcha fúnebre do III.","portrait_credit":"Gustav Mahler, estudio A. Dupont (1909) · Library of Congress / Wikimedia Commons","portrait_source":"https://commons.wikimedia.org/wiki/File:Gustav_Mahler_by_Dupont_(1909).jpg","reviewed":"2026-10-01"},{"id":"2-1-7","course":2,"quarter":1,"instrument":"Clarinete baixo","composer":"Wagner","work":"Tristán e Isolda","probespiel":"42–43","status":"Ficha revisada · lista","summary":"Drama musical en tres actos, WWV 90 (1857–1859). O extracto de clarinete baixo máis emblemático aparece no Acto II, escena 3, durante a longa lamentación do rei Marke despois de descubrir a relación entre Tristan e Isolde. O EP8661 recolle este bloque nas pp. 42–43; as audicións modernas adoitan dividilo en dous tramos.","composer_bio":"Richard Wagner (1813–1883) foi compositor, director e autor dos seus propios libretos. A súa concepción do drama musical procura integrar texto, escena e orquestra nun discurso continuo, e emprega motivos recorrentes asociados a personaxes, obxectos, emocións e ideas dramáticas. A súa escritura orquestral ampliou enormemente a función narrativa da orquestra e deu ás madeiras graves —entre elas o clarinete baixo— un papel de cor, comentario e caracterización psicolóxica, non só de reforzo harmónico.","work_context":"Wagner interrompeu temporalmente a composición de Der Ring des Nibelungen en 1857 para dedicarse a Tristan und Isolde. A obra parte da lenda medieval de Tristan —especialmente da tradición de Gottfried von Strassburg— e converte o conflito entre desexo, deber, día e noite nun drama de enorme continuidade musical. A filosofía de Arthur Schopenhauer foi unha influencia explícita, e a relación de Wagner con Mathilde Wesendonck forma parte do contexto creativo: dous dos Wesendonck-Lieder foron concibidos polo propio compositor como estudos para Tristan. A estrea tivo lugar en Múnic en 1865.","excerpts":[{"name":"Acto II, escena 3 · Mäßig langsam · lamentación do rei Marke","location":"Clarinete baixo en La. No EP8661: Acto II, escena 3, pp. 42–43. Un corte profesional habitual vai desde o Mäßig langsam ata 10 compases despois da letra [Ii]; outras listas modernas sitúan un tramo equivalente desde 42 compases antes de [Kk] ata 11 antes de [Kk].","context":"Melot interrompe o encontro nocturno de Tristan e Isolde e o rei Marke descobre a traizón. Marke non responde cunha escena de furia convencional: a súa intervención é unha longa reflexión ferida sobre a confianza, a amizade e a deslealdade de Tristan.","role":"O clarinete baixo deixa de ser simple fundamento grave e convértese nunha voz psicolóxica asociada á gravidade e á dor de Marke. A liña debe integrarse coa voz do baixo e coa textura orquestral, ás veces solapándose coa declamación. A prioridade é apoiar o drama e a respiración da frase vocal, non “sobresaír” como nun solo concertante.","technique":"Son cálido e estable no clarinete baixo en La, legato de gran continuidade, afinación nas notas longas, control de crescendi moi progresivos e respiración discreta. É importante estudar a parte de Marke para saber cando a liña instrumental pode avanzar e cando debe ceder espazo á voz.","pages":"EP8661: pp. 42–43","recording":"Bayreuther Festspielorchester · Karl Böhm · Josef Greindl (Marke) · 1966, Deutsche Grammophon","recording_url":"https://music.apple.com/us/album/wagner-tristan-und-isolde-wwv-90-live/1111233985","recording_locator":"Acto II: comeza na pista “Tatest du's wirklich?” e continúa no gran monólogo de Marke. Para o corte exacto, seguir a indicación Mäßig langsam e as letras [Ii]/[Kk] da partitura: é unha referencia máis segura ca un minuto absoluto nunha ópera tan extensa."},{"name":"Acto II, escena 3 · segundo tramo · Wieder mäßig langsam / zona de [Kk]","location":"Segundo pasaxe habitual do mesmo solo. Milwaukee Symphony pide seis compases desde o segundo “Wieder mäßig langsam”; San Francisco Opera emprega [Kk] ata 11 compases despois de [Kk]. Forma parte do mesmo bloque das pp. 42–43 do EP8661.","context":"É a continuación da lamentación de Marke. O discurso perde calquera carácter de “número pechado”: voz e orquestra forman unha única corrente expresiva, polo que o clarinetista debe coñecer o texto e non só a súa particella.","role":"Resposta e prolongación tímbrica da voz de Marke. O clarinete baixo pode quedar momentaneamente moi exposto, pero sempre dentro dunha textura de resignación e dor contida.","technique":"Ataques suaves sen atraso, sostemento do aire en dinámicas baixas, finais de frase sen perder afinación e capacidade de adaptar o rubato á voz. Practicar tamén entradas illadas, porque en audición adoita pedirse este tramo separado.","pages":"EP8661: pp. 42–43","recording":"Bayreuther Festspielorchester · Karl Böhm · Josef Greindl (Marke) · 1966, Deutsche Grammophon","recording_url":"https://music.apple.com/us/album/wagner-tristan-und-isolde-wwv-90-live/1111233985","recording_locator":"Na mesma secuencia do Acto II. Localizar a segunda indicación “Wieder mäßig langsam” ou a letra [Kk]; na edición discográfica aparece dentro das pistas dedicadas ao monólogo de Marke."}],"study":["Ler e traducir brevemente o texto de Marke antes de traballar o extracto: a respiración instrumental depende da sintaxe dramática.","Practicar co baixo volume dunha gravación para comprobar que o clarinete acompaña e comenta a voz en lugar de competir con ela.","Separar primeiro afinación/son das decisións de rubato; despois reconstruír as frases longas.","Preparar os dous cortes habituais por separado e tamén o bloque continuo, porque as audicións non delimitan sempre o mesmo final.","Se se dispón de clarinete baixo en Si♭ moderno, revisar con coidado a transposición da parte histórica en La e a edición utilizada."],"score_url":"https://imslp.org/wiki/Tristan_und_Isolde%2C_WWV90_%28Wagner%2C_Richard%29","score_note":"IMSLP inclúe partitura xeral, reducións e particellas completas; a ficha da obra confirma tamén o clarinete baixo na instrumentación.","recording":"Bayreuther Festspielorchester · Karl Böhm · Birgit Nilsson, Wolfgang Windgassen, Josef Greindl · Festival de Bayreuth 1966 (DG).","recording_url":"https://music.apple.com/us/album/wagner-tristan-und-isolde-wwv-90-live/1111233985","recording_note":"A edición está dividida por escenas e frases do libreto. Para estes solos, a combinación “pista + marca de ensaio” permite localizalos con moita máis rapidez ca nunha pista única de todo o acto.","sources":[["IMSLP: Tristan und Isolde, WWV 90 · partitura e particellas","https://imslp.org/wiki/Tristan_und_Isolde%2C_WWV90_%28Wagner%2C_Richard%29"],["IMSLP: índice de Orchester-Probespiel · clarinete baixo: Acto II, escena 3","https://imslp.org/wiki/Orchester-Probespiel"],["Milwaukee Symphony: dous cortes de Tristan para clarinete baixo","https://www.mso.org/app/uploads/2024/03/Clarinet-BassUtility-Aud-Excerpts-May-2024.pdf"],["San Francisco Opera 2025: cortes [Kk] de Tristan","https://www.sfopera.com/contentassets/9385e50222d94e62b221b0b429693c29/repertoire-list_3rdbass-clarinet-r09.12.25.pdf"],["OFGC: EP8661, Tristan Acto II escena 3, pp. 42–43","https://api.ofgrancanaria.com/storage/6842/g6WwBHfD8aApPbRiVOtG.pdf"],["Dutch National Opera: Schopenhauer, Wesendonck e xénese de Tristan","https://www.operaballet.nl/en/dutch-national-opera/2025-2026/tristan-und-isolde"],["Staatsoper Berlin: fonte medieval e concepción dramática","https://www.staatsoper-berlin.de/en/veranstaltungen/tristan-und-isolde.95/"],["Apple Music: Böhm / Bayreuth 1966","https://music.apple.com/us/album/wagner-tristan-und-isolde-wwv-90-live/1111233985"]],"portrait_url":"https://commons.wikimedia.org/wiki/Special:Redirect/file/Wagner.png","period":"Romanticismo tardío · drama musical wagneriano","genre":"Drama musical / ópera en tres actos, WWV 90","year":"1857–1859 · estrea: Múnic, 1865","work_structure":"Acto I: viaxe e filtro amoroso · Acto II: encontro nocturno, descubrimento e lamentación de Marke · Acto III: Kareol, morte de Tristan e transfiguración de Isolde.","influences":"Lenda medieval de Tristan e Isolde, especialmente Gottfried von Strassburg; filosofía de Schopenhauer; e contexto persoal da relación de Wagner con Mathilde Wesendonck. Dous Wesendonck-Lieder —“Im Treibhaus” e “Träume”— están explicitamente ligados polo compositor ao laboratorio musical de Tristan.","portrait_credit":"Richard Wagner, fotografía de 1871 · Wikimedia Commons (dominio público)","portrait_source":"https://commons.wikimedia.org/wiki/File:Wagner.png","reviewed":"2026-10-01"},{"id":"2-1-8","course":2,"quarter":1,"instrument":"Clarinete baixo","composer":"Wagner","work":"A Valquiria","probespiel":"43–44","status":"Ficha revisada · lista","summary":"Die Walküre, WWV 86B, é a primeira xornada de Der Ring des Nibelungen. Para clarinete baixo, o EP8661 inclúe dous pasaxes consecutivos do Acto II: escena 4 e escena 5. Son fragmentos de gran contido dramático: primeiro a Todesverkündigung de Brünnhilde a Siegmund; despois o combate e desenlace no que Wotan intervén.","composer_bio":"Richard Wagner (1813–1883) foi compositor, director e autor dos seus propios libretos. A súa concepción do drama musical procura integrar texto, escena e orquestra nun discurso continuo, e emprega motivos recorrentes asociados a personaxes, obxectos, emocións e ideas dramáticas. A súa escritura orquestral ampliou enormemente a función narrativa da orquestra e deu ás madeiras graves —entre elas o clarinete baixo— un papel de cor, comentario e caracterización psicolóxica, non só de reforzo harmónico.","work_context":"Wagner escribiu o texto do Ring a comezos da década de 1850 e compuxo Die Walküre entre 1854 e 1856. É a primeira xornada da tetraloxía, despois do prólogo Das Rheingold. O libreto reelabora materiais da Edda, do Nibelungenlied e doutras tradicións xermánicas e nórdicas. A obra estreouse en Múnic o 26 de xuño de 1870 por orde de Ludwig II, antes de que Wagner puidese presentar o Ring completo en Bayreuth en 1876. No Acto II conflúen o mandato de Wotan, a decisión de Fricka, o amor de Siegmund e Sieglinde e o cambio interior de Brünnhilde.","excerpts":[{"name":"Acto II, escena 4 · Todesverkündigung (“Siegmund! Sieh auf mich!”)","location":"EP8661: bloque Die Walküre, pp. 43–44. Un corte profesional actual moi empregado vai desde [78] ata 5 compases antes de [79] (San Francisco Opera). A escena 4 completa é a aparición de Brünnhilde ante Siegmund para anunciar a súa morte.","context":"Siegmund permanece xunto a Sieglinde, esgotada. Brünnhilde aparece e comunícalle que vai morrer e que deberá seguila a Valhalla. Cando comprende que Sieglinde non poderá acompañalo, Siegmund rexeita a promesa de gloria e prefire permanecer con ela. Este diálogo fai que Brünnhilde cuestione por primeira vez a orde de Wotan.","role":"O clarinete baixo participa na cor escura e solemne da Todesverkündigung. Non é un “solo de lucimento”, senón unha voz narrativa que reforza fatalidade, distancia e compaixón. Debe fundirse co corno inglés, metais graves e cordas baixas sen perder definición.","technique":"Legato moi sostido, control de pp e diminuendi, afinación no rexistro grave/medio, ataques redondos e respiración longa. A precisión das dinámicas é máis importante ca producir un volume grande: a escena necesita gravidade e tensión contida.","pages":"EP8661: pp. 43–44 · Acto II, escena 4","recording":"Symphonieorchester des Bayerischen Rundfunks · Bernard Haitink · Eva Marton / Reiner Goldberg / Cheryl Studer (EMI)","recording_url":"https://classical.music.apple.com/us/recording/richard-wagner-1813-pp37-1615782774?l=es","recording_locator":"Abrir a pista “Siegmund! Sieh auf mich!” (7:39). O corte de audición queda dentro desta escena; para identificalo con exactitude seguir [78]–5 antes de [79] na partitura."},{"name":"Acto II, escena 5 · combate e desenlace","location":"Segundo pasaxe de Die Walküre incluído no índice do EP8661 para clarinete baixo: Acto II, escena 5, dentro do mesmo bloque das pp. 43–44. As delimitacións de audición varían, polo que nesta biblioteca a referencia principal é a propia escena e a páxina do Probespiel.","context":"Siegmund adormece a Sieglinde, chega Hunding e comeza o combate. Brünnhilde decide protexer a Siegmund contra a orde recibida, pero Wotan intervén, rompe a espada Nothung e Siegmund morre. Brünnhilde foxe con Sieglinde, iniciando o conflito que dominará o Acto III.","role":"A función do clarinete baixo cambia coa acción: da solemnidade case inmóbil da escena 4 pasa a unha escritura integrada nunha textura máis dramática e móbil. A prioridade é reaccionar aos cambios de tensión e manter claridade dentro dunha orquestra moi densa.","technique":"Entradas seguras tras silencios, cambios rápidos de dinámica, afinación baixo presión sonora e control do rexistro grave. Practicar o pasaxe dentro da continuidade da escena, non só como fragmento illado.","pages":"EP8661: pp. 43–44 · Acto II, escena 5","recording":"Symphonieorchester des Bayerischen Rundfunks · Bernard Haitink (EMI)","recording_url":"https://classical.music.apple.com/us/recording/richard-wagner-1813-pp37-1615782774?l=es","recording_locator":"Pista “Zauberfest bezähmt ein Schlaf” (2:12) e pistas inmediatamente seguintes do final do Acto II. Para o fragmento exacto, usar a páxina 44 do EP8661 e a escena 5 da partitura."}],"study":["Escoitar seguidas as escenas 4 e 5 para entender o cambio desde a profecía da morte ata o combate.","Estudar coa partitura vocal: saber quen canta e que sucede permite decidir mellor dirección, dinámica e respiración.","No pasaxe da escena 4, priorizar son estable e legato a baixa dinámica; evitar unha cor excesivamente “solista”.","Na escena 5, practicar entradas en frío e cambios de dinámica porque o clarinete baixo queda inserido nun tecido orquestral máis complexo.","Como ampliación profesional: coñecer tamén outros cortes de clarinete baixo moi pedidos hoxe en Die Walküre —Acto II escena 2 ([27]) e Acto III escena 3 ([95]–[96])— aínda que non sexan o núcleo desta ficha baseada no EP8661."],"score_url":"https://imslp.org/wiki/Die_Walk%C3%BCre%2C_WWV86B_%28Wagner%2C_Richard%29","score_note":"IMSLP ofrece partitura xeral e materiais. O índice de Orchester-Probespiel confirma para clarinete baixo os pasaxes do Acto II, escenas 4 e 5.","recording":"Symphonieorchester des Bayerischen Rundfunks · Bernard Haitink · James Morris, Eva Marton, Cheryl Studer, Reiner Goldberg (EMI).","recording_url":"https://classical.music.apple.com/us/recording/richard-wagner-1813-pp37-1615782774?l=es","recording_note":"A gravación está moi ben segmentada por escenas e frases do libreto, o que permite ir directamente á escena 4 (“Siegmund! Sieh auf mich!”) ou á escena 5 (“Zauberfest bezähmt ein Schlaf”).","sources":[["IMSLP: Die Walküre, WWV 86B · partitura e instrumentación","https://imslp.org/wiki/Die_Walk%C3%BCre%2C_WWV86B_%28Wagner%2C_Richard%29"],["IMSLP: índice de Orchester-Probespiel · clarinete baixo: Acto II, escenas 4 e 5","https://imslp.org/wiki/Orchester-Probespiel"],["San Francisco Opera 2025: corte Acto II escena 4 [78]–5 antes de [79] e outros cortes modernos","https://www.sfopera.com/contentassets/9385e50222d94e62b221b0b429693c29/repertoire-list_3rdbass-clarinet-r09.12.25.pdf"],["Bayerische Staatsoper: cronoloxía de composición e estrea"
