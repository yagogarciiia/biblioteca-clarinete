 [13]–[16] e [22]–[25]","https://chattanoogasymphony.org/wp-content/uploads/2025/08/2025-A-contract-Principal-Clarinet-Audition-Website-info.pdf"],["Cincinnati Symphony 2017 · inclúe tamén [31]–[36]","https://allisyar.com/wp-content/uploads/2012/06/principal-clarinet-rep-list-2817.pdf"],["Berliner Philharmoniker · nota de programa sobre The Miraculous Mandarin","https://www.berliner-philharmoniker.de/en/programme-notes/bela-bartok-the-miraculous-mandarin-suite-sz-73/"],["IMSLP · The Miraculous Mandarin","https://imslp.org/wiki/The_Miraculous_Mandarin_%28Bart%C3%B3k%2C_B%C3%A9la%29"],["Anthony Taylor · comentario interpretativo do segundo chamamento","https://anthotaylo.blogspot.com/2011/07/bartok-miraculous-mandarin.html"],["Naxos · Alsop / Bournemouth, ballet completo dividido por escenas","https://www.naxos.com/CatalogueDetail/?id=8.557433"]],"portrait_url":"https://commons.wikimedia.org/wiki/Special:FilePath/B%C3%A9la%20Bart%C3%B3k%20%281881-1945%29.jpg?width=500","period":"Século XX · modernismo húngaro / expresionismo","genre":"Pantomima-ballet nun acto, op. 19, Sz. 73 · suite de concerto","year":"1918–1924 · estrea escénica 1926 · suite 1927/1928","work_structure":"Un acto continuo articulado pola acción: ambiente urbano inicial · tres xogos de sedución · entrada do Mandarín · danza da rapaza · persecución e violencia final. A suite de concerto conserva a parte inicial e a gran persecución.","influences":"A obra combina a experiencia etnomusicolóxica de Bartók coa violencia rítmica, a densidade cromática e unha concepción moi teatral da orquestra. Aquí o clarinete non é un “solo lírico” illado: nos xogos de sedución representa directamente a acción da rapaza, polo que rubato, aceleracións, cambios de tempo, articulación e cor teñen unha función dramática.","portrait_credit":"Béla Bartók · retrato histórico / Wikimedia Commons","portrait_source":"https://commons.wikimedia.org/wiki/File:B%C3%A9la_Bart%C3%B3k_%281881-1945%29.jpg","reviewed":"2026-10-01"},{"id":"3-2-29","course":3,"quarter":2,"instrument":"Clarinete en Si♭ e La","composer":"Ravel","work":"Daphnis et Chloé","probespiel":"—","status":"Ficha revisada · lista","summary":"A Suite n.º 2 concentra algúns dos pasaxes máis esixentes do repertorio para clarinete 1.º en La. Non hai un único “solo”: as listas profesionais recortan varios bloques entre [155] e o final, con especial frecuencia arredor de [155]–[157], [201]–[204] e desde [212] ata o final.","composer_bio":"Maurice Ravel (1875–1937) foi un dos grandes compositores franceses do cambio de século. Pianista de formación, destacou pola precisión formal, a refinada harmonía e unha orquestración extraordinariamente transparente. A súa música mantén vínculos co simbolismo e co impresionismo francés, aínda que Ravel conservou sempre unha forte disciplina clásica e un gusto por danzas, mecanismos e formas moi definidas.","work_context":"Ravel traballou en Daphnis et Chloé entre 1909 e 1912 por encargo de Sergei Diaghilev para os Ballets Russes. Michel Fokine elaborou o escenario a partir da novela pastoril atribuída a Longo, e Léon Bakst deseñou a produción. A estrea tivo lugar no Théâtre du Châtelet de París o 8 de xuño de 1912, dirixida por Pierre Monteux, con Vaslav Nijinsky e Tamara Karsavina. Ravel denominou a obra “symphonie chorégraphique”: máis ca unha sucesión convencional de números de ballet, é un gran arco sinfónico no que a orquestración crea luz, espazo e movemento. A Suite n.º 2 procede do terceiro cadro e reúne Lever du jour, Pantomime e Danse générale.","excerpts":[{"name":"Suite n.º 2 · [155]–[157/158] · extracto profesional habitual","location":"Clarinete 1.º en La · desde [155] / 1 compás despois de [155] ata 2–3 compases despois de [157]. Algunhas convocatorias amplían ata [158].","context":"Comezo de Lever du jour. A orquestra constrúe progresivamente a sensación de amencer mediante capas de movemento, trinos, arpexos e liñas que se superpoñen.","role":"Parte moi exposta dentro dunha textura de enorme transparencia. O clarinete debe soar integrado, fluído e luminoso, non como un exercicio mecánico de dedos.","technique":"Igualdade das figuracións, dedos relaxados, apoio de aire continuo, afinación en rexistros cambiantes e capacidade para graduar o crescendo sen endurecer o son.","pages":"Non figura como clarinete Sib/La no EP8661; as pp. 34–35 da programación corresponden ao requinto.","recording":"Claudio Abbado · Boston Symphony Orchestra (selección Orchestra Excerpts)","recording_url":"https://orchestraexcerpts.com/clarinet-ravel-daphnis-et-chloe-suite-no-2/","recording_locator":"Na páxina, “Excerpt 1”; o audio está recortado sobre o propio pasaxe. Para edicións máis amplas, seguir [155]–[158].","materials":[{"type":"pdf","label":"PDF · [156]–[157]","url":"https://assets.muvac.com/vacancies/jyzdrvmy/docs/663410/1750916408092-principal_clarinet_2025_-_audition_repertoire_booklet_%28updated_26_jun_2025%29.pdf?download=#page=6","source":"Principal Clarinet Audition 2025 · Muvac","note":"Partitura do corte arredor de [155]–[158].","coverage":"Extracto exacto / equivalente"},{"type":"web","label":"Notación por extractos","url":"https://excerpts.one/instruments/clarinet/raveldaphnis.html","source":"Excerpts.one","note":"","coverage":"Extracto en web"},{"type":"score","label":"Abrir partitura / particella","url":"https://imslp.org/wiki/Daphnis_et_Chlo%C3%A9%2C_M.57_%28Ravel%2C_Maurice%29","source":"IMSLP","note":"Partitura/particella completa; localizar o corte coas marcas indicadas na ficha.","coverage":"Partitura completa"},{"type":"book","label":"Hadcock · The Working Clarinetist","url":"https://www.clarinetallmusic.com/products/hadcock-the-working-clarinetist-orchestral-excerpts-roncorp-publications","source":"Roncorp Publications","note":"Inclúe Ravel Daphnis et Chloé Suite No. 2.","coverage":"Referencia impresa"}]},{"name":"Suite n.º 2 · [166]–5 despois de [167] · corte profesional complementario","location":"Clarinete 1.º en La · [166] → 5 compases despois de [167]. Documentado en repertorio moderno de principal.","context":"Continúa a construción tímbrica de Lever du jour. A escritura alterna detalle camerístico e impulso orquestral, obrigando a cambiar rapidamente a función dentro da textura.","role":"Voz de cor e enlace dentro das madeiras. A prioridade é a precisión de conxunto e o control do timbre.","technique":"Entradas limpas, afinación, cambios de rexistro e flexibilidade de dinámica; estudar sempre con referencia das voces que rodean o clarinete.","pages":"Fóra da sección correspondente do EP8661.","recording":"London Symphony Orchestra · Sir Simon Rattle · Suite n.º 2","recording_url":"https://www.youtube.com/watch?v=IlENd0p6aR4","recording_locator":"Suite n.º 2 · localizar [166] e seguir ata 5 despois de [167]. Non se forza un minuto porque depende do vídeo/edición.","materials":[{"type":"pdf","label":"PDF · [166]–5 despois de [167]","url":"https://assets.muvac.com/vacancies/jyzdrvmy/docs/663410/1750916408092-principal_clarinet_2025_-_audition_repertoire_booklet_%28updated_26_jun_2025%29.pdf?download=#page=7","source":"Principal Clarinet Audition 2025 · Muvac","note":"O booklet imprime este corte completo.","coverage":"Extracto exacto"},{"type":"web","label":"Notación por extractos","url":"https://excerpts.one/instruments/clarinet/raveldaphnis.html","source":"Excerpts.one","note":"","coverage":"Extracto en web"},{"type":"score","label":"Abrir partitura / particella","url":"https://imslp.org/wiki/Daphnis_et_Chlo%C3%A9%2C_M.57_%28Ravel%2C_Maurice%29","source":"IMSLP","note":"Partitura/particella completa; localizar o corte coas marcas indicadas na ficha.","coverage":"Partitura completa"},{"type":"book","label":"Hadcock · The Working Clarinetist","url":"https://www.clarinetallmusic.com/products/hadcock-the-working-clarinetist-orchestral-excerpts-roncorp-publications","source":"Roncorp Publications","note":"Inclúe Ravel Daphnis et Chloé Suite No. 2.","coverage":"Referencia impresa"}]},{"name":"Suite n.º 2 · [194]–[198] · extracto profesional","location":"Clarinete 1.º en La · [194] → 2 compases despois de [198] (algúns materiais varían lixeiramente o final).","context":"Zona central da Pantomime, cunha escrita moi flexible e colorista na que as madeiras participan continuamente no relevo do discurso.","role":"Clarinete como voz móbil dentro dunha textura camerística: debe reaccionar ao fraseo alleo e non tocar de maneira autosuficiente.","technique":"Control do pulso dentro da flexibilidade, legato entre rexistros, articulación lixeira e capacidade para facer visibles os relevos de frase sen sobredimensionar a dinámica.","pages":"Fóra da sección correspondente do EP8661.","recording":"London Symphony Orchestra · Sir Simon Rattle · Suite n.º 2","recording_url":"https://www.youtube.com/watch?v=IlENd0p6aR4","recording_locator":"Pantomime · [194] → [198]. Usar a marca de ensaio como referencia principal.","materials":[{"type":"pdf","label":"PDF educativo · [194]–[198]","url":"https://www.ucg.ac.me/skladiste/blog_23884/objava_65770/fajlovi/335894943_Orchestral_Excerpts_for_Clarinet_v2_1_US.pdf#page=18","source":"University of Montenegro · colección WoodwindExcerpts","note":"A colección hospedada pola universidade imprime o corte [194]–[198].","coverage":"Extracto exacto"},{"type":"web","label":"Notación · [194]–[198]","url":"https://excerpts.one/instruments/clarinet/raveldaphnis.html","source":"Excerpts.one","note":"Material específico do corte [194]–[198].","coverage":"Extracto exacto en web"},{"type":"score","label":"Abrir partitura / particella","url":"https://imslp.org/wiki/Daphnis_et_Chlo%C3%A9%2C_M.57_%28Ravel%2C_Maurice%29","source":"IMSLP","note":"Partitura/particella completa; localizar o corte coas marcas indicadas na ficha.","coverage":"Partitura completa"},{"type":"book","label":"Hadcock · The Working Clarinetist","url":"https://www.clarinetallmusic.com/products/hadcock-the-working-clarinetist-orchestral-excerpts-roncorp-publications","source":"Roncorp Publications","note":"Inclúe Ravel Daphnis et Chloé Suite No. 2.","coverage":"Referencia impresa"}]},{"name":"Suite n.º 2 · [201]–[204/210] · extracto profesional habitual","location":"Clarinete 1.º en La · [201] → 2–3 compases antes de [204] en varias audicións actuais; as coleccións de extractos poden prolongalo ata 2 antes de [210].","context":"A música avanza cara á Danse générale e aumenta progresivamente a actividade rítmica. O corte pode ser curto en audición, pero pertence a unha transición moito máis longa.","role":"Claridade de liña e coordinación vertical nunha orquestración cada vez máis densa.","technique":"Pulso, exactitude rítmica, articulación coordinada coas madeiras, cambios de rexistro e control da tendencia a acelerar antes de tempo.","pages":"Fóra da sección correspondente do EP8661.","recording":"London Symphony Orchestra · Sir Simon Rattle · Suite n.º 2","recording_url":"https://www.youtube.com/watch?v=IlENd0p6aR4","recording_locator":"Localizar [201]. Preparar polo menos ata [204] e coñecer a extensión longa cara a [210].","materials":[{"type":"pdf","label":"PDF · [201]–[204]","url":"https://www.kbssymphony.org/board/upload/KBSSPN_20250617170617.pdf","source":"KBS Symphony Orchestra","note":"Paquete/lista oficial de audición que inclúe este bloque; usar Excerpts.one para a notación individual se o PDF non a mostra no visor.","coverage":"Material oficial"},{"type":"web","label":"Notación · [201]–[210]","url":"https://excerpts.one/instruments/clarinet/raveldaphnis.html","source":"Excerpts.one","note":"Mostra o pasaxe e as marcas de ensaio.","coverage":"Extracto en web"},{"type":"score","label":"Abrir partitura / particella","url":"https://imslp.org/wiki/Daphnis_et_Chlo%C3%A9%2C_M.57_%28Ravel%2C_Maurice%29","source":"IMSLP","note":"Partitura/particella completa; localizar o corte coas marcas indicadas na ficha.","coverage":"Partitura completa"},{"type":"book","label":"Hadcock · The Working Clarinetist","url":"https://www.clarinetallmusic.com/products/hadcock-the-working-clarinetist-orchestral-excerpts-roncorp-publications","source":"Roncorp Publications","note":"Inclúe Ravel Daphnis et Chloé Suite No. 2.","coverage":"Referencia impresa"}]},{"name":"Suite n.º 2 · 2–3 despois de [212] → final · extracto profesional habitual","location":"Clarinete 1.º en La · desde 2–3 compases despois de [212] ata o final. Algunhas listas seleccionan só unha parte do bloque, por exemplo [214]–[218].","context":"Danse générale: final de máxima enerxía, métrica cambiante e textura orquestral moi densa.","role":"Engrenaxe virtuosística da sección de madeiras. O clarinete debe proxectar a articulación e conservar elasticidade sen intentar competir en volume coa masa orquestral.","technique":"Resistencia, dedos moi eficientes, articulación rápida e uniforme, estabilidade do tempo, lectura vertical e capacidade para manter apoio de aire ata o final.","pages":"Fóra da sección correspondente do EP8661.","recording":"Pierre Boulez · Berliner Philharmoniker (selección Orchestra Excerpts)","recording_url":"https://orchestraexcerpts.com/clarinet-ravel-daphnis-et-chloe-suite-no-2/","recording_locator":"Na páxina, “Excerpt 2”; audio recortado desde 3 despois de [212] ata o final.","materials":[{"type":"pdf","label":"PDF · [211/212]–final","url":"https://www.kbssymphony.org/board/upload/KBSSPN_20250617170617.pdf","source":"KBS Symphony Orchestra","note":"Material oficial de audición para o tramo final.","coverage":"Extracto en PDF"},{"type":"web","label":"Notación · desde [212]","url":"https://excerpts.one/instruments/clarinet/raveldaphnis.html","source":"Excerpts.one","note":"Mostra o pasaxe final do clarinete 1.º.","coverage":"Extracto en web"},{"type":"score","label":"Abrir partitura / particella","url":"https://imslp.org/wiki/Daphnis_et_Chlo%C3%A9%2C_M.57_%28Ravel%2C_Maurice%29","source":"IMSLP","note":"Partitura/particella completa; localizar o corte coas marcas indicadas na ficha.","coverage":"Partitura completa"},{"type":"book","label":"Hadcock · The Working Clarinetist","url":"https://www.clarinetallmusic.com/products/hadcock-the-working-clarinetist-orchestral-excerpts-roncorp-publications","source":"Roncorp Publications","note":"Inclúe Ravel Daphnis et Chloé Suite No. 2.","coverage":"Referencia impresa"}]}],"study":["Priorizar os tres núcleos máis recorrentes: [155]–[157/158], [201]–[204] e desde [212] ata o final; despois ampliar con [166]–[167] e [194]–[198].","No inicio, practicar as figuracións lentamente mantendo unha columna de aire continua: a igualdade de dedos debe ser consecuencia da coordinación, non de apertar a man.","No final desde [212], traballar primeiro pequenos grupos rítmicos e logo encadear; comprobar que o tempo non se precipita cando aumenta a densidade.","Estudar coa partitura xeral para identificar con que instrumentos coincide cada figura. Daphnis é un exame de integración orquestral tanto como de virtuosismo.","Comparar os cortes breves de audición co tramo completo da Suite n.º 2 para que entradas e finais non soen artificiais."],"score_url":"https://imslp.org/wiki/Daphnis_et_Chlo%C3%A9%2C_M.57_%28Ravel%2C_Maurice%29","score_note":"IMSLP: partitura completa e materiais de Daphnis et Chloé. Importante: as pp. 34–35 do EP8661 citadas na programación de 3.º pertencen ao requinto, non a estes extractos de clarinete 1.º en La.","recording":"London Symphony Orchestra · Sir Simon Rattle · Daphnis et Chloé, Suite n.º 2; complementada cos audios recortados de Orchestra Excerpts.","recording_url":"https://www.youtube.com/watch?v=IlENd0p6aR4","recording_note":"Para [155] e desde [212] a biblioteca inclúe tamén audios recortados. Nos demais bloques mantéñense as marcas de ensaio, máis fiables que un minuto dependente de cada gravación.","sources":[["Excerpts.one · catro grandes extractos de clarinete 1.º en La","https://excerpts.one/instruments/clarinet/raveldaphnis.html"],["Orchestra Excerpts · [155]–[157] e desde [212] ata o final, con audios","https://orchestraexcerpts.com/clarinet-ravel-daphnis-et-chloe-suite-no-2/"],["KBS Symphony 2025 · [155]–[157], [201]–[204] e [211]–final","https://www.kbssymphony.org/board/upload/KBSSPN_20250617170617.pdf"],["Principal Clarinet 2025 · [156]–[157] e [166]–[167]","https://assets.muvac.com/vacancies/jyzdrvmy/docs/663410/1750916408092-principal_clarinet_2025_-_audition_repertoire_booklet_%28updated_26_jun_2025%29.pdf?download="],["London Symphony Orchestra / Simon Rattle · Suite n.º 2","https://www.youtube.com/watch?v=IlENd0p6aR4"],["IMSLP · Daphnis et Chloé","https://imslp.org/wiki/Daphnis_et_Chlo%C3%A9%2C_M.57_%28Ravel%2C_Maurice%29"]],"portrait_url":"https://commons.wikimedia.org/wiki/Special:FilePath/Maurice_Ravel_1925.jpg?width=500","period":"Século XX · modernismo francés / impresionismo e clasicismo de Ravel","genre":"Ballet / “symphonie chorégraphique” nun acto e tres cadros, M.57","year":"1909–1912 · estrea 1912","work_structure":"Un acto dividido en tres cadros. A Suite n.º 2, a máis utilizada en repertorio orquestral, corresponde esencialmente ao terceiro cadro: Lever du jour · Pantomime · Danse générale.","influences":"O punto de partida é a novela pastoril grega de Longo, filtrada polo escenario de Fokine e pola estética dos Ballets Russes. Ravel non busca unha reconstrución arqueolóxica de Grecia: crea unha antigüidade idealizada mediante harmonía modal, cor orquestral, gran continuidade sinfónica e unha escritura extraordinariamente detallada das madeiras.","portrait_credit":"Maurice Ravel, 1925 · Bibliothèque nationale de France / Wikimedia Commons","portrait_source":"https://commons.wikimedia.org/wiki/File:Maurice_Ravel_1925.jpg","reviewed":"2026-10-01"},{"id":"3-2-30","course":3,"quarter":2,"instrument":"Clarinete en Si♭ e La","probespiel":"28","composer":"Chaikovski","work":"Sinfonía n.º 6 «Patética»","status":"Ficha revisada · lista","summary":"Última sinfonía de Chaikovski, op. 74 (1893), concibida cun “programa secreto” profundamente subxectivo. O Probespiel recolle tres pasaxes do I movemento, todos para clarinete 1.º en La: cc. 54–80, 106–129 e 153–160.","period":"Romanticismo tardío ruso","genre":"Sinfonía en catro movementos","year":"1893","work_structure":"I. Adagio – Allegro non troppo · II. Allegro con grazia · III. Allegro molto vivace · IV. Finale: Adagio lamentoso.","composer_bio":"Piotr Ilich Chaikovski (1840–1893) combinou formación académica occidental coa intensidade melódica e dramática da tradición rusa. Foi compositor de sinfonías, óperas, concertos e tres ballets fundamentais. A súa escritura destaca pola capacidade de converter a melodía e o ritmo de danza en arquitectura sinfónica e por un uso moi persoal da orquestra como vehículo emocional.","work_context":"A Sexta foi composta en 1893 e dedicada ao seu sobriño Vladimir “Bob” Davydov. Chaikovski escribiu que a obra tiña un programa, pero que debía permanecer como enigma para o público; tamén describiu o proceso como especialmente subxectivo e emotivo. A forma é deliberadamente pouco convencional: despois dun scherzo-marcha aparentemente triunfal, a sinfonía remata cun Adagio lamentoso que se extingue en lugar de ofrecer un final brillante.","influences":"O propio compositor falou dunha “sinfonía a programa” cuxo argumento non quería revelar. Bosquexos anteriores dunha sinfonía chamada “Vida” e as súas cartas mostran o interese por unha traxectoria existencial, pero non existe unha clave narrativa única autorizada. Para interpretar os extractos convén evitar lecturas biográficas demasiado literais e centrarse na tensión formal do primeiro movemento: transición, tema lírico e disolución da exposición.","excerpts":[{"name":"I. Allegro non troppo · pasaxe 1","location":"Clarinete 1.º en La · cc. 54–80.","context":"Dentro da zona de transición do primeiro movemento, o clarinete participa nun discurso cada vez máis inquieto e flexible, que conecta o primeiro complexo temático co material máis lírico.","role":"Voz de enlace e tensión: combina lirismo con movemento interno e debe integrarse con outras madeiras sen perder identidade.","technique":"Cambios de dinámica, fraseo longo, flexibilidade de tempo controlada e igualdade entre rexistros.","pages":"EP8661 · p. 28","recording":"Herbert von Karajan · Berliner Philharmoniker","recording_url":"https://orchestraexcerpts.com/clarinet-tchaikovsky-symphony-no-6-mvt-3-excerpts/","recording_locator":"Na páxina Orchestra Excerpts, “Excerpt 1” (cc. 54–80). O audio recortado empeza no propio pasaxe."},{"name":"I. Allegro non troppo · pasaxe 2","location":"Clarinete 1.º en La · cc. 106–129.","context":"Pertence á ampla segunda zona temática, máis cantabile e vulnerable. A escritura pide unha transformación inmediata do son respecto do material máis tenso anterior.","role":"Cantabile solista dentro dunha textura delicada: a prioridade é soste-lo arco melódico e a afinación, non exhibir volume.","technique":"Legato, control de p/pp, respiración planificada, afinación interválica e flexibilidade expresiva sen romper o pulso.","pages":"EP8661 · p. 28","recording":"Herbert von Karajan · Berliner Philharmoniker","recording_url":"https://orchestraexcerpts.com/clarinet-tchaikovsky-symphony-no-6-mvt-3-excerpts/","recording_locator":"Na mesma páxina, “Excerpt 2” (cc. 106–129)."},{"name":"I. Allegro non troppo · pasaxe 3","location":"Clarinete 1.º en La · cc. 153–160.","context":"Está no final da exposición, cando a música se vai apagando antes da explosión do desenvolvemento. A sensación é de suspensión e máxima contención.","role":"Cor exposta en dinámica extrema. A liña debe conservar sostén e intención incluso cando o volume é mínimo.","technique":"Ataque e emisión en pp/ppp, control de aire, afinación e estabilidade rítmica. O silencio posterior forma parte do efecto expresivo.","pages":"EP8661 · p. 28","recording":"Herbert von Karajan · Berliner Philharmoniker","recording_url":"https://orchestraexcerpts.com/clarinet-tchaikovsky-symphony-no-6-mvt-3-excerpts/","recording_locator":"Na páxina, “Excerpt 3” (cc. 153–160). É tamén un corte habitual en audicións como EUYO/UBC."}],"study":["Preparar os tres extractos como un pequeno percorrido dramático: transición, canto e disolución.","Practicar o terceiro pasaxe desde silencio real, sen “preparar” o son cun ataque audible; gravarse para comprobar estabilidade a dinámica mínima.","Escoitar o primeiro movemento completo e localizar os cc. 54, 106 e 153 para comprender a súa posición dentro da forma sonata.","Comparar dúas gravacións da páxina de extractos: Karajan e Markevitch ofrecen enfoques moi distintos de tempo e intensidade."],"score_url":"https://imslp.org/wiki/Symphony_No.6_%28Tchaikovsky%2C_Pyotr_Ilyich%29","score_note":"IMSLP ofrece partitura e particellas. Os tres cortes documentados son cc. 54–80, 106–129 e 153–160 do I movemento.","recording":"Herbert von Karajan · Berliner Philharmoniker, seleccionada entre as gravacións da páxina Orchestra Excerpts.","recording_url":"https://orchestraexcerpts.com/clarinet-tchaikovsky-symphony-no-6-mvt-3-excerpts/","recording_note":"Os tres fragmentos aparecen separados e con audio recortado, o que facilita a localización exacta.","sources":[["Orchestra Excerpts · Tchaikovsky 6, tres extractos","https://orchestraexcerpts.com/clarinet-tchaikovsky-symphony-no-6-mvt-3-excerpts/"],["Excerpts.one · Tchaikovsky 6","https://excerpts.one/instruments/clarinet/tchaikovskysixth.html"],["Tchaikovsky Research · carta sobre o “programa secreto”","https://en.tchaikovsky-research.net/pages/Letter_4865"],["Philharmonie de Paris · Symphonie n.º 6","https://pad.philharmoniedeparis.fr/0789175-symphonie-n-6-pathetique-de-piotr-ilitch-tchaikovski.aspx?_lg=fr-FR"],["BU Tanglewood · repertorio de clarinete 2026","https://www.bu.edu/cfa/tanglewood/admissions/"]],"portrait_url":"https://commons.wikimedia.org/wiki/Special:FilePath/Porträt_des_Komponisten_Pjotr_I._Tschaikowski_(1840-1893)_cropped.jpg?width=500","portrait_credit":"Piotr Ilich Chaikovski, retrato de N. Kuznetsov (1893) · Wikimedia Commons","portrait_source":"https://commons.wikimedia.org/wiki/File:Portr%C3%A4t_des_Komponisten_Pjotr_I._Tschaikowski_(1840-1893)_cropped.jpg","reviewed":"2026-10-01"},{"id":"3-2-31","course":3,"quarter":2,"instrument":"Clarinete en Si♭ e La","composer":"Rajmáninov","work":"Concerto para piano n.º 2","probespiel":"—","status":"Ficha revisada · lista","summary":"Concerto para piano n.º 2 en do menor, op. 18 (1900–1901). O extracto de clarinete 1.º máis claramente documentado está no II movemento: 4 compases despois de [17] → 2 despois de [18]. É unha pasaxe cantabile na que o piano funciona durante boa parte do inicio como acompañamento das madeiras.","composer_bio":"Sergei Rajmáninov (1873–1943) foi compositor, pianista e director ruso. Formouse no Conservatorio de Moscova e desenvolveu unha linguaxe de forte continuidade romántica, caracterizada pola amplitude melódica, a harmonía cromática, a escritura pianística virtuosa e un profundo sentido do canto. Tras a Revolución rusa abandonou o país en 1917 e terminou asentándose nos Estados Unidos, onde a súa actividade como pianista ocupou boa parte da súa carreira.","work_context":"Despois da mala recepción da súa Primeira Sinfonía, Rajmáninov atravesou un longo bloqueo creativo. O apoio do doutor Nikolai Dahl foi importante na súa recuperación e o compositor dedicoulle o Segundo Concerto. Os movementos II e III escoitáronse primeiro en 1900; a obra completa estreouse en Moscova en 1901 con Rajmáninov ao piano e Alexander Siloti na dirección. O éxito do concerto marcou a recuperación da súa confianza como compositor.","excerpts":[{"name":"II. Adagio sostenuto · solo de clarinete","location":"Clarinete 1.º en La · 4 compases despois de [17] → 2 compases despois de [18].","context":"No inicio do movemento lento, tras a modulación orquestral e a entrada do piano con arpexos, a melodía principal pasa da frauta ao clarinete. O solista de piano funciona aquí como acompañante dunha liña de madeira extraordinariamente exposta.","role":"Gran cantabile solista: o clarinete debe soar como unha voz continua por riba do movemento regular do piano, conservando intimidade e dirección ata o relevo da frase.","technique":"Legato moi sostido, respiración discreta, afinación en dinámica baixa, control do vibrato natural da columna de aire sen oscilacións artificiais e rubato suficiente para cantar sen perder a relación co acompañamento.","pages":"Non figura no EP8661.","recording":"Valentina Lisitsa · London Symphony Orchestra · Michael Francis (Decca)","recording_url":"https://www.youtube.com/watch?v=SHN3Yexwu8A","recording_locator":"Pista completa do II movemento. Localizador seguro: 4 despois de [17] → 2 despois de [18]; non se fixa un minuto porque o tempo varía entre interpretacións.","materials":[{"type":"pdf","label":"PDF · II, 4 despois de [17]–2 despois de [18]","url":"https://clarinet.org/wp-content/uploads/2026/09/2027-ICA-ORCHESTRAL-AUDITION-COMPETITION.pdf#page=10","source":"International Clarinet Association · 2027","note":"O PDF imprime o solo completo do Adagio sostenuto.","coverage":"Extracto exacto"},{"type":"score","label":"Abrir partitura / particella","url":"https://imslp.org/wiki/Piano_Concerto_No.2_%28Rachmaninoff%2C_Sergei%29","source":"IMSLP","note":"Partitura/particella completa; localizar o corte coas marcas indicadas na ficha.","coverage":"Partitura completa"},{"type":"book","label":"McGinnis · vol. II","url":"https://www.clarinetallmusic.com/products/clarinet-orchestral-excerpts-vol-2-imc-mcginnis","source":"International Music Company","note":"O volume II inclúe Rachmaninoff Piano Concerto No. 2.","coverage":"Referencia impresa"}]}],"study":["Estudar primeiro a frase sen rubato, cunha columna de aire moi estable, e engadir despois flexibilidade sen perder a relación cos arpexos do piano.","Marcar respiracións posibles antes de tocar: a continuidade da liña é unha parte esencial do efecto e non convén decidir onde respirar no momento.","Practicar ataques en p desde silencio e finais de nota que descarguen tensión sen caer de afinación.","Escoitar o comezo do Adagio completo para identificar o relevo frauta → clarinete → piano/cordas e evitar interpretar o extracto como un solo independente.","Probar a tocar sobre unha gravación ou redución de piano: a dificultade principal non é a dixitación, senón manter canto e tempo dentro dunha textura en movemento constante."],"score_url":"https://imslp.org/wiki/Piano_Concerto_No.2_%28Rachmaninoff%2C_Sergei%29","score_note":"IMSLP ofrece partitura e particellas orquestrais. O II movemento emprega clarinete en La; o corte documentado pola International Clarinet Association vai de 4 despois de [17] a 2 despois de [18].","recording":"Valentina Lisitsa · London Symphony Orchestra · Michael Francis · Decca, II. Adagio sostenuto.","recording_url":"https://www.youtube.com/watch?v=SHN3Yexwu8A","recording_note":"O enlace abre directamente o II movemento. Para localizar o solo con precisión úsanse as marcas [17]–[18] en lugar dun minutaxe dependente da versión.","sources":[["International Clarinet Association · Orchestral Audition Competition: 4 despois de [17] → 2 despois de [18]","https://clarinet.org/competitions/orchestral-audition-competition/"],["IMSLP · Piano Concerto No. 2, op. 18","https://imslp.org/wiki/Piano_Concerto_No.2_%28Rachmaninoff%2C_Sergei%29"],["North Carolina Symphony · nota de programa: piano acompañando frauta e clarinete no II movemento","https://www.ncsymphony.org/wp-content/uploads/2223-CL03-print-file.pdf"],["Brussels Philharmonic · Dahl e dedicatoria do concerto","https://www.brusselsphilharmonic.be/en/expo-concerto2"],["Decca / YouTube · Lisitsa, LSO, Michael Francis · II. Adagio sostenuto","https://www.youtube.com/watch?v=SHN3Yexwu8A"]],"portrait_url":"https://commons.wikimedia.org/wiki/Special:Redirect/file/Sergei%20Rachmaninoff%20cph.3a40575.jpg","period":"Romanticismo tardío ruso","genre":"Concerto para piano e orquestra en tres movementos, op. 18","year":"1900–1901","work_structure":"I. Moderato · II. Adagio sostenuto – Più animato – Tempo I · III. Allegro scherzando.","influences":"É unha das obras emblemáticas do romanticismo tardío ruso: grandes arcos melódicos, harmonía cromática, textura pianística ampla e unha relación coas madeiras máis camerística do que pode suxerir a fama “pianística” do concerto. No Adagio, o piano entra cun patrón de arpexos que serve primeiro de acompañamento á frauta e ao clarinete antes de asumir maior protagonismo.","portrait_credit":"Sergei Rajmáninov, Kubey-Rembrandt Studios (1921) · Library of Congress / Wikimedia Commons","portrait_source":"https://commons.wikimedia.org/wiki/File:Sergei_Rachmaninoff_cph.3a40575.jpg","reviewed":"2026-10-01"},{"id":"3-2-32","course":3,"quarter":2,"instrument":"Clarinete en Si♭ e La","composer":"Smetana","work":"A noiva vendida","probespiel":"23","status":"Ficha revisada · lista","summary":"A obertura de A noiva vendida é un clásico de audición para clarinete. O EP8661 sitúaa na p. 23. As listas profesionais poden pedir un bloque longo —inicio–c. 111— ou subdividilo en pasaxes máis curtas; tamén aparecen con frecuencia cc. 170–176 e cc. 221–247. A particella histórica pode ser de clarinete en Do, mentres moitas audicións fornecen versión transposta para Sib.","composer_bio":"Bedřich Smetana (1824–1884) foi unha figura decisiva na consolidación dunha tradición musical checa moderna. Compositor, pianista e director, desenvolveu ópera, música sinfónica e de cámara cunha forte presenza da lingua, a danza e a identidade cultural checas. Entre as súas obras máis coñecidas están A noiva vendida e o ciclo sinfónico Má vlast.","work_context":"Smetana compuxo A noiva vendida entre 1863 e 1866 sobre libreto de Karel Sabina. A primeira versión, en dous actos e con diálogo falado, estreouse no Teatro Provisional de Praga o 30 de maio de 1866. O compositor revisouna repetidamente ata chegar en 1870 á versión definitiva en tres actos. A obertura converteuse nunha peza de concerto independente e nunha proba orquestral clásica pola velocidade, claridade contrapuntística e articulación.","excerpts":[{"name":"Obertura · inicio–c. 111 · extracto principal / Probespiel","location":"Inicio → c. 111. Moitas audicións subdividen este bloque: cc. 1–7/8 e arredor de cc. 93–107 son cortes recorrentes.","context":"A obertura arranca cun Vivacissimo de enorme impulso. Boa parte do material do clarinete é tutti de madeira máis ca “solo” tradicional, polo que o reto é encaixar nun mecanismo colectivo de gran precisión.","role":"Motor rítmico e tímbrico dentro das madeiras; hai tamén unha intervención solista breve despois da letra B. O carácter debe ser lixeiro e brillante incluso a velocidade alta.","technique":"Articulación rápida e igual, coordinación lingua-dedos, escalas e patróns de carácter pentatónico, resistencia e capacidade de manter fraseo dentro da repetición. A partitura orixinal usa clarinete en Do en boa parte da ópera; preparar tamén a versión transposta de audición.","pages":"EP8661 · p. 23","recording":"Jakub Hrůša · Czech Philharmonic · obertura","recording_url":"https://www.youtube.com/watch?v=arYtKZiXCec","recording_locator":"Desde 0:00. Para a preparación de audición, seguir na particella ata c. 111 e marcar os subcortes cc. 1–8 e 93–107."},{"name":"Obertura · cc. 170–176 · extracto profesional habitual","location":"cc. 170–176.","context":"Novo bloque curto dentro da carreira da obertura. A dificultade non está na duración senón en entrar xa a plena velocidade e coa articulación organizada.","role":"Intervención compacta integrada no tutti, útil en audición para comprobar precisión inmediata.","technique":"Entrada en frío, articulación uniforme, dedos próximos ás chaves e pulso estrito; evitar que os acentos rompan a continuidade da liña.","pages":"Material profesional complementario; a referencia curricular do Probespiel é p. 23.","recording":"Jakub Hrůša · Czech Philharmonic · obertura","recording_url":"https://www.youtube.com/watch?v=arYtKZiXCec","recording_locator":"Localizar c. 170 na particella. Non se fixa minutaxe: a velocidade cambia significativamente entre versións.","materials":[{"type":"pdf","label":"PDF · cc. 170–176","url":"https://assets.muvac.com/vacancies/jyzdrvmy/docs/663410/1750916408092-principal_clarinet_2025_-_audition_repertoire_booklet_%28updated_26_jun_2025%29.pdf?download=#page=22","source":"Principal Clarinet Audition 2025 · Muvac","note":"O booklet imprime xunto os cortes 170–176 e 221–247.","coverage":"Extracto exacto"},{"type":"score","label":"Abrir partitura / particella","url":"https://imslp.org/wiki/The_Bartered_Bride%2C_JB_1%3A100_%28Smetana%2C_Bed%C5%99ich%29","source":"IMSLP","note":"Partitura/particella completa; localizar o corte coas marcas indicadas na ficha.","coverage":"Partitura completa"},{"type":"book","label":"McGinnis · vol. I","url":"https://www.clarinetallmusic.com/products/clarinet-orchestral-excerpts-vol-1-imc-mcginnis","source":"International Music Company","note":"O volume I inclúe a Obertura de The Bartered Bride.","coverage":"Referencia impresa"}]},{"name":"Obertura · cc. 221–247 · extracto profesional habitual","location":"cc. 221–247. Algunhas convocatorias recortan o bloque, por exemplo ata c. 228.","context":"Treito avanzado da obertura, coa mesma esixencia de velocidade e coordinación pero despois dun percorrido que xa acumula fatiga.","role":"Parte da engrenaxe final da madeira, con énfase en claridade e enerxía sostida máis ca en protagonismo solista.","technique":"Resistencia, articulación a alta velocidade, igualdade, apoio de aire e control da tensión da man. Preparar tamén unha versión algo máis curta porque as audicións non usan sempre o mesmo final.","pages":"Material profesional complementario; EP8661 · p. 23 para o extracto da colección.","recording":"Jakub Hrůša · Czech Philharmonic · obertura","recording_url":"https://www.youtube.com/watch?v=arYtKZiXCec","recording_locator":"Localizar c. 221 e seguir ata c. 247; coñecer tamén o corte ata c. 228.","materials":[{"type":"pdf","label":"PDF · cc. 221–247","url":"https://assets.muvac.com/vacancies/jyzdrvmy/docs/663410/1750916408092-principal_clarinet_2025_-_audition_repertoire_booklet_%28updated_26_jun_2025%29.pdf?download=#page=22","source":"Principal Clarinet Audition 2025 · Muvac","note":"O booklet imprime xunto os cortes 170–176 e 221–247.","coverage":"Extracto exacto"},{"type":"score","label":"Abrir partitura / particella","url":"https://imslp.org/wiki/The_Bartered_Bride%2C_JB_1%3A100_%28Smetana%2C_Bed%C5%99ich%29","source":"IMSLP","note":"Partitura/particella completa; localizar o corte coas marcas indicadas na ficha.","coverage":"Partitura completa"},{"type":"book","label":"McGinnis · vol. I","url":"https://www.clarinetallmusic.com/products/clarinet-orchestral-excerpts-vol-1-imc-mcginnis","source":"International Music Company","note":"O volume I inclúe a Obertura de The Bartered Bride.","coverage":"Referencia impresa"}]}],"study":["Separar desde o principio dous problemas: velocidade de lingua e coordinación de dedos. Practicar cada un por separado antes de buscar o tempo final.","Traballar o inicio en grupos curtos con acentos métricos cambiantes para comprobar que todas as notas responden igual e que a man non memoriza só un patrón mecánico.","Se se utiliza a particella orixinal de clarinete en Do, estudar a transposición con método; se se emprega un material de audición xa transposto a Sib, anotalo claramente para non mesturar versións.","Preparar o bloque longo ata c. 111, pero ter marcados os subcortes 1–8 e 93–107: son formatos que aparecen en convocatorias reais.","Escoitar a obertura enteira a tempo profesional antes de decidir unha velocidade de audición; priorizar articulación lexible e carácter fronte a unha cifra de metrónomo insostible."],"score_url":"https://imslp.org/wiki/The_Bartered_Bride%2C_JB_1%3A100_%28Smetana%2C_Bed%C5%99ich%29","score_note":"IMSLP ofrece partitura e particellas da ópera. O Orchester-Probespiel inclúe a obertura (programación: p. 23). Atención á instrumentación: existen materiais históricos para clarinete en Do e moitas listas modernas presentan a parte transposta para Sib.","recording":"Jakub Hrůša · Czech Philharmonic · A noiva vendida, obertura (2024).","recording_url":"https://www.youtube.com/watch?v=arYtKZiXCec","recording_note":"Vídeo oficial da Czech Philharmonic e só da obertura, polo que serve como referencia directa de tempo, carácter e articulación. Para cada corte úsanse compases, non minutos aproximados.","sources":[["EP8661 / IMSLP · Orchester-Probespiel: Smetana, The Bartered Bride, Ouvertüre","https://imslp.org/wiki/Orchester-Probespiel"],["Principal Clarinet 2025 · inicio–111, 170–176, 221–247","https://assets.muvac.com/vacancies/jyzdrvmy/docs/663410/1750916408092-principal_clarinet_2025_-_audition_repertoire_booklet_%28updated_26_jun_2025%29.pdf?download="],["Vancouver Opera 2026 · exemplos de subcortes 1–8 e 93–107; clarinete en Do","https://downloads.ctfassets.net/0ofy2msgpalq/4YFaX21FnnFIxTvhkhTNle/818fbce81ede025e5506a11e82fb435b/VO_Audition_Package_-_Clarinet__2nd___Bass__-_012426.pdf"],["IMSLP · Prodaná nevěsta, JB 1:100","https://imslp.org/wiki/The_Bartered_Bride%2C_JB_1%3A100_%28Smetana%2C_Bed%C5%99ich%29"],["Orchestral Excerpts for the Clarinet · observacións de estudo sobre a obertura","https://studylib.net/doc/8600460/orchestral-excerpts-for-the-clarinet"],["Czech Philharmonic · Hrůša, obertura","https://www.youtube.com/watch?v=arYtKZiXCec"]],"portrait_url":"https://commons.wikimedia.org/wiki/Special:FilePath/Smetana.jpg?width=500","period":"Romanticismo checo · nacionalismo musical do século XIX","genre":"Ópera cómica; o repertorio de audición céntrase na obertura","year":"1863–1866 · versión definitiva 1870","work_structure":"Obertura + ópera en tres actos na versión definitiva. Entre os números orquestrais máis coñecidos están a Polka, o Furiant e a Danza dos comediantes.","influences":"A ópera procura unha linguaxe teatral checa propia e incorpora ritmos e xestos asociados á danza popular —sen ser unha simple colección de melodías folclóricas—. Na obertura, a enerxía vén da articulación rapidísima, das células repetidas e dos relevos entre cordas e madeiras. Para o clarinete é tan importante comprender a textura colectiva como dominar o mecanismo técnico.","portrait_credit":"Bedřich Smetana, arredor de 1878 · Wikimedia Commons","portrait_source":"https://commons.wikimedia.org/wiki/File:Smetana.jpg","reviewed":"2026-10-01"},{"id":"3-2-33","course":3,"quarter":2,"instrument":"Requinto","composer":"R. Strauss","work":"Till Eulenspiegel","probespiel":"35","status":"Ficha revisada · lista","summary":"Poema sinfónico no que o clarinete agudo é unha das voces que caracterizan directamente a Till. Non existe un único “solo”: o núcleo máis universal das audicións está arredor de [30/31]–[32] e [40]–8/9 compases despois, pero repertorios profesionais recentes engaden tamén cortes arredor de [16]–[19], [34]–[36] e antes de [40]. A ficha separa os dous extractos fundamentais dos adicionais para non darlles o mesmo peso.","composer_bio":"Richard Strauss (1864–1949) foi un compositor e director alemán e unha das figuras centrais do posromanticismo. Fillo do trompista Franz Strauss, medrou nun ambiente profundamente orquestral. Nos poemas sinfónicos —Don Juan, Tod und Verklärung, Till Eulenspiegel, Also sprach Zarathustra ou Ein Heldenleben— levou a escritura da gran orquestra a un grao extraordinario de virtuosismo, detalle tímbrico e caracterización. Na súa etapa operística destacan Salome, Elektra e Der Rosenkavalier.","work_context":"Strauss compuxo Till Eulenspiegels lustige Streiche en 1894–1895, despois do fracaso da súa primeira ópera, Guntram. O proxecto chegou a concibirse inicialmente como unha obra escénica e acabou convertido nun poema sinfónico “segundo unha antiga maneira de pícaros, en forma de rondó”. Estreouse en Colonia o 5 de novembro de 1895 baixo a dirección de Franz Wüllner. A narración segue as trasnadas do personaxe popular Till: a trompa presenta un dos seus grandes motivos e o clarinete agudo outro, máis incisivo e burlón; estes materiais reaparecen transformados ata o xuízo, a execución e o epílogo.","excerpts":[{"name":"Motivo de Till · 1 despois de [30]–[32] · extracto profesional habitual","location":"A delimitación máis frecuente vai de 1 compás despois de [30] ata [32]. Outras listas comezan en [31] ou dez compases antes de [31]. É un dos dous grandes cortes universais do requinto en Till.","context":"O motivo agudo e insolente de Till volve aparecer dentro dunha sucesión moi rápida de episodios. A liña debe conservar o carácter de personaxe: non é só unha proba de dedos, senón unha intervención teatral que ten que soar espontánea, descarada e extremadamente precisa.","role":"O clarinete agudo funciona como unha auténtica “voz” de Till. Strauss utiliza o seu rexistro penetrante para o xesto burlón, que debe sobresair pola articulación e pola personalidade máis ca por tocar excesivamente forte.","technique":"Articulación moi lixeira e definida, gran flexibilidade de dedos, intervalos limpos no rexistro agudo, afinación e capacidade para facer cambios de carácter instantáneos. Preparar tamén varias entradas anteriores para chegar ao solo co pulso interno correcto.","pages":"EP8661: p. 35 · a obra figura na sección de clarinete agudo. A delimitación [30/31]–[32] coincide con numerosas listas profesionais actuais.","recording":"Orchestra Excerpts · cinco gravacións comparadas do propio pasaxe","recording_url":"https://orchestraexcerpts.com/clarinet-r-strauss-till-eulenspiegels-lustige-streiche/","recording_locator":"Na páxina, “Excerpt 1” · 1 despois de [30] → [32]. Permite comparar Maazel/BRSO, Solti/Chicago, De Waart/Minnesota, Steinberg/Pittsburgh e Karajan/Viena."},{"name":"[34]–[36] · extracto profesional adicional","location":"4–5 compases despois de [34] ata [36]. Aparece en coleccións especializadas e tamén en listas profesionais recentes de requinto.","context":"Outro episodio da caracterización de Till, xa dentro dunha orquestración moi activa. A dificultade é conservar a sensación de xesto cómico e liberdade mentres a execución permanece milimétrica.","role":"Cor aguda, rítmica e moi visible dentro da sección de madeiras. O clarinete debe manter identidade propia sen separarse da articulación colectiva.","technique":"Regularidade de articulación, coordinación lingua-dedos, estabilidade da embocadura no agudo e control de acentos sen endurecer o son.","pages":"EP8661: p. 35 · material complementario profesional; comprobar o corte exacto da edición empregada.","recording":"Orchestra Excerpts · gravacións recortadas","recording_url":"https://orchestraexcerpts.com/clarinet-r-strauss-till-eulenspiegels-lustige-streiche/","recording_locator":"Na páxina, “Excerpt 2” · 4 despois de [34] → [36].","materials":[{"type":"pdf","label":"PDF educativo · 4 despois de [34]–[36]","url":"https://www.ucg.ac.me/skladiste/blog_23884/objava_65770/fajlovi/335894943_Orchestral_Excerpts_for_Clarinet_v2_1_US.pdf#page=36","source":"University of Montenegro · colección WoodwindExcerpts","note":"A colección hospedada pola universidade imprime este corte de clarinete en Re/Mi♭.","coverage":"Extracto exacto"},{"type":"web","label":"Ver notación e extractos","url":"https://orchestraexcerpts.com/clarinet-r-strauss-till-eulenspiegels-lustige-streiche/","source":"Orchestra Excerpts","note":"O sitio mostra o pasaxe arredor de [34]–[36] en clarinete agudo.","coverage":"Extractos con notación"},{"type":"score","label":"Abrir partitura / particella","url":"https://imslp.org/wiki/Till_Eulenspiegels_lustige_Streiche%2C_Op.28_%28Strauss%2C_Richard%29","source":"IMSLP","note":"Partitura/particella completa; localizar o corte coas marcas indicadas na ficha.","coverage":"Partitura completa"}]},{"name":"Antes de [40] · extracto adicional de repertorio moderno","location":"Algunhas audicións actuais engaden un bloque desde arredor de 6 compases despois de [38] ata poucos compases antes de [40]. Non é tan universal coma [31]–[32] ou [40], polo que queda marcado como adicional.","context":"A música achégase ao tramo final da historia de Till. O material faise máis cortante e a retórica orquestral prepara o xuízo e o desenlace.","role":"Intervención de gran proxección e carácter, integrada nunha textura densa. O requinto debe ser incisivo pero non estridente.","technique":"Seguridade nas entradas, afinación do rexistro superior, articulación curta e controlada e capacidade para cambiar rapidamente entre dinámica, acento e cor.","pages":"EP8661: p. 35 · corte adicional documentado en repertorios modernos; non debe confundirse co extracto principal de [40].","recording":"Gravación completa + partitura","recording_url":"https://www.youtube.com/watch?v=iZoLCcy1xbA","recording_locator":"Usar [38]–[40] como localizador na partitura. O vídeo da Berliner Philharmoniker funciona como apoio específico para o estilo do clarinete agudo en Till.","materials":[{"type":"pdf","label":"PDF educativo · [40]–8 despois de [40]","url":"https://www.ucg.ac.me/skladiste/blog_23884/objava_65770/fajlovi/335894943_Orchestral_Excerpts_for_Clarinet_v2_1_US.pdf#page=37","source":"University of Montenegro · colección WoodwindExcerpts","note":"A colección hospedada pola universidade imprime o gran corte de [40].","coverage":"Extracto exacto / próximo"},{"type":"web","label":"Ver notación e extractos","url":"https://orchestraexcerpts.com/clarinet-r-strauss-till-eulenspiegels-lustige-streiche/","source":"Orchestra Excerpts","note":"O sitio mostra o material que conduce a [40] e o gran corte de [40].","coverage":"Extractos con notación"},{"type":"score","label":"Abrir partitura / particella","url":"https://imslp.org/wiki/Till_Eulenspiegels_lustige_Streiche%2C_Op.28_%28Strauss%2C_Richard%29","source":"IMSLP","note":"Partitura/particella completa; localizar o corte coas marcas indicadas na ficha.","coverage":"Partitura completa"}]},{"name":"Epílogo · [40]–8/9 despois · extracto do Probespiel / habitual","location":"[40] ata 8–9 compases despois de [40]. É o segundo gran corte de requinto da obra e aparece de maneira constante en audicións profesionais.","context":"O pasaxe sitúase no tramo final, ligado ao desenlace e ao epílogo. Despois da execución de Till, Strauss recupera a atmosfera narrativa inicial, pero o personaxe conserva a súa presenza ata o final.","role":"O clarinete agudo concentra de novo a identidade de Till. A intervención ten que soar viva e expresiva, non simplemente “alta e rápida”.","technique":"Control do agudo, flexibilidade de frase, ataques exactos, dinámica e afinación. É importante non comprimir a embocadura cando aumenta a tensión e manter unha columna de aire moi rápida.","pages":"EP8661: p. 35 · fragmento central do repertorio de requinto.","recording":"Orchestra Excerpts · cinco gravacións comparadas","recording_url":"https://orchestraexcerpts.com/clarinet-r-strauss-till-eulenspiegels-lustige-streiche/","recording_locator":"Na páxina, “Excerpt 3” · [40] → 8 despois de [40]. Convocatorias recentes amplían un compás máis."},{"name":"[16]–[19] · material profesional adicional","location":"Algunhas listas modernas de requinto inclúen tamén un bloque arredor de 5 compases despois de [16] ata 2 despois de [19]. É claramente menos universal e por iso queda ao final da ficha.","context":"Primeiros episodios das trasnadas de Till, cando o compositor comeza a transformar con rapidez os dous motivos do personaxe.","role":"Coloración aguda e caricaturesca, estreitamente ligada ao relevo entre madeiras e metais.","technique":"Lixeireza, resposta inmediata, control de afinación e capacidade para proxectar articulación sen forzar o timbre.","pages":"Material profesional adicional; non se presenta como núcleo do EP8661.","recording":"Partitura completa / gravación de referencia","recording_url":"https://imslp.org/wiki/Till_Eulenspiegels_lustige_Streiche%2C_Op.28_%28Strauss%2C_Richard%29","recording_locator":"Localizar [16] e seguir ata [19]. Este corte serve como ampliación, non como prioridade fronte a [31]–[32] e [40].","materials":[{"type":"pdf","label":"PDF · repertorio ampliado de requinto","url":"https://kbssymphony.org/board/upload/KBSSPN_20260119130110.pdf","source":"KBS Symphony Orchestra","note":"Confirma material adicional de Till para requinto; é documento de audición.","coverage":"Referencia oficial"},{"type":"web","label":"Ver notación e extractos","url":"https://orchestraexcerpts.com/clarinet-r-strauss-till-eulenspiegels-lustige-streiche/","source":"Orchestra Excerpts","note":"Para [16]–[19], usar a partitura completa e a lista KBS como referencia de repertorio.","coverage":"Extractos con notación"},{"type":"score","label":"Abrir partitura / particella","url":"https://imslp.org/wiki/Till_Eulenspiegels_lustige_Streiche%2C_Op.28_%28Strauss%2C_Richard%29","source":"IMSLP","note":"Partitura/particella completa; localizar o corte coas marcas indicadas na ficha.","coverage":"Partitura completa"}]}],"study":["Priorizar primeiro os dous cortes nucleares: [30/31]–[32] e [40]–8/9 despois. Só despois ampliar cos bloques [34]–[36], antes de [40] e [16]–[19].","Practicar cada pasaxe como texto dramático: decidir onde “fala”, ri, provoca ou se escapa Till. O carácter é parte da dificultade, non un adorno posterior.","Traballar o agudo con aire rápido e embocadura estable, evitando morder para gañar seguridade. Gravar a afinación das notas longas e dos intervalos amplos.","Alternar práctica moi lenta e execución a tempo real. A coordinación lingua-dedos debe quedar automatizada sen perder elasticidade.","Escoitar varias gravacións do mesmo corte: en Strauss hai bastante marxe de frase e carácter, pero a precisión rítmica e a claridade deben permanecer constantes."],"score_url":"https://imslp.org/wiki/Till_Eulenspiegels_lustige_Streiche%2C_Op.28_%28Strauss%2C_Richard%29","score_note":"IMSLP: partitura xeral e materiais segundo edición e dereitos territoriais. A parte histórica aparece como clarinete agudo en Re en varias edicións; nas audicións modernas é habitual recibir/tocar o material en Mi♭. Comprobar sempre a parte facilitada pola orquestra.","recording":"Orchestra Excerpts · páxina específica de Till con tres extractos e cinco gravacións comparadas.","recording_url":"https://orchestraexcerpts.com/clarinet-r-strauss-till-eulenspiegels-lustige-streiche/","recording_note":"É especialmente útil porque permite ir directamente a [30]–[32], [34]–[36] e [40] e comparar cinco interpretacións. Para o contexto completo, usar tamén unha gravación sinfónica integral.","sources":[["Orquestra Sinfônica Brasileira 2026: requinto, Till [31]–[32] e [40]–9 despois","https://www.osb.com.br/wp-content/uploads/2025/11/Auditions-Annoucement-OSB-2026.1.pdf"],["Orchestra Excerpts: tres extractos de Till para clarinete en Re/Mi♭ e gravacións","https://orchestraexcerpts.com/clarinet-r-strauss-till-eulenspiegels-lustige-streiche/"],["TŌN: repertorio de audición de requinto, Till antes de [31]–[32] e [40]–9 despois","https://ton.bard.edu/academics/audition-repertoire/"],["KBS Symphony 2026: repertorio ampliado de requinto en Till","https://kbssymphony.org/board/upload/KBSSPN_20260119130110.pdf"],["St. Louis Symphony: notas de programa e función do clarinete agudo como motivo de Till","https://slso.org/opening-weekend-with-hilary-hahn-september-23-24-2023/"],["Richard Strauss Werke: datos da estrea de 1895","https://www.richard-strauss-ausgabe.de/band/?chapter=el&volume=b46455"],["Berliner Philharmoniker: tutorial de clarinete agudo de Till","https://www.youtube.com/watch?v=iZoLCcy1xbA"],["IMSLP: Till Eulenspiegels lustige Streiche, op. 28","https://imslp.org/wiki/Till_Eulenspiegels_lustige_Streiche%2C_Op.28_%28Strauss%2C_Richard%29"]],"portrait_url":"https://commons.wikimedia.org/wiki/Special:FilePath/Ferdinand%20Schmutzer%20-%20Richard%20Strauss,%201922.jpg?width=500","period":"Posromanticismo · poema sinfónico alemán","genre":"Poema sinfónico / Tondichtung para gran orquestra, op. 28 · TrV 171","year":"1894–1895 · estrea 1895","work_structure":"Rondó libre articulado arredor dos motivos de Till: prólogo de “conto”, aparición do personaxe, sucesión de trasnadas e transformacións temáticas, xuízo e execución, e epílogo que recupera a atmosfera inicial.","influences":"Strauss parte da tradición popular alemá de Till Eulenspiegel e da forma do poema sinfónico desenvolvida por Liszt, pero transforma o relato nunha dramaturxia puramente orquestral. Os dous motivos de Till —trompa e clarinete agudo— reaparecen en múltiples disfraces, o que converte timbre, articulación e carácter en elementos estruturais.","portrait_credit":"Richard Strauss, fotografía de Ferdinand Schmutzer, 1922 · Wikimedia Commons","portrait_source":"https://commons.wikimedia.org/wiki/File:Ferdinand_Schmutzer_-_Richard_Strauss,_1922.jpg","reviewed":"2026-10-01"},{"id":"3-2-34","course":3,"quarter":2,"instrument":"Requinto","composer":"Stravinski","work":"A consagración da primavera","probespiel":"37","status":"Ficha revisada · lista","summary":"A consagración da primavera é un caso especialmente importante: a escritura orixinal utiliza clarinete agudo en Re e en Mi♭, e as audicións modernas de requinto poden pedir ambos materiais. O EP8661 sitúa Le Sacre na p. 37, primeira parte. A ficha identifica o instrumento orixinal cando é necesario e separa tres cortes profesionais actuais da primeira parte e tres pasaxes adicionais de Mi♭ que amplían a preparación.","composer_bio":"Igor Stravinski (1882–1971) foi un compositor nacido no Imperio ruso e posteriormente cidadán francés e estadounidense. Formouse en San Petersburgo e recibiu orientación privada de Nikolái Rimski-Kórsakov, decisiva para a súa comprensión da orquestración. A colaboración con Sergei Diaghilev e os Ballets Russes —O paxaro de lume, Petrushka e A consagración da primavera— situouno no centro da modernidade musical europea. A súa longa carreira atravesou etapas rusa, neoclásica e serial.","work_context":"Stravinski compuxo A consagración da primavera para os Ballets Russes de Sergei Diaghilev entre 1910 e 1913, en colaboración co artista e estudoso da antiga Rusia Nikolái Roerich e co coreógrafo Vaslav Nijinsky. O argumento presenta unha Rusia pagá imaxinada: unha comunidade celebra a primavera mediante rituais que culminan na elección dunha moza que danza ata a morte como sacrificio. A estrea tivo lugar no Théâtre des Champs-Élysées de París o 29 de maio de 1913, con Pierre Monteux no podio. A enorme orquestra, os ostinati, a superposición de capas, os acentos irregulares e a transformación de materiais folclóricos crean unha linguaxe radicalmente nova.","excerpts":[{"name":"I parte · Introdución · [4]–[12] · corte profesional amplo (orixinal en Re)","location":"Convocatorias modernas para posto de requinto poden pedir [4]–[12] como un único bloque. As coleccións especializadas separan [4]–[5] e [7]–3 compases despois de [11] e identifican estes dous subfragmentos como clarinete en Re na partitura orixinal.","context":"A Introdución constrúe unha paisaxe sonora primitiva a partir de solos e pequenas células das madeiras. O clarinete agudo aparece entre voces moi expostas, con rexistros extremos e combinacións tímbricas pouco convencionais.","role":"Voz solista de cor, ás veces case instrumentalmente ambigua dentro da masa de madeiras. A prioridade é encaixar afinación e timbre cos instrumentos que rodean a liña, non buscar volume.","technique":"Control absoluto do rexistro agudo, entradas desde silencio, afinación, flexibilidade de embocadura e coordinación en figuras irregulares. Se a audición fornece a parte transposta para Mi♭, estudar esa versión exacta e non asumir a notación orixinal en Re.","pages":"EP8661: p. 37 · I parte. O material de audición moderno pode presentar en Mi♭ pasaxes escritos orixinalmente para clarinete en Re.","recording":"Orchestra Excerpts · cortes [4]–[5] e [7]–despois de [11]","recording_url":"https://orchestraexcerpts.com/clarinet-stravinsky-rite-spring-6-excerpts/","recording_locator":"Na páxina, “Excerpt 1” e “Excerpt 2”. Para o corte amplo actual, estudar de [4] a [12] coa partitura completa."},{"name":"I parte · 3 antes de [43]–[44] · extracto adicional en Mi♭","location":"3 compases antes de [43] ata [44]. Coleccións especializadas identifícano expresamente como clarinete en Mi♭.","context":"Pasaxe da primeira parte dentro dunha textura rítmica moi activa. A liña do requinto aparece como un dos focos agudos que atravesan a masa orquestral.","role":"Cor brillante e incisiva, integrada coa maquinaria rítmica. Debe ser clara sen converterse nun son duro ou separado do resto das madeiras.","technique":"Articulación, precisión de acentos, rexistro agudo e estabilidade do tempo. Practicar con metrónomo en subdivisións grandes para non volver a frase pesada.","pages":"Material profesional adicional. O EP8661 sitúa Le Sacre na p. 37, pero este corte non se presenta aquí como núcleo da selección do Probespiel.","recording":"Orchestra Excerpts · cinco gravacións do pasaxe","recording_url":"https://orchestraexcerpts.com/clarinet-stravinsky-rite-spring-6-excerpts/","recording_locator":"“Excerpt 3” · 3 antes de [43] → [44].","materials":[{"type":"web","label":"Ver notación · cortes de Sacre","url":"https://orchestraexcerpts.com/clarinet-stravinsky-rite-spring-6-excerpts/","source":"Orchestra Excerpts","note":"A páxina distingue os pasaxes de clarinete en Re e Mi♭ e mostra a notación.","coverage":"Extracto en web"},{"type":"pdf","label":"PDF · repertorio de requinto","url":"https://kbssymphony.org/board/upload/KBSSPN_20260119130110.pdf","source":"KBS Symphony Orchestra","note":"Documento profesional de referencia para Sacre.","coverage":"Extracto en PDF"}]},{"name":"I parte · Rondes printanières · [48]–[49] · extracto profesional habitual","location":"[48] ata [49] / un compás antes de [49], segundo a lista. É un dos cortes de requinto máis repetidos actualmente.","context":"Nas Rondes printanières a música adopta un pulso máis pesado e hipnótico. O clarinete agudo participa nunha cor sorprendentemente delicada dentro dunha textura que medra desde o misterio cara a unha gran presión orquestral.","role":"Voz aguda exposta que debe empastar coas madeiras e manter unha cor flexible. O efecto depende máis da afinación e do control que da proxección agresiva.","technique":"Son moi estable en dinámica baixa, afinación do agudo, legato e control de notas de tendencia difícil. Escoitar especialmente o instrumento co que comparte a liña/contexto para axustar altura e cor.","pages":"EP8661: p. 37 · I parte · corte central do repertorio profesional de requinto.","recording":"London Symphony Orchestra · Sir Simon Rattle + referencias de Orchestra Excerpts","recording_url":"https://www.youtube.com/watch?v=EkwqPJZe8ms","recording_locator":"Parte I · Rondes printanières · [48]–[49]. Para comparacións de extracto, usar tamén Orchestra Excerpts."},{"name":"I parte · final das Rondes · [56]–[57] · extracto profesional habitual","location":"Hai pequenas variantes: Orchestra Excerpts usa 2 despois de [56] → [57]; a OSB 2026 pide desde o 3.º compás de [56] ata 1 antes de [57].","context":"Tramo final das Rondes printanières e transición á seguinte sección. A tensión aumenta e a escritura do requinto queda moi exposta sobre unha textura que xa recupera forte impulso rítmico.","role":"Intervención aguda de grande precisión, cunha combinación difícil de delicadeza tímbrica e seguridade rítmica.","technique":"Afinación de notas agudas sostidas, control da dinámica, seguridade nas dixitacións alternativas e sincronización exacta co contexto orquestral.","pages":"EP8661: p. 37 · I parte · corte profesional habitual.","recording":"Orchestra Excerpts · gravacións recortadas","recording_url":"https://orchestraexcerpts.com/clarinet-stravinsky-rite-spring-6-excerpts/","recording_locator":"“Excerpt 4” · 2 despois de [56] → [57]. Comparar coa delimitación OSB: 3.º compás de [56] → 1 antes de [57]."},{"name":"II parte · [115]–1 despois de [117] · extracto adicional","location":"[115] ata 1 compás despois de [117]. Identificado como clarinete en Mi♭ en repertorio especializado.","context":"Na segunda parte o ritual faise máis escuro e violento. O requinto atravesa unha orquestración de gran densidade con figuras breves e fortemente caracterizadas.","role":"Cor extrema e rítmica, máis integrada no mecanismo colectivo ca nun solo lírico tradicional.","technique":"Conteo, ataques seguros, intervalos no agudo e capacidade para manter precisión cando a textura orquestral é moi complexa.","pages":"Fóra do núcleo da p. 37, que a programación identifica coa I parte; conservar como ampliación profesional.","recording":"Orchestra Excerpts · gravacións recortadas","recording_url":"https://orchestraexcerpts.com/clarinet-stravinsky-rite-spring-6-excerpts/","recording_locator":"“Excerpt 5” · [115] → 1 despois de [117].","materials":[{"type":"web","label":"Ver notación · cortes de Sacre","url":"https://orchestraexcerpts.com/clarinet-stravinsky-rite-spring-6-excerpts/","source":"Orchestra Excerpts","note":"Inclúe material adicional da II parte; localizar [115]–[117].","coverage":"Extracto en web"},{"type":"pdf","label":"PDF · repertorio de requinto","url":"https://kbssymphony.org/board/upload/KBSSPN_20260119130110.pdf","source":"KBS Symphony Orchestra","note":"Documento profesional de referencia para Sacre.","coverage":"Extracto en PDF"}]},{"name":"II parte · Danse sacrale · [155]–[162] · extracto adicional","location":"[155] ata [162]. Outro dos grandes bloques de Mi♭ recollidos en coleccións profesionais.","context":"Danza sacrificial final da Elixida: a música está construída a partir de acentos, células e cambios métricos extremadamente irregulares.","role":"O requinto é unha peza da engrenaxe rítmica xeral. A súa función é cortar a textura con absoluta claridade e encaixar cos ataques colectivos.","technique":"Subdivisión interna, lectura de métricas cambiantes, articulación precisa, resistencia e capacidade para manter relaxación física baixo unha densidade rítmica extrema.","pages":"Material adicional da II parte; non corresponde ao extracto da p. 37 sinalado na programación.","recording":"Orchestra Excerpts · cinco gravacións do pasaxe","recording_url":"https://orchestraexcerpts.com/clarinet-stravinsky-rite-spring-6-excerpts/","recording_locator":"“Excerpt 6” · [155] → [162].","materials":[{"type":"pdf","label":"PDF · Danse sacrale [155]–[162]","url":"https://www.verbierfestival.com/app/uploads/2021/11/Clarinet-Excerpts-Verbier-Festival-Orchestra-2022-1.pdf#page=10","source":"Verbier Festival Orchestra","note":"O paquete de audición inclúe o pasaxe de requinto [155]–[162].","coverage":"Extracto exacto"},{"type":"web","label":"Ver notación · [155]–[162]","url":"https://orchestraexcerpts.com/clarinet-stravinsky-rite-spring-6-excerpts/","source":"Orchestra Excerpts","note":"Notación e explicación do corte.","coverage":"Extracto en web"}]}],"study":["Distinguir sempre o instrumento escrito na fonte: os primeiros solos da Introdución aparecen como clarinete en Re na partitura orixinal, aínda que audicións modernas para posto de requinto poden pedilos dentro do paquete de Mi♭.","Priorizar [4]–[12], [48]–[49] e [56]–[57], porque coinciden en listas profesionais recentes e forman o núcleo máis útil para a materia.","En [48]–[57], estudar primeiro afinación e cor sen tempo; despois engadir o contexto rítmico. O reto non é simplemente tocar agudo, senón empastar nunha textura moi específica.","Para os cortes da II parte, marcar subdivisións e puntos de referencia da orquestra. Practicar con metrónomo que marque unidades maiores para evitar dependencia dunha subdivisión mecánica.","Comparar varias gravacións do mesmo extracto: Sacre admite diferenzas de tempo importantes, polo que as marcas de ensaio son máis fiables ca calquera minuto fixo."],"score_url":"https://imslp.org/wiki/The_Rite_of_Spring%2C_K015_%28Stravinsky%2C_Igor%29","score_note":"IMSLP: partitura xeral e materiais segundo edición e dereitos territoriais. A obra emprega clarinete agudo en Re e en Mi♭; para audicións debe seguirse exactamente a parte facilitada, porque un mesmo paquete de “E-flat clarinet” pode incluír material orixinalmente escrito en Re.","recording":"Orchestra Excerpts · seis pasaxes con gravacións comparadas; como referencia integral, LSO / Sir Simon Rattle (2017).","recording_url":"https://orchestraexcerpts.com/clarinet-stravinsky-rite-spring-6-excerpts/","recording_note":"A páxina permite ir directamente aos seis cortes e comparar interpretacións. Para entender o contexto, a ficha mantén tamén a gravación integral da LSO nas fontes. Localizar sempre por número de ensaio.","sources":[["Orquestra Sinfônica Brasileira 2026: requinto, Sacre [4]–[12], [48]–[49] e [56]–[57]","https://www.osb.com.br/wp-content/uploads/2025/11/Auditions-Annoucement-OSB-2026.1.pdf"],["Orchestra Excerpts: seis extractos, identificando clarinete en Re e en Mi♭","https://orchestraexcerpts.com/clarinet-stravinsky-rite-spring-6-excerpts/"],["Brookline Symphony: Sacre [4]–[5] e [7]–despois de [11] como opción de requinto","https://www.brooklinesymphony.org/auditions"],["KBS Symphony 2026: Sacre como repertorio de requinto, inicio–[12], [48]–[49] e [56]–[57]","https://kbssymphony.org/board/upload/KBSSPN_20260119130110.pdf"],["London Symphony Orchestra / Simon Rattle: The Rite of Spring","https://www.youtube.com/watch?v=EkwqPJZe8ms"],["IMSLP: The Rite of Spring","https://imslp.org/wiki/The_Rite_of_Spring%2C_K015_%28Stravinsky%2C_Igor%29"]],"portrait_url":"https://commons.wikimedia.org/wiki/Special:Redirect/file/Igor_Stravinsky_LOC_32392u.jpg","period":"Século XX · modernismo · período ruso de Stravinski","genre":"Ballet en dúas partes, K015","year":"1910–1913 · estrea 1913 · revisións posteriores, incluída 1947","work_structure":"Parte I: L’Adoration de la terre (A adoración da terra) · Parte II: Le Sacrifice (O sacrificio). A sucesión de escenas conduce desde os primeiros ritos primaverais ata a Danza sacrificial da Elixida.","influences":"O proxecto nace da colaboración entre Stravinski, Diaghilev, Roerich e Nijinsky e dunha visión escénica dunha Rusia pagá arcaica. Stravinski transforma materiais e xiros asociados ao folclore do leste europeo mediante ostinati, superposicións harmónicas, cambios de acentuación e unha concepción da orquestra na que os instrumentos graves tamén funcionan como voces solistas e de cor.","portrait_credit":"Igor Stravinski, George Grantham Bain Collection, ca. 1920–1925 · Library of Congress / Wikimedia Commons","portrait_source":"https://commons.wikimedia.org/wiki/File:Igor_Stravinsky_LOC_32392u.jpg","reviewed":"2026-10-01"},{"id":"3-2-35","course":3,"quarter":2,"instrument":"Requinto","composer":"Ravel","work":"Daphnis et Chloé","probespiel":"34–35","status":"Ficha revisada · lista","summary":"Daphnis et Chloé ocupa as pp. 34–35 da sección de clarinete agudo do EP8661. O repertorio profesional actual concéntrase sobre todo na Suite n.º 2, pero existen tamén materiais da Suite n.º 1. A ficha dá prioridade aos bloques que se repiten hoxe —arredor de [157]–[161], [200]–[204] e [214]–final— e conserva como complementarios os pequenos solos de [160] e [161] e os cortes da Suite n.º 1.","composer_bio":"Maurice Ravel (1875–1937) foi un dos grandes compositores franceses do cambio de século. Pianista de formación, destacou pola precisión formal, a refinada harmonía e unha orquestración extraordinariamente transparente. A súa música mantén vínculos co simbolismo e co impresionismo francés, aínda que Ravel conservou sempre unha forte disciplina clásica e un gusto por danzas, mecanismos e formas moi definidas.","work_context":"Ravel traballou en Daphnis et Chloé entre 1909 e 1912 por encargo de Sergei Diaghilev para os Ballets Russes. Michel Fokine elaborou o escenario a partir da novela pastoril atribuída a Longo, e Léon Bakst deseñou a produción. A estrea tivo lugar no Théâtre du Châtelet de París o 8 de xuño de 1912, dirixida por Pierre Monteux, con Vaslav Nijinsky e Tamara Karsavina. Ravel denominou a obra “symphonie chorégraphique”: máis ca unha sucesión convencional de números de ballet, é un gran arco sinfónico no que a orquestración crea luz, espazo e movemento. A Suite n.º 2 procede do terceiro cadro e reúne Lever du jour, Pantomime e Danse générale.","excerpts":[{"name":"Suite n.º 2 · Lever du jour · 1 antes de [157]–[161] · extracto profesional habitual","location":"Un compás antes de [157] ata [161] nunha lista profesional actual. Dentro deste bloque, coleccións especializadas illan como solo de requinto [160] → 2 despois de [160].","context":"Comezo do terceiro cadro, Lever du jour. Ravel constrúe o amencer a partir de trilos, arpexos, glissandi e pequenos solos de madeiras que aparecen como sons da natureza.","role":"O requinto é unha cor brillante e moi delicada dentro dunha textura de enorme transparencia. O seu pequeno solo debe soar como parte do amencer, non como unha demostración de proxección.","technique":"Ataque suave no agudo, afinación, estabilidade do aire, flexibilidade de dinámica e capacidade para facer que cada nota teña dirección sen endurecer o timbre.","pages":"EP8661: pp. 34–35 · Daphnis figura na sección de clarinete agudo. A delimitación ampla deste corte segue repertorio profesional moderno.","recording":"Sean Osborn · demostración específica do solo de requinto + LSO/Rattle para contexto","recording_url":"https://www.youtube.com/watch?v=L9AR7DIJED8","recording_locator":"O vídeo de Sean Osborn vai directamente ao solo de Mi♭. Para o bloque completo, seguir [157]–[161] na Suite n.º 2."},{"name":"Suite n.º 2 · 2 despois de [161]–antes de [166] · pasaxe complementaria","location":"2 compases despois de [161] ata 2 antes de [166] na colección especializada; algunhas listas profesionais recortan só unha parte deste bloque.","context":"O amencer segue medrando e as madeiras van intercambiando pequenos xestos nun tecido continuo. O requinto debe conservar a mesma sensación de naturalidade e luminosidade.","role":"Voz de enlace e cor entre as madeiras agudas, con presenza suficiente para ser lexible pero sempre integrada.","technique":"Legato no agudo, afinación, control de dedos en dinámica baixa e capacidade para manter a frase a través dos silencios e relevos.","pages":"EP8661: pp. 34–35 · material complementario dentro da preparación de Daphnis para requinto.","recording":"London Symphony Orchestra · Sir Simon Rattle · Suite n.º 2","recording_url":"https://www.youtube.com/watch?v=IlENd0p6aR4","recording_locator":"Lever du jour · 2 despois de [161] → antes de [166]. Usar as marcas de ensaio, non un minuto aproximado.","materials":[{"type":"pdf","label":"PDF · despois de [161]–antes de [166]","url":"https://www.verbierfestival.com/app/uploads/2019/12/VFO-Clarinet-Excerpts-2020.pdf#page=8","source":"Verbier Festival Orchestra","note":"Paquete oficial co extracto de Mi♭ inmediatamente despois de [161].","coverage":"Extracto exacto"},{"type":"score","label":"Abrir partitura / particella","url":"https://imslp.org/wiki/Daphnis_et_Chlo%C3%A9%2C_M.57_%28Ravel%2C_Maurice%29","source":"IMSLP","note":"Partitura/particella completa; localizar o corte coas marcas indicadas na ficha.","coverage":"Partitura completa"}]},{"name":"Suite n.º 2 · [200]–[204] · extracto profesional habitual","location":"[200] ata 2 antes de [204] na OSB; Aspen amplía ata 6 compases despois de [203]. É un dos cortes modernos máis recorrentes de requinto.","context":"A música entra na zona Animé que conduce á Danse générale. A textura faise máis motórica e densa, pero Ravel mantén unha articulación extremadamente refinada entre as madeiras.","role":"O requinto aporta brillo e mordente rítmico no rexistro superior, funcionando como parte dunha maquinaria colectiva máis que como un solo cantabile.","technique":"Articulación moi uniforme, precisión vertical, rexistro agudo estable, resistencia e control para non acelerar cando a textura colle impulso.","pages":"EP8661: pp. 34–35 · corte profesional habitual. Comprobar a delimitación exacta da convocatoria.","recording":"London Symphony Orchestra · Sir Simon Rattle · Suite n.º 2","recording_url":"https://www.youtube.com/watch?v=IlENd0p6aR4","recording_locator":"Localizar [200]. Preparar como mínimo ata 2 antes de [204] e coñecer a extensión longa ata 6 despois de [203]."},{"name":"Suite n.º 2 · [214]–final · extracto profesional habitual","location":"[214] ata o final na OSB 2026; Aspen pide [214] ata 4 compases despois de [220].","context":"Danse générale / bacanal final. Toda a orquestra avanza cunha enerxía extrema, métrica cambiante e acumulación progresiva de tensión.","role":"Engrenaxe aguda e virtuosística das madeiras. O requinto debe conservar definición e afinación dentro dunha masa orquestral moi potente, sen intentar competir en volume cos metais.","technique":"Resistencia, articulación rápida, dedos eficientes, estabilidade de tempo e apoio de aire ata o final. Practicar por células e despois reconstruír arcos longos para non tocar compás a compás.","pages":"EP8661: pp. 34–35 · material central do repertorio de requinto; a extensión moderna varía segundo a orquestra.","recording":"London Symphony Orchestra · Sir Simon Rattle · Suite n.º 2","recording_url":"https://www.youtube.com/watch?v=IlENd0p6aR4","recording_locator":"Danse générale · [214] → final. A marca [214] é moito máis fiable ca un minuto fixo."},{"name":"Suite n.º 1 · [110] e [120]–[121] · material profesional adicional","location":"Listas de requinto tamén recollen material da Suite n.º 1: [110] ata poucos compases despois e [120]–[121]. Non é tan universal hoxe coma os cortes da Suite n.º 2.","context":"Zona do segundo cadro, no campamento dos piratas, dentro do gran episodio Animé et très rude / Danse guerrière. A cor da orquestra é deliberadamente áspera e violenta fronte á luminosidade da terceira parte.","role":"Requinto como cor cortante dentro dunha escrita moi activa e teatral. A función cambia radicalmente respecto de Lever du jour.","technique":"Articulación incisiva sen estridencia, precisión rítmica, control do forte no rexistro agudo e coordinación coa sección de madeiras.","pages":"EP8661: pp. 34–35 · a compilación inclúe material de Daphnis para clarinete agudo; este bloque queda como ampliación profesional.","recording":"Gravación completa / segundo cadro · Animé et très rude","recording_url":"https://www.youtube.com/watch?v=IlENd0p6aR4","recording_locator":"Para a obra completa, localizar o segundo cadro / Danse guerrière e seguir as marcas [110] e [120]–[121]."},{"name":"Suite n.º 1 · [128]–[129] · material profesional adicional","location":"[128] ata [129]. Outro corte de requinto documentado en listas profesionais, útil como ampliación do bloque da Suite n.º 1.","context":"Continúa o episodio dos piratas, nunha zona de forte tensión escénica antes da danza suplicante de Chloé.","role":"Cor aguda de gran presenza, integrada nunha orquestración moi densa.","technique":"Seguridade de entrada, afinación do agudo, control da dinámica alta e reacción rápida aos cambios de carácter.","pages":"EP8661: pp. 34–35 · material complementario; non se lle dá a mesma prioridade ca [200]–[204] e [214]–final.","recording":"Gravación completa / segundo cadro","recording_url":"https://www.youtube.com/watch?v=IlENd0p6aR4","recording_locator":"Localizar [128]–[129] na partitura completa. Preparalo despois dos tres cortes principais da Suite n.º 2.","materials":[{"type":"pdf","label":"PDF · Suite n.º 1 e 2 · repertorio de requinto","url":"https://www.kbssymphony.org/board/upload/KBSSPN_20220803100837.pdf","source":"KBS Symphony Orchestra","note":"Confirma o material da Suite n.º 1, incluído como ampliación profesional.","coverage":"Referencia oficial"},{"type":"score","label":"Abrir partitura / particella","url":"https://imslp.org/wiki/Daphnis_et_Chlo%C3%A9%2C_M.57_%28Ravel%2C_Maurice%29","source":"IMSLP","note":"Partitura/particella pública. Localizar [128]–[129] na Suite n.º 1.","coverage":"Partitura completa"}]}],"study":["Priorizar a preparación moderna da Suite n.º 2: [157]–[161], [200]–[204] e [214]–final. Os cortes da Suite n.º 1 quedan como segunda capa de estudo.","En Lever du jour, practicar primeiro son, afinación e ataques a dinámica moi baixa; a impresión debe ser de facilidade e luz, non de tensión polo rexistro.","En [200] e [214], estudar por grupos rítmicos curtos pero reconstruír despois a frase longa. Ravel necesita precisión sen sensación mecánica.","Traballar coa partitura xeral: identificar que instrumentos dobran, responden ou continúan a liña para decidir dinámica, articulación e dirección.","Comparar o vídeo específico de Sean Osborn co contexto sinfónico completo. Un extracto pode soar correcto illado e quedar fóra de estilo cando se coloca dentro da orquestra."],"score_url":"https://imslp.org/wiki/Daphnis_et_Chlo%C3%A9%2C_M.57_%28Ravel%2C_Maurice%29","score_note":"IMSLP: partitura completa e materiais de Daphnis et Chloé. Para requinto, as pp. 34–35 do EP8661 son a referencia da programación. As delimitacións profesionais varían bastante, polo que convén preparar o núcleo e as extensións indicadas.","recording":"London Symphony Orchestra · Sir Simon Rattle · Daphnis et Chloé, Suite n.º 2; apoio específico: Sean Osborn, solo de requinto.","recording_url":"https://www.youtube.com/watch?v=IlENd0p6aR4","recording_note":"Para o pequeno solo de Mi♭ de Lever du jour hai un vídeo pedagóxico específico de Sean Osborn nas fontes. Para [200] e [214], localizar por números de ensaio na gravación completa.","sources":[["Aspen Music Festival 2026/27: Daphnis para 2.º/Mi♭, [157]–[161], [200]–despois de [203] e [214]–despois de [220]","https://www.aspenmusicfestival.com/students-welcome/admissions/programs-of-study/orchestra-instrumental/clarinet"],["Orquestra Sinfônica Brasileira 2026: Daphnis [200]–antes de [204] e [
