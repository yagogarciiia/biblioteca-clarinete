"':'&quot;',"'":'&#39;'}[c]))}function link(u,label){return u?`<a target="_blank" rel="noopener noreferrer" href="${esc(u)}">${esc(label)}</a>`:''}function renderMaterials(ms){if(!ms||!ms.length)return '';let icons={pdf:'📄',score:'🎼',book:'📚',web:'↗'};return `<div class="materialbox"><div class="materialtitle">Material de estudo</div>${ms.map(m=>`<div class="matrow"><span class="matbadge">${esc(m.coverage||'Recurso')}</span>${m.url?`<a target="_blank" rel="noopener noreferrer" href="${esc(m.url)}">${icons[m.type]||'↗'} ${esc(m.label)}</a>`:`<strong>${esc(m.label)}</strong>`}${m.source?`<span class="matsource">· ${esc(m.source)}</span>`:''}${m.note?`<div class="matnote">${esc(m.note)}</div>`:''}</div>`).join('')}</div>`}function results(){let q=$('search').value.toLocaleLowerCase();let list=records.filter(r=>(!q||JSON.stringify([r.composer,r.work,r.instrument,r.excerpts]).toLocaleLowerCase().includes(q))&&(!$('course').value||r.course==$('course').value)&&(!$('quarter').value||r.quarter==$('quarter').value)&&(!$('instrument').value||r.instrument==$('instrument').value)&&(!$('status').value||($('status').value==='documentada')===r.status.startsWith('Ficha')));$('count').textContent=`${list.length} entradas · ${records.filter(x=>x.status.startsWith('Ficha')).length} fichas revisadas/documentadas`; $('results').innerHTML=list.map(r=>`<button class="item ${r.id===active?'active':''}" onclick="openItem('${r.id}')"><span class="mini">${r.course}.º · C${r.quarter} · ${esc(r.instrument)}</span><strong>${esc(r.work)}</strong><span class="mini">${esc(r.composer)}</span> ${r.status.startsWith('Ficha')?'<span class="pill ok">Documentada</span>':''}</button>`).join('')||'<p>Sen resultados</p>'}function openItem(id){active=id;let r=records.find(x=>x.id===id);let learned=r.status.startsWith('Ficha');let key='clarinete-note-'+r.id;let saved='';try{saved=localStorage.getItem(key)||''}catch(e){}let initials=esc(r.composer.split(' ').map(w=>w[0]).slice(0,2).join(''));let portrait=`<div><div class="portrait" aria-label="Retrato de ${esc(r.composer)}"><span>${initials}</span>${r.portrait_url?`<img src="${esc(r.portrait_url)}" alt="Retrato de ${esc(r.composer)}" onerror="this.style.display='none'">`:''}</div>${r.portrait_credit?`<div class="portrait-credit">${r.portrait_source?`<a target="_blank" rel="noopener noreferrer" href="${esc(r.portrait_source)}">${esc(r.portrait_credit)}</a>`:esc(r.portrait_credit)}</div>`:''}</div>`;let facts=[['Época',r.period],['Xénero',r.genre],['Data',r.year],['Estrutura',r.work_structure]].filter(x=>x[1]).map(x=>`<div class="fact"><b>${esc(x[0])}</b>${esc(x[1])}</div>`).join('');$('detail').innerHTML=`<div class="top">${portrait}<div><span class="pill">${r.course}.º curso · Cuadrimestre ${r.quarter}</span><h2>${esc(r.work)}</h2><div class="lead">${esc(r.composer)} · ${esc(r.instrument)}</div><div class="meta"><span class="pill">Probespiel: ${esc(r.probespiel==='—'?'non localizado':('pp. '+r.probespiel))}</span><span class="pill ${learned?'ok':''}">${learned?'Ficha revisada':'Ficha pendente'}</span></div></div></div>${learned?`<p class="lead">${esc(r.summary)}</p>${facts?`<div class="factgrid">${facts}</div>`:''}<h3>O compositor</h3><div class="prose">${esc(r.composer_bio)}</div><h3>Contexto da obra</h3><div class="prose">${esc(r.work_context)}</div>${r.influences?`<h3>Influencias e claves de composición</h3><div class="prose">${esc(r.influences)}</div>`:''}<h3>Extractos e papel do clarinete</h3><div class="materiallegend"><b>Material de estudo:</b> nos pasaxes fóra do Probespiel engádese a mellor fonte dispoñible. <b>PDF / extracto exacto</b> = partitura do corte; <b>partitura completa</b> = cómpre localizar as marcas indicadas; <b>referencia impresa</b> = colección comercial (McGinnis/Hadcock) citada sen reproducir as súas páxinas.</div>${r.excerpts.map(e=>`<section class="excerpt"><h4>${esc(e.name)}</h4><p><strong>Localización:</strong> ${esc(e.location)}</p>${e.context?`<div class="contextbox"><strong>Contexto dentro da obra:</strong> ${esc(e.context)}</div>`:''}<p><strong>Papel do clarinete:</strong> ${esc(e.role)}</p><p><strong>Traballo técnico e interpretativo:</strong> ${esc(e.technique)}</p><span class="pill">Probespiel: ${esc(e.pages)}</span>${renderMaterials(e.materials)}${e.recording_url?`<p><strong>Gravación de referencia:</strong> <a target="_blank" rel="noopener noreferrer" href="${esc(e.recording_url)}">${esc(e.recording||'Abrir gravación')}</a></p>`:''}${e.recording_locator?`<div class="locator"><strong>Como localizar o solo:</strong> ${esc(e.recording_locator)}</div>`:''}</section>`).join('')}<h3>Ideas para a aula</h3><ol class="study">${r.study.map(t=>`<li>${esc(t)}</li>`).join('')}</ol>`:`<div class="note">A entrada figura na programación, pero aínda non ten unha ficha histórica e interpretativa contrastada. Mantemos o índice completo sen inventar o movemento nin os pasaxes.</div>`}<h3>Partitura e gravación xeral</h3><div class="links">${link(r.score_url,'Partitura en IMSLP')}${r.recording_url?link(r.recording_url,'Gravación de referencia'):''}</div><p class="mini">${esc(r.score_note)}</p>${r.recording?`<p class="prose"><b>Escoita xeral:</b> ${esc(r.recording)}<br><span class="warn">${esc(r.recording_note)}</span></p>`:''}${r.sources.length?`<h3>Fontes contrastadas</h3><div class="sources">${r.sources.map(s=>link(s[1],s[0])).join('')}</div>`:''}<h3>As miñas anotacións</h3><p class="mini">Gárdanse no navegador deste ordenador. Exporta unha copia de seguridade cando remates.</p><textarea id="note" placeholder="Dixitacións, indicacións de clase, referencias, dificultades…">${esc(saved)}</textarea><div class="actions"><button onclick="saveNote()">Gardar nota</button><button onclick="exportNotes()">Exportar todas as notas</button><button onclick="$('importer').click()">Importar copia de notas</button><input id="importer" type="file" accept="application/json" style="display:none" onchange="importNotes(event)"></div><div class="count" id="saved"></div>`;results()};function saveNote(){try{localStorage.setItem('clarinete-note-'+active,$('note').value);$('saved').textContent='Nota gardada neste navegador.'}catch(e){$('saved').textContent='Este navegador non permite gardar notas en ficheiros locais. Copia o texto ou usa a exportación.'}}function exportNotes(){let notes={};records.forEach(r=>{try{let v=localStorage.getItem('clarinete-note-'+r.id);if(v)notes[r.id]=v}catch(e){}});let blob=new Blob([JSON.stringify({version:1,notes},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='notas_biblioteca_clarinete.json';a.click();URL.revokeObjectURL(a.href)}function importNotes(e){let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let obj=JSON.parse(reader.result),notes=obj.notes||{};Object.entries(notes).forEach(([k,v])=>{if(records.some(r=>r.id===k))localStorage.setItem('clarinete-note-'+k,String(v))});openItem(active)}catch(e){alert('Non se puido importar o arquivo.')} };reader.readAsText(file)}['search','course','quarter','instrument','status'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',results));openItem(active);
</script><script>
(function(){
  const byId=id=>document.getElementById(id);
  const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;
  function updateNetworkState(){
    const state=byId('netState'), label=byId('netLabel');
    if(!state||!label)return;
    const online=navigator.onLine;
    state.classList.toggle('offline',!online);
    label.textContent=online?'En liña':'Sen conexión';
  }
  window.addEventListener('online',updateNetworkState);
  window.addEventListener('offline',updateNetworkState);
  updateNetworkState();

  byId('goList')?.addEventListener('click',()=>document.querySelector('.sidebar')?.scrollIntoView({behavior:'smooth',block:'start'}));
  byId('goFicha')?.addEventListener('click',()=>byId('detail')?.scrollIntoView({behavior:'smooth',block:'start'}));

  byId('refreshApp')?.addEventListener('click',async()=>{
    const btn=byId('refreshApp');
    if(btn){btn.disabled=true;btn.textContent='Actualizando…';}
    try{
      if('serviceWorker' in navigator){
        const reg=await navigator.serviceWorker.getRegistration();
        if(reg) await reg.update();
      }
    }catch(e){}
    location.reload();
  });

  let deferredInstallPrompt=null;
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;});
  byId('installApp')?.addEventListener('click',async()=>{
    if(isStandalone()){
      alert('A biblioteca xa está instalada como aplicación neste dispositivo.');
      return;
    }
    if(deferredInstallPrompt){
      deferredInstallPrompt.prompt();
      try{await deferredInstallPrompt.userChoice;}catch(e){}
      deferredInstallPrompt=null;
      return;
    }
    alert('En iPad: abre esta páxina en Safari, pulsa Compartir (□↑) → Engadir á pantalla de inicio → Engadir. Se aparece «Abrir como app web», déixao activado.');
  });
})();
</script><script>
(function(){
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./service-worker.js').catch(function(){});
    });
  }
})();
</script></body></html>
