,"https://www.staatsoper.de/en/productions/die-walkuere"],["ABAO Bilbao Opera: estrutura, fontes do libreto e estrea","https://www.abao.org/en/opera/die-walkure/"],["Bayreuther Festspiele: argumento do Acto II e Todesverkündigung","https://www.bayreuther-festspiele.de/fsdb/inszenierungen/die-walkuere/2016/14992/"],["Apple Music Classical: Haitink / Symphonieorchester des Bayerischen Rundfunks","https://classical.music.apple.com/us/recording/richard-wagner-1813-pp37-1615782774?l=es"]],"portrait_url":"https://commons.wikimedia.org/wiki/Special:Redirect/file/Wagner.png","period":"Romanticismo tardío · drama musical wagneriano","genre":"Drama musical / ópera en tres actos, WWV 86B · primeira xornada do Ring","year":"Música: 1854–1856 · estrea: Múnic, 1870","work_structure":"Acto I: Siegmund e Sieglinde / Nothung · Acto II: Wotan, Fricka, Todesverkündigung e morte de Siegmund · Acto III: Cabalgata das valquirias, castigo de Brünnhilde e despedida de Wotan.","influences":"Mitos e poemas xermánicos/nórdicos —Edda, Nibelungenlied e tradicións relacionadas— reelaborados polo propio Wagner dentro do proxecto do Ring. A técnica de leitmotivs permite que a orquestra recorde parentescos, promesas, obxectos e conflitos mesmo cando non se mencionan no texto; por iso a cor do clarinete baixo ten unha función dramática concreta.","portrait_credit":"Richard Wagner, fotografía de 1871 · Wikimedia Commons (dominio público)","portrait_source":"https://commons.wikimedia.org/wiki/File:Wagner.png","reviewed":"2026-10-01"},{"id":"2-1-9","course":2,"quarter":1,"instrument":"Clarinete baixo","composer":"Shostakóvich","work":"Concerto para violín n.º 1","probespiel":"39","status":"Ficha revisada · lista","summary":"Concerto para violín n.º 1 en la menor, op. 77 [99], composto en 1947–1948 para David Oistrakh e estreado en 1955. O extracto de clarinete baixo do II movemento, Scherzo, é un dos pasaxes estándar do repertorio de audición: EP8661 p. 39, desde [23]. A escritura combina virtuosismo, precisión rítmica e unha textura sorprendentemente transparente con frauta e violín solista.","composer_bio":"Dmitri Shostakóvich (1906–1975) foi compositor e pianista soviético, autor de quince sinfonías, quince cuartetos de corda, concertos, óperas, música de cámara e cinema. A súa música combina formas clásicas con cromatismo, sátira, marchas, danzas grotescas, lirismo moi escuro e unha extraordinaria capacidade para transformar materiais simples. A súa carreira estivo condicionada pola política cultural soviética, con períodos de recoñecemento oficial e outros de forte censura.","work_context":"Shostakóvich escribiu o concerto en 1947–1948 pensando en David Oistrakh. A campaña soviética contra o chamado “formalismo” de 1948 fixo que a obra quedase sen estrear durante anos. Despois da morte de Stalin, o concerto puido chegar ao público: Oistrakh estreouno coa Filharmónica de Leningrado e Yevgeny Mravinsky o 29 de outubro de 1955. A obra conserva a designación op. 77, aínda que na súa primeira publicación/estrea circulou tamén como op. 99. Está organizada en catro movementos de disposición lento–rápido–lento–rápido.","excerpts":[{"name":"II. Scherzo · [23]–13 compases despois de [24]","location":"Clarinete baixo en Si♭. EP8661: p. 39. O corte clásico comeza en [23]; varias listas profesionais rematan 13 compases despois de [24] (ou 3 antes de [25]). Outras audicións amplían o mesmo pasaxe ata 6 compases antes de [27].","context":"O Scherzo é unha danza frenética, cortante e irónica. Neste punto a textura adelgaza de maneira extrema: frauta e clarinete baixo dialogan sobre intervencións do violín solista, de modo que cada ataque e cada desaxuste de afinación quedan completamente expostos.","role":"Dúo virtuoso coa frauta e contrapeso tímbrico do violín solista. A parte debe soar áxil e case ingrávida malia o rexistro grave: non convén tocar o forte escrito cun peso que cubra a frauta.","technique":"Dominio absoluto das dixitacións graves, coordinación coa frauta, articulación limpa, acentos claros e estabilidade do pulso. A literatura especializada recomenda priorizar limpeza e lixeireza antes ca forzar o tempo; a edición marca Allegro a negra con punto = 126.","pages":"EP8661: p. 39","recording":"David Oistrakh · Leningrad Philharmonic · Yevgeny Mravinsky · gravación de 1956","recording_url":"https://www.youtube.com/watch?v=kqjxlpzfND0","recording_locator":"A gravación completa ten capítulos: o II. Scherzo comeza exactamente en 12:04. Desde aí, seguir a marca [23] na partitura para localizar o solo; é a referencia segura nesta versión."},{"name":"II. Scherzo · continuación ata [26] / segundo bloque frecuente de audición","location":"Moitas probas actuais non se deteñen tras [24] e piden un corte continuo desde [23] ata 6 compases antes de [27] (por exemplo NY Philharmonic e Milwaukee Symphony). Isto obriga a preparar tamén o material que pasa por [25] e [26], non só o fragmento curto impreso como referencia habitual.","context":"O Scherzo mantén a súa enerxía grotesca e o clarinete baixo segue cambiando rapidamente entre función solista, diálogo coas madeiras e integración no tutti.","role":"A dificultade xa non é só “facer o solo”: hai que conservar a mesma precisión e carácter cando a textura se densifica e cando cambia a relación co violín solista e o resto das madeiras.","technique":"Resistencia, continuidade de articulación, cambio rápido de rexistros e capacidade de contar longos bloques sen perder a subdivisión. Practicar a entrada en [23], pero tamén arrancar directamente en [25]/[26] para estar preparado para cortes diferentes.","pages":"EP8661: p. 39 como núcleo; extensión segundo lista de audición","recording":"David Oistrakh · Leningrad Philharmonic · Yevgeny Mravinsky · 1956","recording_url":"https://www.youtube.com/watch?v=kqjxlpzfND0","recording_locator":"II. Scherzo desde 12:04. Usar as marcas [25] e [26] para seguir a continuación; non se fixa un minuto inventado porque a referencia de ensaio é inequívoca."}],"study":["Aprender primeiro as dixitacións do rexistro grave ata que non haxa ningunha dúbida mecánica; só despois subir o tempo.","Practicar con metrónomo por células pequenas e combinar 2+2 ou 4+4 compases para evitar que a tensión aumente ao longo do fragmento.","Ensaiar a dúo coa frauta cando sexa posible: a afinación, articulación e sensación de lixeireza son parte esencial do pasaxe.","Gravarse a un tempo lixeiramente inferior ao marcado e comprobar se todos os acentos e ataques se entenden; a limpeza é prioritaria.","Preparar polo menos dúas lonxitudes: [23]–13 despois de [24] e a versión longa [23]–6 antes de [27]."],"score_url":"https://imslp.org/wiki/Violin_Concerto_No.1%2C_Op.77_%28Shostakovich%2C_Dmitry%29","score_note":"IMSLP documenta os catro movementos, a instrumentación con 3.º clarinete dobrando clarinete baixo e a estrea con Oistrakh/Mravinsky.","recording":"David Oistrakh · Leningrad Philharmonic Orchestra · Yevgeny Mravinsky · 1956 (gravación histórica de referencia, remasterizada).","recording_url":"https://www.youtube.com/watch?v=kqjxlpzfND0","recording_note":"O vídeo inclúe capítulos exactos: I 0:00 · II Scherzo 12:04 · III 18:28 · IV 31:56. Para o solo de baixo úsanse [23], [24], [25] e [26] como localizadores internos.","sources":[["Boston Symphony Orchestra: xénese, censura, Oistrakh, estrea e carácter do Scherzo","https://www.bso.org/works/shostakovich-violin-concerto-no-1"],["IMSLP: Violin Concerto No. 1, op. 77 · estrutura e instrumentación","https://imslp.org/wiki/Violin_Concerto_No.1%2C_Op.77_%28Shostakovich%2C_Dmitry%29"],["OFGC: Orchester-Probespiel, II Scherzo, p. 39","https://api.ofgrancanaria.com/storage/6842/g6WwBHfD8aApPbRiVOtG.pdf"],["York Symphony: [23]–13 compases despois de [24]","https://yorksymphony.org/wp-content/uploads/2025/08/Bass-Clarinet-Clarinet-3-Audition-Oct-4-Season-93.pdf"],["New York Philharmonic: versión longa [23]–6 antes de [27]","https://res.cloudinary.com/nyphil/image/upload/v1676992941/pdfs/auditions/23/2023-EXCERPTS-Preliminary-Bass-Clarinet.pdf"],["Milwaukee Symphony: [23]–6 antes de [27]","https://www.mso.org/app/uploads/2024/03/Clarinet-BassUtility-Aud-Excerpts-May-2024.pdf"],["Connor O’Meara, UNT: análise técnica do extracto [23]–[25]","https://digital.library.unt.edu/ark:/67531/metadc984170/m1/131/"],["The Clarinet / Bass Clarinetist’s Workbook: importancia do fragmento no repertorio profesional","https://clarinet.insightful.design/wp-content/uploads/2022/10/VOL39N2MARCH2012.pdf"],["YouTube: Oistrakh / Mravinsky 1956, coa división por movementos","https://www.youtube.com/watch?v=kqjxlpzfND0"]],"portrait_url":"https://commons.wikimedia.org/wiki/Special:Redirect/file/Dmitri-Shostakovich-1958.jpg","period":"Século XX · modernismo soviético","genre":"Concerto para violín e orquestra en catro movementos, op. 77 [99]","year":"1947–1948 · estrea: Leningrado, 1955","work_structure":"I Nocturne (Moderato) · II Scherzo (Allegro) · III Passacaglia (Andante) + Cadenza · IV Burlesque (Allegro con brio).","influences":"O concerto foi escrito para a personalidade musical e o virtuosismo de David Oistrakh. O Scherzo introduce o motivo DSCH, sinatura musical de Shostakóvich, e inclúe material de danza de carácter acerado e grotesco. O contexto da campaña cultural de 1948 explica que a obra quedase gardada ata que as condicións políticas permitiron a súa estrea.","portrait_credit":"Dmitri Shostakóvich en Finlandia (1958), Holger Eklund · Wikimedia Commons (dominio público en Finlandia)","portrait_source":"https://commons.wikimedia.org/wiki/File:Dmitri-Shostakovich-1958.jpg","reviewed":"2026-10-01"},{"id":"2-2-10","course":2,"quarter":2,"instrument":"Clarinete en Si♭ e La","probespiel":"9","composer":"Kodály","work":"Danzas de Galánta","status":"Ficha revisada · lista","summary":"Suite orquestral de 1933 inspirada en melodías húngaras asociadas a Galánta e construída sobre o modelo do verbunkos. O clarinete principal é decisivo desde a introdución: unha cadencia improvisatoria conduce ao primeiro gran tema e, preto do final, reaparece nun pasaxe rápido moi exposto. Son dous cortes clásicos de audición.","period":"Século XX · nacionalismo húngaro","genre":"Danzas orquestrais / suite de danzas","year":"1933","work_structure":"Introdución + sección lenta (lassú) + sucesión de danzas rápidas (friss) + coda, nun único arco continuo.","composer_bio":"Zoltán Kodály (1882–1967) foi compositor, etnomusicólogo e pedagogo húngaro. Xunto con Béla Bartók investigou e recolleu miles de melodías tradicionais, que estudou con criterios científicos e incorporou á súa linguaxe compositiva. A súa música combina raíz popular, contrapunto e unha escritura vocal e instrumental moi clara; a súa actividade pedagóxica deu lugar ao coñecido “método Kodály”, desenvolvido posteriormente a partir dos seus principios educativos.","work_context":"Danzas de Galánta foi encargada en 1933 para o 80.º aniversario da Sociedade Filharmónica de Budapest. Kodály pasara sete anos da súa infancia en Galánta —hoxe en Eslovaquia— e lembraba a banda xitana local como unha das súas primeiras experiencias de son orquestral. Para a obra empregou melodías publicadas arredor de 1800 en Viena e atribuídas a músicos de Galánta. O material articúlase como un verbunkos: unha parte lenta e orgullosa seguida de danzas progresivamente máis vivas.","influences":"O núcleo estilístico procede do verbunkos húngaro e das melodías de Galánta. A investigación folclórica de Kodály e Bartók foi fundamental na súa estética; tamén se recoñece a influencia de Debussy na súa sensibilidade harmónica e tímbrica. Aquí, porén, o folclore non aparece como cita decorativa: determina a forma, os ritmos, a ornamentación e o carácter improvisatorio do clarinete.","excerpts":[{"name":"Cadencia inicial e primeiro tema","location":"Clarinete 1.º en La · compases 31–65. É o corte máis habitual de audición.","context":"Na introdución, despois de fragmentos presentados por cordas e trompa, o clarinete “atopa o camiño”: unha cadencia libre enlaza coa primeira danza lenta, Andante maestoso.","role":"Solista e narrador. O clarinete transforma o material fragmentario previo nun discurso continuo e presenta o carácter do verbunkos con liberdade aparente, pero cun pulso interno moi controlado.","technique":"Liberdade agóxica sen perder estrutura, ornamentación limpa, flexibilidade de aire, homoxeneidade entre rexistros e capacidade de pasar dunha cadencia case improvisada a unha pulsación de danza nobre.","pages":"EP8661 · p. 9","recording":"Neeme Järvi · Chicago Symphony Orchestra (1990)","recording_url":"https://orchestraexcerpts.com/clarinet-kodaly-dances-galanta-31-65-571-579/","recording_locator":"Na páxina de Orchestra Excerpts, primeiro bloque de audio (“Excerpt 1”). A gravación seleccionada de Järvi/Chicago empeza xa no propio extracto; na partitura: cc. 31–65."},{"name":"Pasaxe final rápido","location":"Clarinete 1.º en La · compases 571–579. Segundo corte estándar de audición.","context":"Na fase final do friss, a música xa está lanzada cara á coda. O clarinete aparece nunha textura de enorme enerxía, máis curta pero tecnicamente moi exposta.","role":"Virtuosismo integrado no tutti: debe manter a claridade da liña sen perder o carácter danzable nin o empaste coa orquestra.","technique":"Articulación e dedos a gran velocidade, estabilidade rítmica, acentos precisos, proxección sen dureza e capacidade de entrar “en frío”.","pages":"EP8661 · p. 9","recording":"Neeme Järvi · Chicago Symphony Orchestra (1990)","recording_url":"https://orchestraexcerpts.com/clarinet-kodaly-dances-galanta-31-65-571-579/","recording_locator":"Na mesma páxina, segundo bloque de audio (“Excerpt 2”). A mostra comeza no pasaxe; na partitura: cc. 571–579."}],"study":["Traballar a cadencia primeiro sen metrónomo, decidindo direccións e respiracións; despois comprobar que cada liberdade nace dun pulso claro.","Comparar as gravacións de Järvi, Saccani e Doráti dispoñibles na páxina de extractos: observar canto cambia o grao de rubato sen perder identidade estilística.","No pasaxe final, estudar en células de 2–4 pulsos e reconstruír despois a frase longa; evitar que a velocidade converta o son en percusivo.","Escoitar o comezo completo da obra para entender que a cadencia non aparece illada: responde ao cello, á trompa e aos fragmentos das madeiras."],"score_url":"https://imslp.org/wiki/Dances_of_Gal%C3%A1nta_(Kod%C3%A1ly%2C_Zolt%C3%A1n)","score_note":"IMSLP permite consultar a partitura/edicións dispoñibles segundo os dereitos aplicables. A instrumentación orixinal inclúe dous clarinetes en La.","recording":"Neeme Järvi · Chicago Symphony Orchestra (1990), empregada tamén pola páxina Orchestra Excerpts para os dous cortes.","recording_url":"https://orchestraexcerpts.com/clarinet-kodaly-dances-galanta-31-65-571-579/","recording_note":"A páxina ofrece audios recortados de ambos extractos, polo que non é necesario buscar minutaxes dentro dunha gravación longa.","sources":[["Orchestra Excerpts · Kodály, cc. 31–65 e 571–579","https://orchestraexcerpts.com/clarinet-kodaly-dances-galanta-31-65-571-579/"],["Philharmonia · notas de programa","https://philharmonia-assets.s3.eu-west-1.amazonaws.com/uploads/2025/02/25173035/02.03.25_RFH_online.pdf"],["Filharmonikusok · Dances from Galánta","https://www.filharmonikusok.hu/en/muvek/galantai-tancok/"],["Universal Edition · ficha da obra","https://www.universaledition.com/en/Works/Dances-of-Galanta/P0036660"],["LA Phil · Dances of Galánta","https://www.laphil.com/works/dances-of-galanta"]],"portrait_url":"https://commons.wikimedia.org/wiki/Special:FilePath/Kodály_Zoltán_1930s.jpg?width=500","portrait_credit":"Zoltán Kodály, década de 1930 · Wikimedia Commons","portrait_source":"https://commons.wikimedia.org/wiki/Category:Portrait_photographs_of_Zolt%C3%A1n_Kod%C3%A1ly","reviewed":"2026-10-01"},{"id":"2-2-11","course":2,"quarter":2,"instrument":"Clarinete en Si♭ e La","probespiel":"—","composer":"Ravel","work":"Rapsodia española","status":"Ficha revisada · lista","summary":"Primeira gran obra orquestral de Ravel publicada como tal, composta entre 1907 e 1908. O extracto de clarinete máis habitual aparece no I movemento, Prélude à la nuit, entre [6] e [7]: unha liña contida e tímbrica, máis de control e refinamento que de virtuosismo exterior.","period":"Século XX · modernismo francés / impresionismo","genre":"Rapsodia orquestral en catro movementos","year":"1907–1908","work_structure":"I. Prélude à la nuit · II. Malagueña · III. Habanera · IV. Feria.","composer_bio":"Maurice Ravel (1875–1937) foi un dos grandes compositores franceses do cambio de século. Pianista de formación, destacou pola precisión formal, a refinada harmonía e unha orquestración extraordinariamente transparente. A súa música mantén vínculos co simbolismo e co impresionismo francés, aínda que Ravel conservou sempre unha forte disciplina clásica e un gusto por danzas, mecanismos e formas moi definidas.","work_context":"Rapsodie espagnole foi composta en 1907–08 e estreada en París en marzo de 1908 pola Orchestre Colonne. A obra naceu primeiro para dous pianos e foi despois orquestrada por Ravel. O terceiro movemento, Habanera, é anterior: procede dunha peza para dous pianos de 1895 que Ravel incorporou ao ciclo. Nacido en Ciboure, no País Vasco francés, preto da fronteira española, Ravel sentiu durante toda a vida unha forte atracción por cores e ritmos asociados a España.","influences":"A obra combina a fascinación francesa pola música española coa experiencia persoal de Ravel e coa súa enorme capacidade de orquestración. A Habanera de 1895 mostra que esta inclinación é moi anterior á rapsodia completa. No Prélude à la nuit predomina unha estética de suxestión: ostinatos, timbres velados e unha célula descendente que crea unha atmosfera nocturna, máis próxima á evocación que á descrición literal.","excerpts":[{"name":"I. Prélude à la nuit","location":"Clarinete(s) en Si♭ · [6]–[7]. Nas listas de 1.º clarinete adoita tocarse a liña superior; tamén se emprega como extracto de 2.º clarinete.","context":"O primeiro movemento mantense nunha atmosfera nocturna e contida. Entre [6] e [7] o clarinete emerxe dentro dunha textura moi transparente, rodeado por cordas con sordina e outras madeiras.","role":"Cor solista dentro da textura: non é un “solo de concerto”, senón unha proba de control, afinación, timbre e capacidade de integrar unha liña expresiva nunha orquestración delicadísima.","technique":"Ataques suaves, afinación estable, legato, control do aire a dinámica baixa e capacidade de manter dirección musical sen sobreactuar. Importa moito escoitar a segunda voz cando se traballa en sección.","pages":"Non figura en EP8661","recording":"Pierre Boulez · Berliner Philharmoniker","recording_url":"https://orchestraexcerpts.com/clarinet-ravel-rapsodie-espagnole-mvt-reh-6-7/","recording_locator":"A páxina Orchestra Excerpts está dedicada exactamente a [6]–[7] e permite escoitar, entre outras, a versión Boulez/Berliner. Así o alumno localiza o pasaxe sen buscar un minuto nunha obra de 15–17 minutos.","materials":[{"type":"pdf","label":"PDF · [6]–[7]","url":"https://peabody.jhu.edu/wp-content/uploads/2018/05/PLEA-2018-Clarinet-Excerpts-Book.pdf","source":"Peabody Conservatory","note":"O paquete imprime o corte de Rapsodie espagnole [6]–[7].","coverage":"Extracto exacto"},{"type":"score","label":"Abrir partitura / particella","url":"https://imslp.org/wiki/Rapsodie_espagnole%2C_M.54_(Ravel%2C_Maurice)","source":"IMSLP","note":"Partitura/particella completa; localizar o corte coas marcas indicadas na ficha.","coverage":"Partitura completa"}]}],"study":["Tocar primeiro a liña sen vibracións nin rubatos excesivos: buscar continuidade de aire e cor.","Escoitar dúas versións da páxina de extractos (por exemplo Boulez e Haitink) e comparar tempo, dinámica e grao de presenza do clarinete.","Traballar as dúas voces de clarinete se hai dous alumnos: a finalidade é entender o empaste, non só dominar a liña superior.","Escoitar o movemento completo e identificar a célula descendente que vertebra o Prélude à la nuit."],"score_url":"https://imslp.org/wiki/Rapsodie_espagnole%2C_M.54_(Ravel%2C_Maurice)","score_note":"Partitura xeral e materiais dispoñibles en IMSLP segundo xurisdición. Para o extracto, consultar I. Prélude à la nuit, [6]–[7].","recording":"Pierre Boulez · Berliner Philharmoniker (selección proposta dentro de Orchestra Excerpts).","recording_url":"https://orchestraexcerpts.com/clarinet-ravel-rapsodie-espagnole-mvt-reh-6-7/","recording_note":"A páxina contén gravacións recortadas exactamente no extracto [6]–[7].","sources":[["Orchestra Excerpts · Rapsodie espagnole [6]–[7]","https://orchestraexcerpts.com/clarinet-ravel-rapsodie-espagnole-mvt-reh-6-7/"],["Peabody · Clarinet Audition Repertoire 2018","https://peabody.jhu.edu/wp-content/uploads/2018/05/PLEA-2018-Clarinet-Excerpts-Book.pdf"],["IRCAM · Rhapsodie espagnole","https://ressources.ircam.fr/en/work/rhapsodie-espagnole"],["Philharmonie de Paris · Rapsodie espagnole","https://pad.philharmoniedeparis.fr/pad/doc/CIMU/0774414/rapsodie-espagnole?_lg=fr-FR"],["BnF · Habanera de 1895","https://catalogue.bnf.fr/ark:/12148/cb140173860"]],"portrait_url":"https://commons.wikimedia.org/wiki/Special:FilePath/Maurice_Ravel_1925.jpg?width=500","portrait_credit":"Maurice Ravel, 1925 · Bibliothèque nationale de France / Wikimedia Commons","portrait_source":"https://commons.wikimedia.org/wiki/File:Maurice_Ravel_1925.jpg","reviewed":"2026-10-01"},{"id":"2-2-12","course":2,"quarter":2,"instrument":"Clarinete en Si♭ e La","probespiel":"—","composer":"Chaikovski","work":"Sinfonía n.º 5","status":"Ficha revisada · lista","summary":"Sinfonía en mi menor op. 64 (1888) articulada arredor dun motivo cíclico asociado habitualmente á idea de destino. Para clarinete hai dous extractos de audición moi frecuentes: o inicio do I movemento (cc. 1–37) e o vals do III (cc. 98–118).","period":"Romanticismo tardío ruso","genre":"Sinfonía en catro movementos","year":"1888","work_structure":"I. Andante – Allegro con anima · II. Andante cantabile, con alcuna licenza · III. Valse. Allegro moderato · IV. Finale. Andante maestoso – Allegro vivace.","composer_bio":"Piotr Ilich Chaikovski (1840–1893) foi un dos compositores rusos máis influentes do século XIX. Formouse no Conservatorio de San Petersburgo e desenvolveu unha linguaxe que combina tradición formal europea, lirismo operístico, ritmo de danza e unha expresividade moi persoal. A súa produción inclúe seis sinfonías numeradas, ballets como O lago dos cisnes, A bela dormente e O quebranoces, óperas, concertos e música de cámara.","work_context":"Chaikovski escribiu a Quinta en 1888, máis dunha década despois da Cuarta. Nos seus apuntes aparece a idea dunha confrontación co “destino”, e o elemento unificador da sinfonía é un motivo que reaparece transformado nos catro movementos. O compositor dirixiu a estrea en San Petersburgo e inicialmente dubidou do valor da obra; durante a xira europea de 1889 recuperou a confianza nela.","influences":"A sinfonía combina procedementos cíclicos —o mesmo motivo reaparece ao longo da obra— con recursos que Chaikovski dominaba no teatro e no ballet. O III movemento substitúe o scherzo por un vals, e o material lírico ten unha forte cualidade cantabile. A oposición entre marcha, danza e canto é esencial para entender os dous pasaxes de clarinete.","excerpts":[{"name":"I. Andante · motivo inicial","location":"Clarinete 1.º en La · cc. 1–37. Primeiro corte estándar de audición.","context":"A sinfonía abre cunha introdución escura sobre cordas graves. Os clarinetes presentan o motivo cíclico —frecuentemente chamado “motivo do destino”— que regresará nos catro movementos.","role":"O clarinete establece o clima psicolóxico e temático de toda a sinfonía. Debe soar escuro, concentrado e inevitable, máis como unha marcha sombría que como un solo sentimental.","technique":"Son homoxéneo no rexistro grave, afinación entre clarinetes, articulación integrada na frase, control de p/pp e dirección do motivo sen precipitalo.","pages":"Non figura en EP8661","recording":"Sir Georg Solti · Chicago Symphony Orchestra","recording_url":"https://orchestraexcerpts.com/clarinet-tchaikovsky-symphony-no-5-2-excerpts/","recording_locator":"Na páxina Orchestra Excerpts, “Excerpt 1”. O audio recortado comeza exactamente no c. 1, polo que non require minutaxe adicional.","materials":[{"type":"pdf","label":"PDF · I movemento, cc. 1–37","url":"https://maltaorchestra.com/wp-content/uploads/2023/12/5.-Orchestral-Excerpts-Clarinet-Sub-Principal.pdf","source":"Malta Philharmonic Orchestra","note":"Documento oficial de extractos para clarinete; identifica e presenta o inicio da Sinfonía n.º 5.","coverage":"Extracto exacto"},{"type":"score","label":"Abrir partitura / particella","url":"https://imslp.org/wiki/Symphony_No.5%2C_Op.64_(Tchaikovsky%2C_Pyotr_Ilyich)","source":"IMSLP","note":"Partitura/particella completa; localizar o corte coas marcas indicadas na ficha.","coverage":"Partitura completa"},{"type":"book","label":"McGinnis · vol. I","url":"https://www.clarinetallmusic.com/products/clarinet-orchestral-excerpts-vol-1-imc-mcginnis","source":"International Music Company","note":"O volume I inclúe Tchaikovsky Symphony No. 5.","coverage":"Referencia impresa"},{"type":"book","label":"Hadcock · The Working Clarinetist","url":"https://www.clarinetallmusic.com/products/hadcock-the-working-clarinetist-orchestral-excerpts-roncorp-publications","source":"Roncorp Publications","note":"Inclúe Tchaikovsky Symphony No. 5.","coverage":"Referencia impresa"}]},{"name":"III. Valse","location":"Clarinete 1.º en La · cc. 98–118. Segundo corte estándar de audición.","context":"No movemento de vals, Chaikovski traslada ao terreo sinfónico a súa enorme experiencia de ballet. O extracto aparece nun contexto máis lixeiro e móbil que o primeiro movemento.","role":"Axilidade elegante: a escritura debe conservar o carácter de danza e a flexibilidade, aínda que a figuración esixa precisión técnica.","technique":"Regularidade, articulación lixeira, igualdade dos dedos, fraseo en compás ternario e control para non acelerar.","pages":"Non figura en EP8661","recording":"Sir Georg Solti · Chicago Symphony Orchestra","recording_url":"https://orchestraexcerpts.com/clarinet-tchaikovsky-symphony-no-5-2-excerpts/","recording_locator":"Na mesma páxina, “Excerpt 2”, dedicado a cc. 98–118. O recorte de audio permite escoitalo directamente.","materials":[{"type":"pdf","label":"PDF · III movemento · clarinete en La","url":"https://static1.squarespace.com/static/64bd13cbb71948620a6834a4/t/65f21177b8c7f55abccecc69/1710362999829/24-25-SO-excerpts-clarinet.pdf","source":"TCSYO","note":"Material de audición co pasaxe do III movemento; úsase como apoio visual xunto coa localización cc. 98–118 da ficha.","coverage":"Extracto de audición"},{"type":"score","label":"Abrir partitura / particella","url":"https://imslp.org/wiki/Symphony_No.5%2C_Op.64_(Tchaikovsky%2C_Pyotr_Ilyich)","source":"IMSLP","note":"Partitura/particella completa; localizar o corte coas marcas indicadas na ficha.","coverage":"Partitura completa"},{"type":"book","label":"McGinnis · vol. I","url":"https://www.clarinetallmusic.com/products/clarinet-orchestral-excerpts-vol-1-imc-mcginnis","source":"International Music Company","note":"O volume I inclúe Tchaikovsky Symphony No. 5.","coverage":"Referencia impresa"},{"type":"book","label":"Hadcock · The Working Clarinetist","url":"https://www.clarinetallmusic.com/products/hadcock-the-working-clarinetist-orchestral-excerpts-roncorp-publications","source":"Roncorp Publications","note":"Inclúe Tchaikovsky Symphony No. 5.","coverage":"Referencia impresa"}]}],"study":["No primeiro movemento, tocar primeiro ambos clarinetes xuntos se é posible: a calidade do unísono e da afinación é parte do extracto.","Comparar o carácter de marcha do I coa lixeireza de danza do III: son dúas probas estilisticamente opostas dentro da mesma sinfonía.","Escoitar onde reaparece o motivo cíclico nos movementos II, III e IV para comprender a función estrutural do inicio.","No vals, estudar con subdivisión antes de buscar velocidade; o obxectivo é elegancia, non exhibición."],"score_url":"https://imslp.org/wiki/Symphony_No.5%2C_Op.64_(Tchaikovsky%2C_Pyotr_Ilyich)","score_note":"Partitura xeral e particellas en IMSLP. Os cortes empregados aquí son cc. 1–37 do I e cc. 98–118 do III.","recording":"Sir Georg Solti · Chicago Symphony Orchestra, versión proposta na páxina Orchestra Excerpts.","recording_url":"https://orchestraexcerpts.com/clarinet-tchaikovsky-symphony-no-5-2-excerpts/","recording_note":"A páxina separa os dous extractos e inclúe varias interpretacións de referencia.","sources":[["Orchestra Excerpts · Tchaikovsky 5","https://orchestraexcerpts.com/clarinet-tchaikovsky-symphony-no-5-2-excerpts/"],["Excerpts.one · Tchaikovsky 5","https://excerpts.one/instruments/clarinet/tchaikovskyfifth.html"],["Berliner Philharmoniker · notas de programa","https://www.berliner-philharmoniker.de/en/programme-notes/piotr-tchaikovsky-symphony-no-5-in-e-minor-op-64/"],["Bilbao Orkestra Sinfonikoa · La 5ª de Tchaikovsky","https://www.bilbaorkestra.eus/conciertos/la-quinta-de-tchaikovsky/"]],"portrait_url":"https://commons.wikimedia.org/wiki/Special:FilePath/Porträt_des_Komponisten_Pjotr_I._Tschaikowski_(1840-1893)_cropped.jpg?width=500","portrait_credit":"Piotr Ilich Chaikovski, retrato de N. Kuznetsov (1893) · Wikimedia Commons","portrait_source":"https://commons.wikimedia.org/wiki/File:Portr%C3%A4t_des_Komponisten_Pjotr_I._Tschaikowski_(1840-1893)_cropped.jpg","reviewed":"2026-10-01"},{"id":"2-2-13","course":2,"quarter":2,"instrument":"Clarinete en Si♭ e La","probespiel":"28","composer":"Chaikovski","work":"Sinfonía n.º 6 «Patética»","status":"Ficha revisada · lista","summary":"Última sinfonía de Chaikovski, op. 74 (1893), concibida cun “programa secreto” profundamente subxectivo. O Probespiel recolle tres pasaxes do I movemento, todos para clarinete 1.º en La: cc. 54–80, 106–129 e 153–160.","period":"Romanticismo tardío ruso","genre":"Sinfonía en catro movementos","year":"1893","work_structure":"I. Adagio – Allegro non troppo · II. Allegro con grazia · III. Allegro molto vivace · IV. Finale: Adagio lamentoso.","composer_bio":"Piotr Ilich Chaikovski (1840–1893) combinou formación académica occidental coa intensidade melódica e dramática da tradición rusa. Foi compositor de sinfonías, óperas, concertos e tres ballets fundamentais. A súa escritura destaca pola capacidade de converter a melodía e o ritmo de danza en arquitectura sinfónica e por un uso moi persoal da orquestra como vehículo emocional.","work_context":"A Sexta foi composta en 1893 e dedicada ao seu sobriño Vladimir “Bob” Davydov. Chaikovski escribiu que a obra tiña un programa, pero que debía permanecer como enigma para o público; tamén describiu o proceso como especialmente subxectivo e emotivo. A forma é deliberadamente pouco convencional: despois dun scherzo-marcha aparentemente triunfal, a sinfonía remata cun Adagio lamentoso que se extingue en lugar de ofrecer un final brillante.","influences":"O propio compositor falou dunha “sinfonía a programa” cuxo argumento non quería revelar. Bosquexos anteriores dunha sinfonía chamada “Vida” e as súas cartas mostran o interese por unha traxectoria existencial, pero non existe unha clave narrativa única autorizada. Para interpretar os extractos convén evitar lecturas biográficas demasiado literais e centrarse na tensión formal do primeiro movemento: transición, tema lírico e disolución da exposición.","excerpts":[{"name":"I. Allegro non troppo · pasaxe 1","location":"Clarinete 1.º en La · cc. 54–80.","context":"Dentro da zona de transición do primeiro movemento, o clarinete participa nun discurso cada vez máis inquieto e flexible, que conecta o primeiro complexo temático co material máis lírico.","role":"Voz de enlace e tensión: combina lirismo con movemento interno e debe integrarse con outras madeiras sen perder identidade.","technique":"Cambios de dinámica, fraseo longo, flexibilidade de tempo controlada e igualdade entre rexistros.","pages":"EP8661 · p. 28","recording":"Herbert von Karajan · Berliner Philharmoniker","recording_url":"https://orchestraexcerpts.com/clarinet-tchaikovsky-symphony-no-6-mvt-3-excerpts/","recording_locator":"Na páxina Orchestra Excerpts, “Excerpt 1” (cc. 54–80). O audio recortado empeza no propio pasaxe."},{"name":"I. Allegro non troppo · pasaxe 2","location":"Clarinete 1.º en La · cc. 106–129.","context":"Pertence á ampla segunda zona temática, máis cantabile e vulnerable. A escritura pide unha transformación inmediata do son respecto do material máis tenso anterior.","role":"Cantabile solista dentro dunha textura delicada: a prioridade é soste-lo arco melódico e a afinación, non exhibir volume.","technique":"Legato, control de p/pp, respiración planificada, afinación interválica e flexibilidade expresiva sen romper o pulso.","pages":"EP8661 · p. 28","recording":"Herbert von Karajan · Berliner Philharmoniker","recording_url":"https://orchestraexcerpts.com/clarinet-tchaikovsky-symphony-no-6-mvt-3-excerpts/","recording_locator":"Na mesma páxina, “Excerpt 2” (cc. 106–129)."},{"name":"I. Allegro non troppo · pasaxe 3","location":"Clarinete 1.º en La · cc. 153–160.","context":"Está no final da exposición, cando a música se vai apagando antes da explosión do desenvolvemento. A sensación é de suspensión e máxima contención.","role":"Cor exposta en dinámica extrema. A liña debe conservar sostén e intención incluso cando o volume é mínimo.","technique":"Ataque e emisión en pp/ppp, control de aire, afinación e estabilidade rítmica. O silencio posterior forma parte do efecto expresivo.","pages":"EP8661 · p. 28","recording":"Herbert von Karajan · Berliner Philharmoniker","recording_url":"https://orchestraexcerpts.com/clarinet-tchaikovsky-symphony-no-6-mvt-3-excerpts/","recording_locator":"Na páxina, “Excerpt 3” (cc. 153–160). É tamén un corte habitual en audicións como EUYO/UBC."}],"study":["Preparar os tres extractos como un pequeno percorrido dramático: transición, canto e disolución.","Practicar o terceiro pasaxe desde silencio real, sen “preparar” o son cun ataque audible; gravarse para comprobar estabilidade a dinámica mínima.","Escoitar o primeiro movemento completo e localizar os cc. 54, 106 e 153 para comprender a súa posición dentro da forma sonata.","Comparar dúas gravacións da páxina de extractos: Karajan e Markevitch ofrecen enfoques moi distintos de tempo e intensidade."],"score_url":"https://imslp.org/wiki/Symphony_No.6_%28Tchaikovsky%2C_Pyotr_Ilyich%29","score_note":"IMSLP ofrece partitura e particellas. Os tres cortes documentados son cc. 54–80, 106–129 e 153–160 do I movemento.","recording":"Herbert von Karajan · Berliner Philharmoniker, seleccionada entre as gravacións da páxina Orchestra Excerpts.","recording_url":"https://orchestraexcerpts.com/clarinet-tchaikovsky-symphony-no-6-mvt-3-excerpts/","recording_note":"Os tres fragmentos aparecen separados e con audio recortado, o que facilita a localización exacta.","sources":[["Orchestra Excerpts · Tchaikovsky 6, tres extractos","https://orchestraexcerpts.com/clarinet-tchaikovsky-symphony-no-6-mvt-3-excerpts/"],["Excerpts.one · Tchaikovsky 6","https://excerpts.one/instruments/clarinet/tchaikovskysixth.html"],["Tchaikovsky Research · carta sobre o “programa secreto”","https://en.tchaikovsky-research.net/pages/Letter_4865"],["Philharmonie de Paris · Symphonie n.º 6","https://pad.philharmoniedeparis.fr/0789175-symphonie-n-6-pathetique-de-piotr-ilitch-tchaikovski.aspx?_lg=fr-FR"],["BU Tanglewood · repertorio de clarinete 2026","https://www.bu.edu/cfa/tanglewood/admissions/"]],"portrait_url":"https://commons.wikimedia.org/wiki/Special:FilePath/Porträt_des_Komponisten_Pjotr_I._Tschaikowski_(1840-1893)_cropped.jpg?width=500","portrait_credit":"Piotr Ilich Chaikovski, retrato de N. Kuznetsov (1893) · Wikimedia Commons","portrait_source":"https://commons.wikimedia.org/wiki/File:Portr%C3%A4t_des_Komponisten_Pjotr_I._Tschaikowski_(1840-1893)_cropped.jpg","reviewed":"2026-10-01"},{"id":"2-2-14","course":2,"quarter":2,"instrument":"Clarinete en Si♭ e La","probespiel":"18","composer":"Prokófiev","work":"Pedro e o lobo","status":"Ficha revisada · lista","summary":"Conto sinfónico op. 67 (1936) para narrador e orquestra. Cada personaxe está asociado a un instrumento e un tema; o clarinete representa o gato. O extracto de audición máis estandarizado é [20]–[21], incluído tamén no Probespiel.","period":"Século XX · neoclasicismo / música soviética","genre":"Conto sinfónico para narrador e orquestra","year":"1936","work_structure":"Forma narrativa continua: presentación de personaxes e temas → aparición do lobo → captura → marcha final.","composer_bio":"Serguéi Prokófiev (1891–1953) foi pianista e compositor ruso/soviético, autor dunha linguaxe marcada por ritmo incisivo, harmonía mordaz, lirismo directo e unha forte inclinación teatral. Tras anos de carreira internacional regresou de maneira estable á Unión Soviética na década de 1930. Escribiu ballets, óperas, sinfonías, concertos e música para cinema, e cultivou tamén obras pensadas para públicos novos.","work_context":"En 1936, pouco despois do regreso de Prokófiev á URSS, Natalia Sats —directora do Teatro Infantil Central de Moscova— propúxolle unha obra que introducise aos nenos nos instrumentos da orquestra. Prokófiev escribiu rapidamente o relato e a música. Cada personaxe recibe un timbre propio: frauta = paxaro, oboe = pato, clarinete = gato, fagot = avó, trompas = lobo, cordas = Pedro e percusión/metais = cazadores.","influences":"A obra nace dunha intención pedagóxica, pero a caracterización instrumental é plenamente teatral: pequenos leitmotivs, xestos rítmicos e rexistros específicos fan que o timbre conte a historia. O clarinete explota especialmente a capacidade de ser flexible, furtivo e cómico, asociada ao movemento do gato.","excerpts":[{"name":"Tema do gato · extracto principal de audición","location":"Clarinete en La (ou Si♭ segundo a edición/transposición) · [20]–[21]. É o corte usado de forma recorrente en audicións profesionais e educativas.","context":"Na escena coa chegada do lobo, o gato reacciona de maneira nerviosa e trepa á árbore. A música deixa de ser só presentación de personaxe e pasa a formar parte da acción dramática.","role":"O clarinete “interpreta” ao gato: furtivo, áxil, nervioso e moi caracterizado. O fraseo debe soar teatral e espontáneo, non como un estudo mecánico.","technique":"Articulación rápida, cambios de dinámica e carácter, aceleracións/retencións escritas, coordinación en rexistros diferentes e precisión rítmica con liberdade dramática.","pages":"EP8661 · p. 18","recording":"Claudio Abbado · Chamber Orchestra of Europe · Sting, narrador (DG)","recording_url":"https://www.deutschegrammophon.com/en/catalogue/products/prokofiev-peter-und-der-wolf-abbado-sting-1239","recording_locator":"Usar a sección/pista do episodio “No sooner had Peter gone, than a big grey wolf came…”. Dentro dela, seguir a marca [20]–[21] na partitura: é a reacción nerviosa do gato ante o lobo. A referencia de ensaio é máis segura que un minutaxe universal porque as edicións con narrador cambian os tempos."}],"study":["Antes de tocar, ler a narración correspondente: entender exactamente que está facendo o gato en [20]–[21].","Practicar primeiro o ritmo falado ou silbado, mantendo os cambios de carácter; engadir despois as dificultades de dedos.","Comparar unha versión con narrador e outra puramente orquestral: comprobar como a narración modifica a percepción do tempo sen cambiar a función dramática.","Se o alumno dispón de clarinete en La e Si♭, probar ambas versións/transposicións para comprender as edicións existentes."],"score_url":"https://imslp.org/wiki/Peter_and_the_Wolf%2C_Op.67_%28Prokofiev%2C_Sergey%29","score_note":"IMSLP inclúe unha particella de clarinete en La de 10 páxinas (edición moderna) e materiais segundo xurisdición. O corte de audición máis habitual é [20]–[21].","recording":"Claudio Abbado · Chamber Orchestra of Europe · Sting, narrador · Deutsche Grammophon.","recording_url":"https://www.deutschegrammophon.com/en/catalogue/products/prokofiev-peter-und-der-wolf-abbado-sting-1239","recording_note":"A edición DG está dividida por episodios narrativos; para o solo, entrar no episodio da chegada do lobo e seguir [20]–[21] na partitura.","sources":[["BU Tanglewood · repertorio 2026: Prokófiev [20]–[21]","https://www.bu.edu/cfa/tanglewood/admissions/"],["Baltimore Symphony Youth · extracto [20]–[21]","https://s3.us-east-2.amazonaws.com/umb-media-library/media/1162612/bso-second-clarinet-audition-packet.pdf"],["IMSLP · Peter and the Wolf","https://imslp.org/wiki/Peter_and_the_Wolf%2C_Op.67_%28Prokofiev%2C_Sergey%29"],["Mariinsky · contexto da obra","https://www.mariinsky.ru/en/playbill/playbill/2016/3/26/3_1400/"],["Deutsche Grammophon · Abbado/Sting","https://www.deutschegrammophon.com/en/catalogue/products/prokofiev-peter-und-der-wolf-abbado-sting-1239"]],"portrait_url":"https://commons.wikimedia.org/wiki/Special:FilePath/Sergei_Prokofiev_02.jpg?width=500","portrait_credit":"Serguéi Prokófiev, ca. 1918 · Library of Congress / Wikimedia Commons","portrait_source":"https://commons.wikimedia.org/wiki/File:Sergei_Prokofiev_02.jpg","reviewed":"2026-10-01"},{"id":"2-2-15","course":2,"quarter":2,"instrument":"Clarinete en Si♭ e La","probespiel":"4–5","composer":"Borodín","work":"O príncipe Ígor · Danzas polovtsianas","status":"Ficha revisada · lista","summary":"O material de clarinete asociado a El príncipe Ígor no repertorio de audición procede fundamentalmente das Danzas polovtsianas. Hai dous extractos clásicos: n.º 8, comezo–[B], e n.º 17, Allegro vivo despois de [B] ata seis compases despois de [D]. O Probespiel ocupa as pp. 4–5.","period":"Romanticismo ruso · nacionalismo","genre":"Ópera histórica; extractos das Danzas polovtsianas","year":"1869–1887 (obra incompleta á morte do compositor)","work_structure":"Ópera composta de maneira intermitente durante case vinte anos. As Danzas polovtsianas forman un gran bloque coral e de danza asociado á corte do Khan Konchak.","composer_bio":"Aleksandr Borodín (1833–1887) foi compositor e científico ruso: médico de formación e profesor de química, desenvolveu a composición en paralelo á súa carreira académica. Formou parte de “Os Cinco” xunto con Balákirev, Cui, Mussorgski e Rimski-Kórsakov. A súa música destaca por melodías amplas, cor orquestral e unha visión nacional rusa que convive co gusto decimonónico polo exotismo.","work_context":"Borodín comezou El príncipe Ígor en 1869 sobre A canción da campaña de Ígor, epopea medieval rusa. Traballou na ópera de maneira irregular ata morrer en 1887, polo que quedou incompleta; Rimski-Kórsakov e Glazunov prepararon unha versión interpretable e completaron partes da obra. As Danzas polovtsianas, que Borodín si chegou a desenvolver e orquestrar en boa medida, convertéronse nunha das seccións máis coñecidas e independentes do título.","influences":"A ópera participa do proxecto nacionalista de “Os Cinco”, pero as escenas polovtsianas tamén empregan o orientalismo típico do século XIX para representar un “Outro” exótico. Hoxe convén contextualizar esa mirada historicamente. Musicalmente, as danzas mesturan melodías cantabile, ostinatos, percusión e cambios súbitos de carácter; o clarinete pasa de liñas áxiles e lixeiras a pasaxes rítmicos de gran enerxía.","excerpts":[{"name":"N.º 8 · Danza das doncelas polovtsianas","location":"Clarinete 1.º en Si♭ · comezo ata [B]. Tamén aparece en listas como cc. 5–20 segundo numeración editorial.","context":"É unha danza breve e áxil dentro da gran escena polovtsiana. A textura é lixeira e móbil, cunha forte sensación de danza e carácter “exótico” segundo a estética rusa do século XIX.","role":"O clarinete participa nun primeiro plano melódico e ornamental: precisión e elegancia deben convivir con lixeireza.","technique":"Articulación clara, agilidade, pulso estable e capacidade de manter o carácter danzable sen acelerar.","pages":"EP8661 · pp. 4–5","recording":"Valery Gergiev · Mariinsky Theatre Orchestra (1993)","recording_url":"https://www.youtube.com/watch?v=37eZJxF3XKo","recording_locator":"Na partitura/índice das danzas buscar o N.º 8; o corte é desde o comezo do número ata [B]. Esta numeración é a referencia máis segura para localizar o solo na gravación completa."},{"name":"N.º 17 · Allegro vivo","location":"Clarinete 1.º en Si♭ · despois de [B] ata 6 compases despois de [D]. Algunhas listas subdividen o n.º 17 en varios cortes máis curtos.","context":"No gran n.º 17 a escena alcanza unha enerxía moito maior. O clarinete entra nunha danza colectiva de pulso incisivo e textura brillante.","role":"Virtuosismo rítmico dentro da masa orquestral. O reto é ser audible e exacto sen transformar a liña nunha sucesión de acentos duros.","technique":"Velocidade, claridade de articulación, acentos, control do aire e precisión ao encaixar co resto das madeiras.","pages":"EP8661 · pp. 4–5","recording":"Valery Gergiev · Mariinsky Theatre Orchestra (1993)","recording_url":"https://www.youtube.com/watch?v=37eZJxF3XKo","recording_locator":"Buscar o N.º 17 das Danzas polovtsianas; dentro del, o corte estándar comeza despois de [B] e chega a 6 compases despois de [D]. En repertorios recentes tamén aparecen subcortes do mesmo número, polo que a marca de ensaio é preferible a un minutaxe único."}],"study":["Distinguir desde o inicio o carácter do n.º 8 e o do n.º 17: lixeireza/elasticidade fronte a enerxía/precisión.","Escoitar a escena completa con coro e danza para non estudar os extractos como fragmentos abstractos.","Traballar o n.º 17 con ritmos modificados e agrupacións, volvendo sempre á acentuación real da danza.","Comentar en clase o contexto histórico do orientalismo: a música representa aos polovtsianos desde unha estética rusa decimonónica, non como documento etnográfico neutral."],"score_url":"https://imslp.org/wiki/Prince_Igor_(opera)_(Borodin%2C_Aleksandr)","score_note":"IMSLP ofrece a partitura da ópera e materiais das Danzas polovtsianas. Para esta biblioteca, os cortes de referencia son N.º 8 inicio–[B] e N.º 17 despois de [B]–6 despois de [D].","recording":"Valery Gergiev · Mariinsky Theatre Orchestra · gravación de 1993 (vídeo dispoñible en YouTube).","recording_url":"https://www.youtube.com/watch?v=37eZJxF3XKo","recording_note":"A gravación é continua; para localizar os solos úsanse os números da partitura (N.º 8 e N.º 17) e as letras de ensaio, máis fiables ca un minuto aproximado.","sources":[["Excerpts.one · Borodin, Polovtsian Dances","https://excerpts.one/instruments/clarinet/borodinpolovtsian.html"],["Peabody · Clarinet Audition Repertoire 2018","https://peabody.jhu.edu/wp-content/uploads/2018/05/PLEA-2018-Clarinet-Excerpts-Book.pdf"],["Philharmonia · notas de programa","https://philharmonia-assets.s3.amazonaws.com/uploads/2022/04/07.04.22_RFH-online.pdf"],["Mariinsky · Prince Igor","https://www.mariinsky.ru/en/playbill/opera_conchall/igor/"],["Gergiev / Mariinsky 1993 · YouTube","https://www.youtube.com/watch?v=37eZJxF3XKo"]],"portrait_url":"https://commons.wikimedia.org/wiki/Special:FilePath/Borodin_by_Repin.jpg?width=500","portrait_credit":"Aleksandr Borodín, retrato de Iliá Repin (1888) · Wikimedia Commons","portrait_source":"https://commons.wikimedia.org/wiki/File:Borodin_by_Repin.jpg","reviewed":"2026-10-01"},{"id":"2-2-16","course":2,"quarter":2,"instrument":"Requinto","composer":"Berlioz","work":"Sinfonía fantástica","probespiel":"33","status":"Ficha revisada · lista","summary":"Un dos grandes solos de requinto do repertorio: no V movemento, “Songe d’une nuit du Sabbat”, Berlioz transforma a idée fixe da amada nunha caricatura grotesca. O clarinete en Mi♭ convértese na voz aguda, mordaz e burlona da visión de aquelarre.","composer_bio":"Hector Berlioz (1803–1869) foi compositor, crítico e director francés, figura central do Romanticismo. Estudou no Conservatorio de París e desenvolveu unha linguaxe marcada pola música programática, a expansión da orquestra e unha imaxinación tímbrica excepcional. A súa carreira estivo estreitamente ligada á literatura —Shakespeare, Goethe, Byron— e á procura de novas formas de narración musical. A Symphonie fantastique, composta cando tiña 26 anos, converteuse nunha das obras decisivas para a historia da orquestración e do poema sinfónico romántico.","work_context":"A Symphonie fantastique, op. 14 (1830), é unha sinfonía programática en cinco movementos. Berlioz constrúe a historia dun artista obsesionado por unha muller idealizada, representada por un tema recorrente que chamou “idée fixe”. Tras soñar coa súa propia execución no IV movemento, o protagonista asiste no V a un aquelarre no que reaparece a amada transformada nunha figura vulgar e grotesca. Berlioz publicou un programa literario para orientar a escoita e utilizou a orquestra como auténtico medio dramático.","excerpts":[{"name":"V. Songe d’une nuit du Sabbat · idée fixe deformada","location":"Clarinete 1.º en Mi♭. Núcleo estándar de audición: [63] ata 4–6 compases despois de [64]. Algunhas listas profesionais amplían o corte ata aproximadamente os cc. 40–78.","context":"No aquelarre final reaparece a melodía asociada á amada, pero xa non como tema lírico: Berlioz preséntaa deliberadamente deformada e ridiculizada. O requinto introduce esa nova versión inmediatamente antes de que a escena se intensifique co Dies irae e a ronda das bruxas.","role":"É unha voz de personaxe. O requinto non debe soar simplemente “agudo”: representa a amada convertida en bruxa, cunha cor penetrante, sarcástica e teatral que debe atravesar a textura sen perder precisión.","technique":"Ritmo moi controlado, articulación nítida, trinos regulares, grande seguridade no rexistro agudo e capacidade de levar os crescendi sen endurecer a emisión. John Bruce Yeh (CSO) destaca precisamente carácter, ritmo, articulación e dinámicas como claves do fragmento.","pages":"EP8661 p. 33 · V movemento","recording":"John Bruce Yeh · Chicago Symphony Orchestra · Orchestral Excerpt Insight","recording_url":"https://chicagosymphony.org/inside-the-music/csotv/videos/orchestral-excerpt-insights/yeh-plays-berlioz/","recording_locator":"Vídeo dedicado especificamente ao solo de requinto: a demostración e o comentario céntranse no fragmento [63]–[64]. Para escoitalo dentro da obra completa, vai á pista V e segue a marca [63]."}],"study":["Escoitar primeiro a idée fixe no I movemento e comparala coa súa caricatura no V: mesma identidade temática, carácter completamente distinto.","Traballar o fragmento a tempo lento marcando exactamente ritmo, articulación e progresión dinámica antes de buscar o carácter grotesco.","Practicar trinos e notas agudas illadamente, pero reincorporalos axiña á frase: o efecto teatral depende da continuidade, non dunha sucesión de dificultades técnicas.","Facer unha toma “de audición” e outra esaxerando o personaxe; despois buscar un punto intermedio no que a intención se perciba sen perder control."],"score_url":"https://imslp.org/wiki/Symphonie_fantastique%2C_H_48_(Berlioz%2C_Hector)","score_note":"IMSLP: partitura xeral e particellas. O extracto de requinto está no V movemento.","recording":"Boston Symphony Orchestra · Charles Münch (RCA, 1954; remasterización Sony Classical).","recording_url":"https://classical.music.apple.com/us/album/1166118267","recording_note":"A gravación está separada por movementos; o V (“Dream of the Witches’ Sabbath”) dura aprox. 8:47. Para localizar o solo con seguridade, usa [63]–[64] na partitura. O vídeo da CSO enlazado no extracto permite escoitalo illado.","sources":[["OFGC: EP8661, Berlioz Symphonie fantastique, V movemento, p. 33","https://es.scribd.com/document/731018234/1712924581721-bases-audiciones-junio-definitivo"],["Carnegie Hall NYO2: corte de requinto [63]–6 despois de [64]","https://www.carnegiehall.org/Education/Programs/National-Youth-Ensembles/NYO2/Apply/Audition-Excerpts"],["Singapore Symphony: variante ampliada, V movemento cc. 40–78","https://web-assets.sso.org.sg/documents/Auditions/Principal-Clarinet-2025-Application-Guidance.pdf"],["Berliner Philharmoniker: programa, idée fixe e papel do clarinete agudo no finale","https://www.berliner-philharmoniker.de/en/programme-notes/hector-berlioz-symphonie-fantastique-op-14/"],["Chicago Symphony: John Bruce Yeh explica e interpreta o solo","https://chicagosymphony.org/inside-the-music/csotv/videos/orchestral-excerpt-insights/yeh-plays-berlioz/"],["Apple Music Classical: Münch / Boston Symphony, 1954","https://classical.music.apple.com/us/album/1166118267"],["IMSLP: Symphonie fantastique","https://imslp.org/wiki/Symphonie_fantastique%2C_H_48_(Berlioz%2C_Hector)"]],"portrait_url":"https://commons.wikimedia.org/wiki/Special:Redirect/file/Portrait_de_Berlioz%2C_Hector%2C_%281803-1869%29%2C_%28compositeur%29%2C_PH47135_%281_of_2%29.jpg","influences":"A obra naceu do impacto que produciron en Berlioz Shakespeare e a actriz Harriet Smithson, da que se namorou tras vela actuar en París, e tamén do ambiente literario romántico relacionado co soño, o delirio e o opio. Beethoven —especialmente a idea dunha sinfonía con contido extramusical— foi unha referencia estrutural importante. No V movemento Berlioz combina a idée fixe deformada, campás, o canto gregoriano Dies irae e a Ronde du Sabbat para construír unha escena teatral dentro da propia sinfonía.","period":"Romanticismo · primeira metade do século XIX","genre":"Sinfonía programática en cinco movementos, op. 14 / H 48","year":"1830; revisada posteriormente","work_structure":"I Rêveries–Passions · II Un bal · III Scène aux champs · IV Marche au supplice · V Songe d’une nuit du Sabbat","portrait_credit":"Hector Berlioz · Atelier Nadar / Musée Carnavalet · CC0","portrait_source":"https://commons.wikimedia.org/wiki/File:Portrait_de_Berlioz,_Hector,_(1803-1869),_(compositeur),_PH47135_(1_of_2).jpg","reviewed":"2026-10-01"},{"id":"2-2-17","course":2,"quarter":2,"instrument":"Requinto","composer":"Ravel","work":"Concerto para piano en Sol maior","probespiel":"34","status":"Ficha revisada · lista","summary":"O Concerto en Sol de Ravel utiliza o requinto como unha cor extrema e brillante dentro dunha orquestra relativamente pequena. O EP8661 recolle o III movemento, pero as audicións actuais piden tamén con frecuencia pasaxes do I; por iso a ficha separa ambos contextos.","composer_bio":"Maurice Ravel (1875–1937) foi compositor, pianista e orquestrador francés, nacido en Ciboure, no País Vasco francés. A súa música combina precisión formal, refinamento tímbrico e interese por danzas, músicas antigas, tradicións hispánicas e linguaxes modernas. Foi un dos grandes mestres da orquestración do século XX; obras como Daphnis et Chloé, Boléro, La valse e os dous concertos para piano mostran unha escritura na que a elección de cada timbre forma parte da propia estrutura musical.","work_context":"Ravel compuxo o Concerto para piano en Sol entre 1929 e 1931, en paralelo ao Concerto para a man esquerda. Pensou inicialmente en estrealo el mesmo, pero finalmente foi Marguerite Long a solista da primeira interpretación en París, o 14 de xaneiro de 1932, co propio Ravel no podio. El describiu a obra como un “verdadeiro concerto” no espírito de Mozart e Saint-Saëns: brillante, claro e virtuosístico, non unha loita pesada entre piano e orquestra.","excerpts":[{"name":"I. Allegramente · pasaxe de requinto na recapitulación","location":"Corte moderno habitual: 6 compases despois de [18] ata 3 despois de [19]. Algunhas listas engaden ademais a intervención de [24].","context":"Na recapitulación, Ravel devolve o primeiro material cunha instrumentación máis incisiva. O requinto únese ás madeiras agudas e contribúe a facer que a volta do tema teña máis brillo e mordente ca na exposición.","role":"Cor solista/aguda dentro dun relevo de madeiras: debe emerxer con precisión e carácter sen romper a transparencia da orquestración. É un exemplo perfecto do requinto como “luz” tímbrica.","technique":"Ataques limpos, afinación no rexistro agudo, articulación curta pero non seca, flexibilidade para encaixar co piccolo/frauta/oboe e control do forte sen estridencia.","pages":"Non é o corte principal impreso en EP8661 p. 34; aparece con frecuencia en listas modernas de requinto.","recording":"Martha Argerich · Berliner Philharmoniker · Claudio Abbado (DG)","recording_url":"https://classical.music.apple.com/us/recording/maurice-ravel-1875-pp27-968865695","recording_locator":"Pista I “Allegramente” (aprox. 8:10). Para localizalo con precisión, segue a partitura desde [18]; o corte comeza 6 compases despois de [18] e remata 3 despois de [19].","materials":[{"type":"pdf","label":"PDF · I movemento, 6 despois de [18]–3 despois de [19]","url":"https://assets.muvac.com/vacancies/jyzdrvmy/docs/663410/1750916408092-principal_clarinet_2025_-_audition_repertoire_booklet_%28updated_26_jun_2025%29.pdf?download=#page=25","source":"Principal Clarinet Audition 2025 · Muvac","note":"O booklet inclúe a partitura do extracto de requinto no I movemento.","coverage":"Extracto exacto"},{"type":"score","label":"Abrir partitura / particella","url":"https://imslp.org/wiki/Piano_Concerto_in_G_major%2C_M.83_(Ravel%2C_Maurice)","source":"IMSLP","note":"Partitura/particella completa; localizar o corte coas marcas indicadas na ficha.","coverage":"Partitura completa"}]},{"name":"III. Presto · comezo do movemento","location":"[1] ata aproximadamente 3 compases antes de [2] nunha delimitación frecuente de audición. O EP8661 sitúa o concerto, III movemento, na p. 34.","context":"O finale comeza como unha maquinaria vertixinosa de music-hall. O requinto intervén en combinación co piccolo e o trombón con xestos deliberadamente agudos e incisivos, case caricaturescos.","role":"Non é un solo cantabile, senón unha cor de ataque: brillante, rápida e teatral. Debe ter carácter sen perder sincronización co resto da textura.","technique":"Precisión extrema de ritmo e ataques, dominio do rexistro sobreagudo, articulación rápida, control de intervalos e capacidade de entrar con seguridade desde o silencio.","pages":"EP8661 p. 34 · III movemento","recording":"Accademia Nazionale di Santa Cecilia · extracto de requinto (Lorenzo Russo Clarinet)","recording_url":"https://www.youtube.com/watch?v=gWrtb3HE9gI","recording_locator":"Vídeo dedicado especificamente ao extracto do III movemento: o solo aparece desde o inicio do vídeo. Na partitura, toma [1] como referencia."},{"name":"III. Presto · pasaxe posterior [18]–[20]","location":"[18]–[20] nunha delimitación frecuente en audicións profesionais de requinto.","context":"Nunha fase posterior do finale reaparece o papel incisivo do requinto dentro da textura motórica e humorística do movemento.","role":"Cor penetrante e precisa dentro dunha textura moi cargada. A prioridade é ser rítmicamente fiable e manter unha sonoridade enfocada.","technique":"Resistencia, afinación en forte, articulación de alta velocidade e limpeza en cambios de rexistro. Convén estudar co pulso subdividido antes de levar o fragmento ao tempo final.","pages":"Pasaxe adicional frecuente en audicións modernas; comprobar a edición empregada respecto de EP8661.","recording":"Martha Argerich · Berliner Philharmoniker · Claudio Abbado (DG)","recording_url":"https://classical.music.apple.com/us/recording/maurice-ravel-1875-pp27-968865695","recording_locator":"Pista III “Presto” (aprox. 4:02). Localización segura por partitura: [18]–[20].","materials":[{"type":"pdf","label":"PDF · III movemento [18]–[20]","url":"https://finearts-music.unimelb.edu.au/__data/assets/pdf_file/0029/475481/2026Clarinets_FINAL.pdf#page=16","source":"University of Melbourne · 2026","note":"A p. 16 do PDF imprime o extracto de requinto desde Fig. 18 ata Fig. 20.","coverage":"Extracto exacto"},{"type":"score","label":"Abrir partitura / particella","url":"https://imslp.org/wiki/Piano_Concerto_in_G_major%2C_M.83_(Ravel%2C_Maurice)","source":"IMSLP","note":"Partitura/particella completa; localizar o corte coas marcas indicadas na ficha.","coverage":"Partitura completa"}]}],"study":["Comparar o I e o III movementos: no primeiro o requinto intégrase nunha recapitulación de gran refinamento; no terceiro convértese nunha cor case de music-hall.","Practicar os ataques agudos por parellas de instrumentos: primeiro imaxinando a afinación co piccolo/frauta, despois co trombón e co piano.","Non confundir “brillante” con “forte”: buscar núcleo de son e proxección, especialmente no rexistro agudo.","Facer unha lectura coa partitura xeral para identificar a orquestración arredor de [18]–[19] no I e [1]/[18]–[20] no III."],"score_url":"https://imslp.org/wiki/Piano_Concerto_in_G_major%2C_M.83_(Ravel%2C_Maurice)","score_note":"IMSLP: partitura xeral e materiais segundo dispoñibilidade. O EP8661 recolle o III movemento na p. 34.","recording":"Martha Argerich · Berliner Philharmoniker · Claudio Abbado (DG, 1967).","recording_url":"https://classical.music.apple.com/us/recording/maurice-ravel-1875-pp27-968865695","recording_note":"A gravación está dividida en tres pistas: I 8:10, II 9:02, III 4:02. Nas fichas de cada extracto usamos marcas de ensaio para atopar o pasaxe con máis seguridade ca un minuto aproximado.","sources":[["OFGC: EP8661, Ravel Concerto en Sol, III movemento, p. 34","https://es.scribd.com/document/731018234/1712924581721-bases-audiciones-junio-definitivo"],["Singapore Symphony 2025: cortes de requinto no I e III movementos","https://web-assets.sso.org.sg/documents/Auditions/Principal-Clarinet-2025-Application-Guidance.pdf"],["Detroit Symphony: I [18]–3 despois de [19]; III [1]–antes de [2] e [18]–[20]","https://www.scribd.com/document/794946642/DSO-Audition-Excerpts-2"],["Boston Symphony: contexto, data de estrea e orquestración con clarinetes en Mi♭ e Si♭","https://www.bso.org/works/ravel-piano-concerto-in-g"],["New Jersey Symphony: proxecto vasco previo, xira americana e influencia do jazz","https://www.njsymphony.org/program_notes/detail/program-notes---jean-yves-thibaudet-plays-ravel"],["Tucson Symphony: carácter dos tres movementos e presenza do jazz/elementos vascos","https://www.tucsonsymphony.org/program-notes/ravel/piano-concerto-in-g/"],["Apple Music Classical: Argerich / Abbado / Berliner Philharmoniker","https://classical.music.apple.com/us/recording/maurice-ravel-1875-pp27-968865695"],["YouTube: extracto de requinto do III movemento, Accademia Nazionale di Santa Cecilia","https://www.youtube.com/watch?v=gWrtb3HE9gI"],["IMSLP: Concerto para piano en Sol maior","https://imslp.org/wiki/Piano_Concerto_in_G_major%2C_M.83_(Ravel%2C_Maurice)"]],"portrait_url":"https://commons.wikimedia.org/wiki/Special:Redirect/file/Maurice_Ravel_1925.jpg","influences":"No concerto conflúen varias linguaxes moi características de Ravel. Parte do material relacionouse cun antigo proxecto de “rapsodia vasca”; a viaxe de Ravel por Norteamérica en 1928 reforzou o seu interese polo jazz; e a forma xeral mira a Mozart e Saint-Saëns. O I movemento mestura vitalidade vasca, xiros hispánicos e harmonías/rítmica de jazz; o II é unha extensa cantilena de aparencia clásica; e o III é un Presto de carácter case circense e music-hall, onde o requinto, o piccolo e o trombón funcionan como cores especialmente incisivas.","period":"Século XX · modernidade francesa / neoclasicismo","genre":"Concerto para piano e orquestra en tres movementos, M. 83","year":"1929–1931 · estrea 1932","work_structure":"I Allegramente · II Adagio assai · III Presto","portrait_credit":"Maurice Ravel, retrato publicado en 1925 · BnF / Wikimedia Commons · dominio público","portrait_source":"https://commons.wikimedia.org/wiki/File:Maurice_Ravel_1925.jpg","reviewed":"2026-10-01"},{"id":"2-2-18","course":2,"quarter":2,"instrument":"Requinto","composer":"Mahler","work":"Sinfonía n.º 1","probespiel":"—","status":"Ficha revisada · lista","summary":"A Primeira Sinfonía vista desde o requinto. Mahler usa o clarinete en Mi♭ como unha cor expresiva de primeiro nivel: no I movemento participa no mundo de chamadas de natureza e no III achega unha voz aguda e áspera á marcha fúnebre e ás súas desviacións populares. As listas de audición adoitan seleccionar pasaxes de ambos movementos.","composer_bio":"Gustav Mahler (1860–1911) foi compositor e director austro-bohemio, unha das figuras fundamentais da transición entre o Romanticismo tardío e a modernidade musical. Desenvolveu unha carreira extraordinaria como director de ópera e orquestra —entre outros postos, na Ópera da Corte de Viena— e concentrou a súa creación principalmente na canción e na sinfonía. As súas obras combinan formas de gran escala con materiais populares, marchas, danzas, cantos de natureza e contrastes extremos de carácter e orquestración.","work_context":"A Primeira Sinfonía foi composta principalmente entre 1887 e 1888, cando Mahler traballaba en Leipzig, e estreouse en Budapest en 1889 baixo a súa dirección. A obra foi revisada varias veces: inicialmente tivo cinco movementos e unha lectura programática asociada ao título “Titan”, pero Mahler acabou eliminando o movemento Blumine e retirando os textos explicativos. A versión definitiva ten catro movementos. O primeiro evoca a natureza espertando; o segundo parte do Ländler; o terceiro converte Bruder Martin / Frère Jacques nunha marcha fúnebre de humor escuro; e o finale conduce o conflito cara a unha conclusión triunfal.","excerpts":[{"name":"I. Langsam, schleppend · pasaxe de requinto arredor de [9]–[11]","location":"Corte habitual de instrumento auxiliar: 5 compases despois de [9] ata 3 despois de [11]. Algunhas listas profesionais seleccionan outros fragmentos do I movemento, por exemplo arredor de [30]–[33].","context":"O primeiro movemento constrúe unha paisaxe sonora de natureza: pedais, chamadas afastadas, intervalos descendentes e pequenas figuras de paxaros/cuco. O requinto engade unha cor especialmente brillante a esa rede de sinais.","role":"Cor de natureza e proxección aguda dentro da madeira. Debe soar claro e incisivo, pero integrado nunha textura de ecos, non como un solo operístico.","technique":"Entradas seguras desde dinámicas contidas, afinación do rexistro agudo, articulación curta e moi regular, e control da cor para non sobresaír máis do necesario.","pages":"Non figura en EP8661","recording":"Lorenzo Russo Clarinet · Mahler Symphony No. 1, Eb Clarinet excerpt (mov. I)","recording_url":"https://www.youtube.com/watch?v=EGFUup4kO5I","recording_locator":"Vídeo dedicado ao pasaxe de requinto do I movemento: a referencia auditiva aparece directamente, sen ter que buscar dentro da sinfonía completa.","materials":[{"type":"pdf","label":"PDF · Mahler 1 · requinto","url":"https://www.nyys.org/wp-content/uploads/2022/10/22-23-Clarinet-excerpts-orchestra-audition-nyyss.pdf","source":"New York Youth Symphony","note":"O paquete inclúe os extractos opcionais de Mi♭ do I e III movementos.","coverage":"Extractos exactos"},{"type":"score","label":"Abrir partitura / particella","url":"https://imslp.org/wiki/Symphony_No.1_(Mahler%2C_Gustav)","source":"IMSLP","note":"Partitura/particella completa; localizar o corte coas marcas indicadas na ficha.","coverage":"Partitura completa"}]},{"name":"III. Feierlich und gemessen · marcha fúnebre / contracanto de requinto","location":"Un corte profesional actual abrangue 4 compases antes de [14] ata [17]. A literatura sobre o instrumento tamén destaca o emprego das dúas clarinetas en Mi♭ no III movemento; os límites exactos varían segundo a audición.","context":"O movemento parte de Bruder Martin / Frère Jacques en modo menor, presentado como marcha fúnebre. Sobre a procesión aparecen voces de madeira cada vez máis incisivas e episodios de carácter popular; o requinto introduce unha cor aguda deliberadamente incómoda e irónica.","role":"Contracanto e cor expresiva. O seu timbre afiado contribúe á mestura de solemnidade, parodia e música de rúa que fai tan particular este movemento.","technique":"Control de afinación en rexistro medio/agudo, articulación con carácter, equilibrio con oboes e outras clarinetas e capacidade de pasar dunha cor seca/irónica a unha integración máis orquestral.","pages":"Non figura en EP8661","recording":"Lorenzo Russo Clarinet · Mahler Symphony No. 1, Eb Clarinet excerpts (mov. III)","recording_url":"https://www.youtube.com/watch?v=agTCFpa8Iic","recording_locator":"Vídeo dedicado aos extractos de requinto do III movemento. Para a partitura, usa como referencia o corte 4 antes de [14]–[17].","materials":[{"type":"pdf","label":"PDF · Mahler 1 · requinto","url":"https://www.nyys.org/wp-content/uploads/2022/10/22-23-Clarinet-excerpts-orchestra-audition-nyyss.pdf","source":"New York Youth Symphony","note":"O paquete inclúe os extractos opcionais de Mi♭ do I e III movementos.","coverage":"Extractos exactos"},{"type":"score","label":"Abrir partitura / particella","url":"https://imslp.org/wiki/Symphony_No.1_(Mahler%2C_Gustav)","source":"IMSLP","note":"Partitura/particella completa; localizar o corte coas marcas indicadas na ficha.","coverage":"Partitura completa"}]}],"study":["Escoitar o I movemento completo e identificar cantas chamadas de natureza pasan por instrumentos distintos; despois decidir que tipo de cor debe aportar o requinto.","No III movemento, comparar primeiro o tema de Bruder Martin no contrabaixo coa aparición posterior das madeiras e do requinto: a función expresiva cambia radicalmente.","Traballar ambos pasaxes buscando dúas cores distintas: máis transparente/natural no I e máis incisiva/irónica no III.","Practicar os cortes inmediatamente despois de tocar clarinete en Si♭ para simular un cambio real de instrumento e comprobar afinación, embocadura e resposta."],"score_url":"https://imslp.org/wiki/Symphony_No.1_(Mahler%2C_Gustav)","score_note":"IMSLP: partitura xeral e particellas. Esta ficha céntrase no clarinete en Mi♭ / requinto; non aparece no EP8661.","recording":"Bavarian Radio Symphony Orchestra · Rafael Kubelík (DG, 1968).","recording_url":"https://classical.music.apple.com/gb/recording/gustav-mahler-1860-pp1-1699680642","recording_note":"A gravación está dividida en catro pistas (I aprox. 14:30; III aprox. 10:36). Para os pasaxes concretos a ficha enlaza vídeos de extracto, máis rápidos para o estudo diario.","sources":[["Mahler Foundation: orquestración e presenza de 2 clarinetes en Mi♭ no III movemento","https://www.mahlerfoundation.org/mahler/compositions/symphony-no-1/symphony-no-1-orchestration/"],["Utah Symphony: marcha fúnebre, Bruder Martin e contracanto do requinto no III","https://usuo.org/explore/2014/09/mahler-1-listening-guide/"],["SODELO: corte de requinto no I, 5 despois de [9]–3 despois de [11]","https://www.sodelomusic.org/general-8-1"],["Seoul Philharmonic: cortes de requinto no I e III movementos","https://www.scribd.com/document/848674929/%E1%84%8E%E1%85%A5%E1%86%B7%E1%84%87%E1%85%AE-Attached-Document-4-%E1%84%89%E1%85%B5%E1%86%AF%E1%84%80%E1%85%B5%E1%84%8C%E1%85%A5%E1%86%AB%E1%84%92%E1%85%A7%E1%86%BC-%E1%84%8B%E1%85%A7%E1%86%AB%E1%84%8C%E1%85%AE-%E1%84%80%E1%85%A9%E1%86%A8%E1%84%86%E1%85%A9%E1%86%A8-%E1%84%8C%E1%85%A5%E1%86%AB%E1%84%8E%E1%85%A6"],["YouTube: Mahler 1, requinto, I movemento · Lorenzo Russo","https://www.youtube.com/watch?v=EGFUup4kO5I"],["YouTube: Mahler 1, requinto, III movemento · Lorenzo Russo","https://www.youtube.com/watch?v=agTCFpa8Iic"],["Apple Music Classical: Kubelík / Bavarian Radio Symphony Orchestra","https://classical.music.apple.com/gb/recording/gustav-mahler-1860-pp1-1699680642"],["IMSLP: Symphony No. 1","https://imslp.org/wiki/Symphony_No.1_(Mahler%2C_Gustav)"]],"portrait_url":"https://commons.wikimedia.org/wiki/Special:Redirect/file/Gustav%20Mahler%20by%20Dupont%20%281909%29.jpg","influences":"Mahler integra canción, natureza, danza popular e ironía dentro da sinfonía. O I movemento reutiliza material de Lieder eines fahrenden Gesellen e está cheo de chamadas e ecos; o III mestura a marcha fúnebre de Bruder Martin con episodios de sabor popular/klezmer. Nesa paleta, o requinto non é só un reforzo agudo: funciona como unha cor psicolóxica, ás veces brillante e ás veces deliberadamente áspera ou grotesca.","period":"Romanticismo tardío · fin de século","genre":"Sinfonía en catro movementos (versión definitiva), GMW 11","year":"1887–1888; revisada posteriormente","work_structure":"I Langsam, schleppend · II Kräftig bewegt · III Feierlich und gemessen · IV Stürmisch bewegt. Mahler emprega requinto en momentos seleccionados e reforza a súa presenza no grande clímax final.","portrait_credit":"Gustav Mahler, estudio A. Dupont (1909) · Library of Congress / Wikimedia Commons","portrait_source":"https://commons.wikimedia.org/wiki/File:Gustav_Mahler_by_Dupont_(1909).jpg","reviewed":"2026-10-01"},{"id":"3-1-19","course":3,"quarter":1,"instrument":"Clarinete en Si♭ e La","composer":"Rossini","work":"O barbeiro de Sevilla","probespiel":"20–21","status":"Ficha revisada · lista","summary":"Ópera bufa en dous actos (1816). Para clarinete hai dous extractos claramente independentes no EP8661: a Obertura e a N.º 2, Cavatina de Fígaro “Largo al factotum”. Deben estudarse e localizarse como pasaxes diferentes da mesma obra.","composer_bio":"Gioachino Rossini (1792–1868) foi o compositor de ópera máis célebre da súa xeración en Italia e unha figura esencial na evolución do bel canto. Entre 1810 e 1829 escribiu máis de trinta óperas. A súa linguaxe combina melodía vocal, ritmo teatral, articulación extremadamente precisa e o chamado “crescendo rossiniano”, no que repetición, dinámica e densidade instrumental acumulan enerxía.","work_context":"Il barbiere di Siviglia ten libreto de Cesare Sterbini sobre a comedia de Beaumarchais e estreouse no Teatro Argentina de Roma o 20 de febreiro de 1816. A primeira función foi accidentada, pero a obra consolidouse rapidamente como unha das grandes óperas cómicas do repertorio. A Obertura non foi escrita especificamente para esta historia: Rossini reutilizouna de óperas anteriores, polo que funciona como brillante preparación teatral máis que como resumo temático do argumento. “Largo al factotum”, en cambio, é a entrada escénica de Fígaro e define de inmediato o seu carácter enérxico e autosuficiente.","excerpts":[{"name":"Obertura","location":"Antes do Acto I. En listas profesionais actuais aparece, por exemplo, desde [14] ata [17].","context":"Introdución lenta seguida dun Allegro brillante. O fragmento pertence á obertura instrumental e non á escena de Fígaro.","role":"O clarinete alterna función de sección con material melódico e participa nos contrastes e acumulacións de enerxía típicos de Rossini. O estilo debe ser elegante, vivo e nunca pesado.","technique":"Articulación clara, precisión rítmica, ataques coordinados, control do crescendo, flexibilidade de fraseo e afinación co resto das madeiras.","pages":"EP8661: pp. 20–21 (Obertura)","recording":"London Symphony Orchestra · Claudio Abbado (Deutsche Grammophon)","recording_url":"https://www.youtube.com/watch?v=rYm77w-Zt-g","recording_locator":"O enlace abre a Obertura. Para ir directamente ao extracto, usa as marcas [14]–[17] da particella; os minutos cambian segundo a edición/gravación."},{"name":"N.º 2 · Cavatina de Fígaro: “Largo al factotum”","location":"Acto I, entrada de Fígaro. Referencia profesional: desde [31]. O final do corte varía segundo a convocatoria: Bilbao 2026 chega ata 15 compases antes de [32]; Manchester Camerata usa desde [31] ata 27 compases despois.","context":"É a gran presentación de Fígaro. A voz leva o protagonismo dramático mentres a orquestra sostén un acompañamento moi activo, cheo de resposta, impulso e comicidade.","role":"O clarinete non debe competir coa voz: forma parte dunha maquinaria teatral moi precisa. O seu carácter ten que encaixar coa dicción rápida do barítono e co constante crecemento de enerxía.","technique":"Pulso férreo, articulación limpa, ataques en conxunto, crescendi progresivos, control da dinámica baixo a voz e resistencia a tempo vivo.","pages":"EP8661: pp. 20–21 (N.º 2 Kavatine)","recording":"Hermann Prey · London Symphony Orchestra · Claudio Abbado (Deutsche Grammophon)","recording_url":"https://www.youtube.com/watch?v=kaHnyXoDdQk","recording_locator":"O enlace abre directamente “Largo al factotum”. Segue a particella ata a marca [31]; ese é o punto de inicio do extracto. O punto final depende da convocatoria."}],"study":["Tratar Obertura e Cavatina como dous extractos distintos, aínda que pertenzan á mesma obra e ás mesmas páxinas do Probespiel.","Na Cavatina, escoitar primeiro a voz de Fígaro e despois repetir a audición seguindo exclusivamente a liña do clarinete.","Comparar o fraseo instrumental da Obertura coa articulación case “falada” de Largo al factotum.","Anotar na particella que os límites do corte de Cavatina non son universais: [31] é a referencia estable, pero o final cambia segundo a proba."],"score_url":"https://imslp.org/wiki/Il_barbiere_di_Siviglia_(Rossini%2C_Gioacchino)","score_note":"IMSLP: partitura completa e materiais orixinais. Comprobar a afinación/instrumento da parte histórica fronte ás transcricións modernas.","recording":"Dúas gravacións de referencia independentes: Abbado/LSO para a Obertura e Prey-Abbado/LSO para “Largo al factotum”.","recording_url":"https://www.youtube.com/watch?v=rYm77w-Zt-g","recording_note":"Cada extracto ten o seu propio enlace e un localizador por número de ensaio, máis fiable que un minuto común a todas as versións.","sources":[["RCSMM: Orchester-Probespiel, Rossini · Obertura e Cavatina, pp. 20–21","https://rcsmm.eu/sites/default/files/upload-files/Listado%20pasajes%20orquestales%20pruebas%20MIS%202025.pdf"],["Bilbao Orkestra Sinfonikoa 2026: Obertura [14]–[17] e Cavatina [31]","https://assets.muvac.com/vacancies/qy7exndy/docs/884753/1781167004916-2026_06_11_resolucin_04.06.2026_convocatoria_ope_clarinete_solista_bil.pdf?download="],["Manchester Camerata: Cavatina, [31] + 27 compases","https://manchestercamerata.co.uk/wp-content/uploads/2025/03/Clarinet-Excerpts.pdf"],["Metropolitan Opera: obra, libreto e estrea","https://www.metopera.org/discover/education/educator-guides-archive/barbiere/"],["IMSLP: Il barbiere di Siviglia","https://imslp.org/wiki/Il_barbiere_di_Siviglia_(Rossini%2C_Gioacchino)"]],"portrait_url":"https://commons.wikimedia.org/wiki/Special:Redirect/file/Rossini-portrait-0.jpg","period":"Primeiro Romanticismo · ópera italiana / bel canto","genre":"Ópera bufa en dous actos","year":"1816","work_structure":"Obertura + Actos I e II. O segundo extracto da biblioteca pertence ao Acto I, N.º 2, cavatina de entrada de Fígaro.","influences":"O libreto deriva directamente de Le Barbier de Séville de Beaumarchais. A escritura instrumental está profundamente ligada ao pensamento vocal: fraseo flexible, articulación que imita a dicción e capacidade de facer crecer a tensión con repetición e crescendo. Para o clarinetista, pensar “como un cantante” é tan importante como tocar limpo.","portrait_credit":"Gioachino Rossini, retrato de Vincenzo Camuccini (1815) · Wikimedia Commons","portrait_source":"https://commons.wikimedia.org/wiki/File:Rossini-portrait-0.jpg","reviewed":"2026-10-01"},{"id":"3-1-20","course":3,"quarter":1,"instrument":"Clarinete en Si♭ e La","composer":"Stravinski","work":"O paxaro de lume","probespiel":"—","status":"Ficha revisada · lista","summary":"Ballet de 1910 para os Ballets Russes e unha das obras que lanzaron internacionalmente a Stravinski. Para clarinete, a biblioteca distingue dous extractos de audición da Suite de 1919: a célebre Variación do Paxaro de Lume e, como pasaxe técnico adicional frecuente, a Danza infernal de Kashchei.","composer_bio":"Igor Stravinski (1882–1971) foi un compositor nacido no Imperio ruso e posteriormente cidadán francés e estadounidense. Formouse en San Petersburgo e recibiu orientación privada de Nik
